<style>
.r-rally {
  --ground: #0e0b09;
  --ink: #efebe4;
  --ink2: #a39d93;
  --ink3: #6f695f;
  --cobalt: #2b3bff;
  --warm: #e39c4a;
  --green: #62c47e;
  --fs: max(10px, 1.12cqw);
  --fs-s: max(10px, 1cqw);
  --fs-name: max(11px, 1.4cqw);
  --fs-cap: max(10px, 0.82cqw);
  --fs-flap: max(17px, 2.4cqw);
  --lift: 1.5cqw;
  --pad: 6.6cqw;
  --avatar: 4cqw;
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: Inter, system-ui, sans-serif;
  line-height: 1.25;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  pointer-events: none;
}
.r-rally canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* scoreboard */
.r-rally .r-rally__score {
  position: absolute; left: 50%; top: 0;
  transform: translate(-50%, 0);
  display: flex; align-items: center; gap: 0.75em;
  padding: 0.4em 0.45em 0.4em 1em;
  border-radius: 0.7em;
  background: linear-gradient(#1c1714, #141009);
  box-shadow: inset 0 0 0 1px rgba(239, 235, 228, 0.08), 0 0.8em 2em rgba(0, 0, 0, 0.5);
  font-size: var(--fs);
}
.r-rally .r-rally__score-k {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: var(--fs-cap); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink2);
}
.r-rally .r-rally__flap {
  position: relative; display: block;
  width: 1.2em; height: 1.46em;
  font-size: var(--fs-flap); font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.r-rally .r-rally__half {
  position: absolute; left: 0; right: 0; height: 50%; overflow: hidden;
  background: linear-gradient(#2b241f, #231d19);
  backface-visibility: hidden;
}
.r-rally .r-rally__half--t { top: 0; border-radius: 0.16em 0.16em 0 0; transform-origin: 50% 100%; }
.r-rally .r-rally__half--b { bottom: 0; border-radius: 0 0 0.16em 0.16em; transform-origin: 50% 0; background: linear-gradient(#221c18, #1b1613); }
.r-rally .r-rally__half b {
  position: absolute; left: 0; right: 0; height: 200%;
  display: flex; align-items: center; justify-content: center; font-weight: 600;
}
.r-rally .r-rally__half--t b { top: 0; }
.r-rally .r-rally__half--b b { bottom: 0; }
.r-rally .r-rally__leaf { visibility: hidden; }
.r-rally .r-rally__flap::after {
  content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; margin-top: -0.5px;
  background: rgba(0, 0, 0, 0.8);
}

/* bats */
.r-rally .r-rally__paddle {
  position: absolute; left: 0; top: 0;
  width: var(--pad); height: var(--pad);
  will-change: transform;
}
.r-rally .r-rally__paddle > svg { position: absolute; left: 0; top: 0; width: 100%; height: 168%; overflow: visible; }
.r-rally .r-rally__pglow {
  position: absolute; inset: -45%; border-radius: 50%; opacity: 0;
  background: radial-gradient(closest-side, rgba(130, 142, 255, 0.5), rgba(43, 59, 255, 0.16) 55%, rgba(43, 59, 255, 0) 100%);
}
.r-rally .r-rally__mark { position: absolute; left: 29%; top: 29%; width: 42%; height: 42%; color: var(--ink); }
.r-rally .r-rally__mark svg { display: block; width: 100%; height: 100%; }

.r-rally .r-rally__plate { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; }
.r-rally .r-rally__role {
  display: block; font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: var(--fs-cap); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink3); margin-bottom: 0.4em;
}
.r-rally .r-rally__name { display: block; font-size: var(--fs-name); font-weight: 600; letter-spacing: -0.01em; }
.r-rally .r-rally__app { display: block; font-size: var(--fs-s); color: var(--ink2); margin-top: 0.15em; }

/* where the ball lands */
.r-rally .r-rally__chip {
  position: absolute; white-space: nowrap;
  transform: translate(-50%, calc(-100% - var(--lift) + 0.5em)) scale(0.96);
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1.08);
  padding: 0.5em 0.72em; border-radius: 0.6em;
  background: linear-gradient(#1f1a16, #17130f);
  box-shadow: inset 0 0 0 1px rgba(239, 235, 228, 0.09), 0 0.7em 1.8em rgba(0, 0, 0, 0.5);
  font-size: var(--fs);
}
.r-rally .r-rally__chip.is-on { opacity: 1; transform: translate(-50%, calc(-100% - var(--lift))) scale(1); }
.r-rally .r-rally__chip.is-down { transform: translate(-50%, calc(var(--lift) - 0.5em)) scale(0.96); }
.r-rally .r-rally__chip.is-down.is-on { transform: translate(-50%, var(--lift)) scale(1); }
.r-rally .r-rally__chip.is-on.is-past { opacity: 0.5; }
.r-rally.is-still .r-rally__chip.is-on.is-past { opacity: 0.72; }
.r-rally .r-rally__row { display: flex; align-items: center; gap: 0.45em; }
.r-rally .r-rally__mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.r-rally .r-rally__diff { color: var(--ink3); }
.r-rally .r-rally__w { color: var(--warm); font-weight: 600; }
.r-rally .r-rally__g { color: var(--green); font-weight: 600; }
.r-rally .r-rally__b { font-weight: 600; }
.r-rally .r-rally__dot { width: 0.42em; height: 0.42em; border-radius: 50%; background: currentColor; flex: none; }
.r-rally .r-rally__sub { display: block; color: var(--ink2); font-size: var(--fs-s); margin-top: 0.3em; padding-left: 0.87em; }
.r-rally .r-rally__sub + .r-rally__sub { margin-top: 0.1em; }
.r-rally .r-rally__ico { width: 1.05em; height: 1.05em; flex: none; display: block; }

/* you, in the chair */
.r-rally .r-rally__you { position: absolute; width: var(--avatar); height: var(--avatar); transform: translate(-50%, -50%); }
.r-rally .r-rally__head, .r-rally .r-rally__shoulders {
  position: absolute; background: radial-gradient(circle at 50% 30%, #3b322b, #241e19 75%);

.r-rally .r-rally__head { inset: 0; border-radius: 50%; z-index: 1; }

.r-rally .r-rally__you.is-ready .r-rally__head { box-shadow: inset 0 0 0 1px rgba(98, 196, 126, 0.8), 0 0 0 0.28cqw rgba(98, 196, 126, 0.16); }
.r-rally .r-rally__back {
  position: absolute; left: -46%; right: -46%; top: 108%; height: 66%; z-index: 2;
  border-radius: 0.7cqw 0.7cqw 0.3cqw 0.3cqw;
  background: linear-gradient(#2a231e, #1a1512);
  box-shadow: inset 0 0 0 1px rgba(239, 235, 228, 0.14), inset 0 1px 0 rgba(239, 235, 228, 0.18), 0 0.5cqw 1.4cqw rgba(0, 0, 0, 0.5);
}
.r-rally .r-rally__back::before, .r-rally .r-rally__back::after {
  content: ''; position: absolute; top: 100%; width: 1px; height: 190%;
  background: linear-gradient(rgba(239, 235, 228, 0.3), rgba(239, 235, 228, 0));
}
.r-rally .r-rally__back::before { left: 14%; transform: skewX(12deg); transform-origin: 0 0; }
.r-rally .r-rally__back::after { right: 14%; transform: skewX(-12deg); transform-origin: 0 0; }
.r-rally .r-rally__rung { position: absolute; left: 14%; right: 14%; height: 1px; background: rgba(239, 235, 228, 0.15); }
.r-rally .r-rally__rung + .r-rally__rung { left: 9%; right: 9%; background: rgba(239, 235, 228, 0.07); }
.r-rally .r-rally__arm {
  position: absolute; top: 116%; width: 24%; height: 0.32cqw; border-radius: 0.2cqw; z-index: 2;

.r-rally .r-rally__who { position: absolute; transform: translate(-100%, -50%); text-align: right; white-space: nowrap; }
.r-rally .r-rally__who-n { display: block; font-size: var(--fs-name); font-weight: 600; }
.r-rally .r-rally__st { display: grid; justify-items: end; font-size: var(--fs-s); margin-top: 0.2em; }
.r-rally .r-rally__st > span { grid-area: 1 / 1; transition: opacity 0.18s ease; }
.r-rally .r-rally__who.is-ready .r-rally__st-b { transition: opacity 0.35s ease 0.16s; }
.r-rally .r-rally__st-a { color: var(--ink3); }
.r-rally .r-rally__st-b { color: var(--green); font-weight: 500; opacity: 0; }
.r-rally .r-rally__who.is-ready .r-rally__st-a { opacity: 0; }
.r-rally .r-rally__who.is-ready .r-rally__st-b { opacity: 1; }

/* the pull request you catch */
.r-rally .r-rally__card {
  position: absolute; white-space: nowrap;
  transform: translate(-0.8em, -50%) scale(0.9); transform-origin: 0 50%;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1.06);
  padding: 0.62em 0.85em; border-radius: 0.7em;
  background: linear-gradient(#211b17, #17130f);
  box-shadow: inset 0 0 0 1px rgba(98, 196, 126, 0.28), 0 0.9em 2.2em rgba(0, 0, 0, 0.55);
  font-size: var(--fs);
}
.r-rally .r-rally__card.is-on { opacity: 1; transform: translate(0, -50%) scale(1); }
.r-rally .r-rally__card .r-rally__row + .r-rally__row { margin-top: 0.42em; }
.r-rally .r-rally__num { color: var(--ink2); }
.r-rally .r-rally__tag {
  position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0;
  padding: 0.28em 0.55em; border-radius: 0.5em;
  background: rgba(24, 19, 15, 0.92);
  box-shadow: inset 0 0 0 1px rgba(98, 196, 126, 0.3);
  font-size: var(--fs-s); font-weight: 500;
  will-change: transform, opacity;
}

@container (max-width: 559px) {
  .r-rally {

  .r-rally .r-rally__chip--wide { transform: translate(-62%, calc(-100% - var(--lift) + 0.5em)) scale(0.96); }
  .r-rally .r-rally__chip--wide.is-on { transform: translate(-62%, calc(-100% - var(--lift))) scale(1); }
  .r-rally .r-rally__plate--o { transform: none; text-align: left; }
  .r-rally .r-rally__plate--g { transform: translate(-100%, 0); text-align: right; }
}
@media (prefers-reduced-motion: reduce) {
  .r-rally *, .r-rally *::before, .r-rally *::after { transition: none !important; animation: none !important; }
}
</style>

(() => {
  const root = document.currentScript.previousElementSibling
  const $ = (s) => root.querySelector(s)
  const $$ = (s) => [...root.querySelectorAll(s)]
  const bg = $('.r-rally__bg'), cv = $('.r-rally__fx')
  const bx = bg.getContext('2d'), fx = cv.getContext('2d')
  const paddles = [$('.r-rally__paddle--o'), $('.r-rally__paddle--g')]
  const pglow = paddles.map((p) => p.querySelector('.r-rally__pglow'))
  const plates = [$('.r-rally__plate--o'), $('.r-rally__plate--g')]
  const chips = $$('.r-rally__chip')
  const you = $('.r-rally__you'), head = $('.r-rally__head'), shoulders = $('.r-rally__shoulders'), who = $('.r-rally__who')
  const card = $('.r-rally__card'), tag = $('.r-rally__tag'), score = $('.r-rally__score')
  const fTop = $('.r-rally__st-top b'), fBot = $('.r-rally__st-bot b')
  const leafA = $('.r-rally__leaf-a'), leafB = $('.r-rally__leaf-b')
  const leafAb = leafA.querySelector('b'), leafBb = leafB.querySelector('b')
  const reduce = matchMedia('(prefers-reduced-motion: reduce)')

  // one clock: 14 s
  const LOOP = 14
  const T_CATCH = 7.5, T_READY = 7.95, T_OUT = 12.8, T_RESET = 13.35, ROUND2 = 3.55, STILL = 10
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
  const lerp = (a, b, s) => a + (b - a) * s
  const ease = (s) => s * s * (3 - 2 * s)
  const eOut = (s) => 1 - (1 - s) ** 3
  const ramp = (t, a, d) => clamp((t - a) / d)
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`

  // world: a 2.74 x 1.525 table, surface at z = 0; Opus at -x, GLM at +x
  const TL = 1.37, TW = 0.7625
  const K = [ // where each bat meets the ball
    { t: 0.6, who: 0, p: [-1.55, 0.0, 0.2] },
    { t: 2.0, who: 1, p: [1.55, 0.24, 0.2] },
    { t: 3.4, who: 0, p: [-1.55, 0.2, 0.2] },
    { t: 4.8, who: 1, p: [1.55, -0.22, 0.2] },
    { t: 6.2, who: 0, p: [-1.55, -0.24, 0.2] },
  ]
  // where it lands: round 1 across the far half, round 2 across the near half
  const L = [
    { t: 1.55, p: [0.78, 0.34, 0], c: [125, 136, 255] },
    { t: 2.95, p: [-0.8, 0.34, 0], c: [227, 156, 74] },
    { t: 4.35, p: [0.72, -0.34, 0], c: [125, 136, 255] },
    { t: 5.75, p: [-0.72, -0.34, 0], c: [98, 196, 126] },
  ]
  let SEG = []

  let W = 0, H = 0, VBH = 625, phone = null, dpr = 1, cam = null, T = 0, U = 1, padX = 1.66
  let youS = [500, 520], handS = [520, 550], youW = [0, -1.3, 0.4], down = [0, 0, 0, 0]

  function makeCam(o) {
    const phi = o.phi * Math.PI / 180
    return { ...o, sp: Math.sin(phi), cp: Math.cos(phi), C: [0, -o.d * Math.cos(phi), o.d * Math.sin(phi)] }
  }
  function P(x, y, z) {
    const c = cam, vy = y - c.C[1], vz = z - c.C[2]
    const yc = vy * c.sp + vz * c.cp, zc = vy * c.cp - vz * c.sp
    return [c.cx + c.f * x / zc, c.cy - c.f * yc / zc, c.f / zc]
  }
  function unP(sx, sy, z) {
    const c = cam, a = (sx - c.cx) / c.f, b = -(sy - c.cy) / c.f
    const d = [a, c.cp + b * c.sp, -c.sp + b * c.cp]
    const k = (z - c.C[2]) / d[2]
    return [d[0] * k, c.C[1] + d[1] * k, z]
  }

  function layout() {
    W = root.clientWidth; H = root.clientHeight
    if (!W || !H) return
    U = W / 1000; VBH = H / U
    phone = W < 560
    dpr = Math.min(2, window.devicePixelRatio || 1)
    if (phone) {
      cam = makeCam({ phi: 64, d: 6.5, f: 1650, cx: 500, cy: VBH * 0.45 })
      padX = 1.5; youS = [440, VBH * 0.76]; down = [0, 0, 1, 1]
    } else {
      cam = makeCam({ phi: 50, d: 6.5, f: 1400, cx: 500, cy: VBH * 0.47 })
      padX = 1.68; youS = [500, VBH * 0.835]; down = [0, 0, 0, 0]
    }
    const av = phone ? 84 : 40
    handS = [youS[0] + av * 0.55, youS[1] + av * 0.78]
    youW = unP(handS[0], handS[1], 0.3)
    for (const c of K) c.p[0] = (c.who ? 1 : -1) * (padX - 0.12)
    buildSegs()
    for (const c of [bg, cv]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr) }
    place()
    drawBg()
    render(reduce.matches ? STILL : T, reduce.matches)
  }

  function buildSegs() {
    SEG = [{ t0: 0, t1: K[0].t, a: [K[0].p[0] - 0.01, 0.0, 0.24], b: K[0].p, h: 0.3 }]
    for (let i = 0; i < 4; i++) {
      SEG.push({ t0: K[i].t, t1: L[i].t, a: K[i].p, b: L[i].p, h: 0.3 })
      SEG.push({ t0: L[i].t, t1: K[i + 1].t, a: L[i].p, b: K[i + 1].p, h: 0.07 })
    }
    SEG.push({ t0: K[4].t, t1: T_CATCH, a: K[4].p, b: youW, h: phone ? 0.6 : 0.5, out: 1 })
  }
  function posOn(g, s) {
    return [lerp(g.a[0], g.b[0], s), lerp(g.a[1], g.b[1], s), lerp(g.a[2], g.b[2], s) + 4 * g.h * s * (1 - s)]
  }
  function ballAt(t) {
    if (t >= T_RESET) return { p: SEG[0].a, a: ease(ramp(t, T_RESET, 0.45)), out: 0 }
    if (t >= T_CATCH || t < 0) return null
    for (const g of SEG) if (t <= g.t1) { const s = clamp((t - g.t0) / (g.t1 - g.t0)); return { p: posOn(g, s), a: 1, out: g.out ? s : 0 } }
    return null
  }

  const pct = (el, x, y) => { el.style.left = (x / 10) + '%'; el.style.top = (y / VBH * 100) + '%' }
  function place() {
    const po = P(-padX, 0, 0.2), pg = P(padX, 0, 0.2)
    const drop = phone ? 118 : 96
    pct(plates[0], phone ? 46 : po[0], phone ? VBH * 0.064 : po[1] + drop)
    pct(plates[1], phone ? 954 : pg[0], phone ? VBH * 0.064 : pg[1] + drop)
    L.forEach((l, i) => { const s = P(...l.p); pct(chips[i], s[0], s[1]); chips[i].classList.toggle('is-down', !!down[i]) })
    pct(you, youS[0], youS[1])
    if (phone) {
      pct(who, youS[0] + 62, youS[1] - 4)
      pct(card, 500, youS[1] + 128)
    } else {
      pct(who, youS[0] - 52, youS[1] + 4)
      pct(card, youS[0] + 56, youS[1] + 4)
    }
    score.style.top = (phone ? 6.4 : 5.4) + '%'
  }

  // ---------- drawn once: floor light, table, net ----------
  function poly(g, pts) { g.beginPath(); pts.forEach((p, i) => { const s = P(...p); i ? g.lineTo(s[0], s[1]) : g.moveTo(s[0], s[1]) }); g.closePath() }
  function line(g, a, b) { const s = P(...a), e = P(...b); g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(e[0], e[1]) }
  function drawBg() {
    const g = bx
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, bg.width, bg.height)
    const k = U * dpr; g.setTransform(k, 0, 0, k, 0, 0)
    const c0 = P(0, 0, 0)
    // light pooled on the floor under the table
    g.save(); g.translate(c0[0], c0[1] + 40); g.scale(1, 0.48)
    let gr = g.createRadialGradient(0, 0, 0, 0, 0, 600)
    gr.addColorStop(0, 'rgba(43,59,255,0.17)'); gr.addColorStop(0.45, 'rgba(96,62,226,0.055)'); gr.addColorStop(1, 'rgba(43,59,255,0)')
    g.fillStyle = gr; g.fillRect(-700, -700, 1400, 1400); g.restore()
    // the umpire's corner gets a little warm light
    g.save(); g.translate(youS[0], youS[1] + 10); g.scale(1, 0.5)
    gr = g.createRadialGradient(0, 0, 0, 0, 0, phone ? 300 : 200)
    gr.addColorStop(0, 'rgba(227,156,74,0.06)'); gr.addColorStop(1, 'rgba(227,156,74,0)')
    g.fillStyle = gr; g.fillRect(-400, -400, 800, 800); g.restore()
    // edge (thickness) and top
    const th = 0.045
    poly(g, [[-TL, -TW, 0], [TL, -TW, 0], [TL, -TW, -th], [-TL, -TW, -th]])
    gr = g.createLinearGradient(P(-TL, -TW, 0)[0], 0, P(TL, -TW, 0)[0], 0)
    gr.addColorStop(0, '#0d0a08'); gr.addColorStop(0.5, '#15100d'); gr.addColorStop(1, '#0d0a08')
    g.fillStyle = gr; g.fill()
    const far = P(0, TW, 0), near = P(0, -TW, 0)
    gr = g.createLinearGradient(0, far[1], 0, near[1])
    gr.addColorStop(0, '#211b17'); gr.addColorStop(1, '#17120f')
    poly(g, [[-TL, -TW, 0], [TL, -TW, 0], [TL, TW, 0], [-TL, TW, 0]])
    g.fillStyle = gr; g.fill()
    g.save(); g.clip()
    // soft overhead light, and a faint grain of lines across the top
    g.save(); g.translate(c0[0], far[1] + (near[1] - far[1]) * 0.35); g.scale(1, 0.42)
    gr = g.createRadialGradient(0, 0, 0, 0, 0, 420)
    gr.addColorStop(0, 'rgba(150,160,255,0.075)'); gr.addColorStop(1, 'rgba(150,160,255,0)')
    g.fillStyle = gr; g.fillRect(-500, -500, 1000, 1000); g.restore()
    g.strokeStyle = 'rgba(239,235,228,0.012)'; g.lineWidth = 1
    for (let y = -TW; y < TW; y += 0.035) { line(g, [-TL, y, 0], [TL, y, 0]); g.stroke() }
    // net shadow, falling toward the viewer
    g.save()
    const ns = P(0, -TW, 0), nf = P(0, TW, 0)
    gr = g.createLinearGradient(ns[0] - 14, 0, ns[0] + 14, 0)
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.38)'); gr.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = gr; g.fillRect(ns[0] - 14, nf[1], 28, ns[1] - nf[1])
    g.restore()
    g.restore()
    // lit lines
    const e = 0.014
    const edge = () => poly(g, [[-TL + e, -TW + e, 0], [TL - e, -TW + e, 0], [TL - e, TW - e, 0], [-TL + e, TW - e, 0]])
    g.save()
    g.shadowColor = 'rgba(43,59,255,1)'; g.shadowBlur = 10 * k
    g.strokeStyle = 'rgba(58,74,255,0.85)'; g.lineWidth = 1.9; edge(); g.stroke()
    g.lineWidth = 1.1; g.strokeStyle = 'rgba(58,74,255,0.5)'; line(g, [-TL + e, 0, 0], [TL - e, 0, 0]); g.stroke()
    g.restore()
    g.strokeStyle = 'rgba(176,184,255,0.7)'; g.lineWidth = 0.7; edge(); g.stroke()
    g.strokeStyle = 'rgba(176,184,255,0.28)'; g.lineWidth = 0.5; line(g, [-TL + e, 0, 0], [TL - e, 0, 0]); g.stroke()
    g.strokeStyle = 'rgba(239,235,228,0.09)'; g.lineWidth = 1; line(g, [-TL, -TW, -0.003], [TL, -TW, -0.003]); g.stroke()
    // net: mesh, tape, posts
    const nh = 0.1525, ny = TW + 0.14
    const a = P(0, ny, nh), b = P(0, -ny, nh), a0 = P(0, ny, 0), b0 = P(0, -ny, 0)
    g.fillStyle = 'rgba(239,235,228,0.06)'
    g.beginPath(); g.moveTo(a[0] - 2.4, a[1]); g.lineTo(b[0] - 2.4, b[1]); g.lineTo(b0[0] + 2.4, b0[1]); g.lineTo(a0[0] + 2.4, a0[1]); g.closePath(); g.fill()
    g.strokeStyle = 'rgba(239,235,228,0.16)'; g.lineWidth = 0.6
    for (let i = 0; i <= 26; i++) { const y = lerp(-ny, ny, i / 26); line(g, [0, y, nh], [0, y, 0]); const s = P(0, y, nh), q = P(0, y, 0); g.beginPath(); g.moveTo(s[0] - 2.4, s[1]); g.lineTo(q[0] + 2.4, q[1]); g.stroke() }
    g.save(); g.shadowColor = 'rgba(239,235,228,0.5)'; g.shadowBlur = 4 * k
    g.strokeStyle = 'rgba(239,235,228,0.78)'; g.lineWidth = 1.4
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); g.restore()
    for (const y of [-ny, ny]) {
      g.strokeStyle = 'rgba(239,235,228,0.5)'; g.lineWidth = 2.6; g.lineCap = 'round'
      line(g, [0, y, -0.01], [0, y, nh + 0.01]); g.stroke()
      g.lineWidth = 3.2; line(g, [0, y, 0.0], [0, Math.sign(y) * (TW - 0.02), 0.0]); g.stroke()
    }
  }

  // ---------- each frame ----------
  const SW = [[-0.55, 0, 0], [-0.16, -16, -0.05], [0, 6, 0.08], [0.13, 14, 0.03], [0.6, 0, 0]]
  function swing(w, t) {
    let a = 0, l = 0
    for (const c of K) {
      if (c.who !== w) continue
      const u = t - c.t
      if (u <= SW[0][0] || u >= SW[SW.length - 1][0]) continue
      for (let i = 0; i < SW.length - 1; i++) {
        if (u <= SW[i + 1][0]) {
          const s = ease((u - SW[i][0]) / (SW[i + 1][0] - SW[i][0]))
          a += lerp(SW[i][1], SW[i + 1][1], s); l += lerp(SW[i][2], SW[i + 1][2], s); break
        }
      }
    }
    return [a, l]
  }
  function padY(w, t) {
    const ks = K.filter((c) => c.who === w)
    const rest = w === 0 ? ks[0].p[1] : 0
    let y = rest
    for (const c of ks) y = lerp(y, c.p[1], ease(ramp(t, c.t - 1.25, 1.05)))
    y = lerp(y, 0, ease(ramp(t, ks[ks.length - 1].t + 0.5, 1.2)))
    return lerp(y, rest, ease(ramp(t, T_RESET - 0.6, 0.6)))
  }
  function ring(g, x, y, r, n = 32) {
    g.beginPath()
    for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, s = P(x + Math.cos(a) * r, y + Math.sin(a) * r, 0); i ? g.lineTo(s[0], s[1]) : g.moveTo(s[0], s[1]) }
  }

  let flapKey = ''
  function setFlap(t, still) {
    let cur = { t: -9, a: 1, b: 1 }
    if (still) cur = { t: -9, a: 2, b: 2 }
    else for (const f of [{ t: ROUND2, a: 1, b: 2 }, { t: T_OUT + 0.2, a: 2, b: 1 }]) if (t >= f.t) cur = f
    const p = clamp((t - cur.t) / 0.55)
    const key = cur.a + '' + cur.b + (p < 0.5 ? 'a' : p < 1 ? 'b' : 'c')
    if (key !== flapKey) {
      flapKey = key
      fTop.textContent = p < 1 ? cur.b : cur.b
      fBot.textContent = p < 0.5 ? cur.a : cur.b
      leafAb.textContent = cur.a; leafBb.textContent = cur.b
      leafA.style.visibility = p < 0.5 ? 'visible' : 'hidden'
      leafB.style.visibility = p >= 0.5 && p < 1 ? 'visible' : 'hidden'
    }
    if (p < 0.5) leafA.style.transform = `perspective(4em) rotateX(${-90 * (p / 0.5) ** 1.6}deg)`
    else if (p < 1) leafB.style.transform = `perspective(4em) rotateX(${90 * (1 - eOut((p - 0.5) / 0.5))}deg)`
  }

  function render(t, still) {
    if (!cam) return
    const g = fx, k = U * dpr
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height); g.setTransform(k, 0, 0, k, 0, 0)
    root.classList.toggle('is-still', !!still)
    const fade = still ? 1 : 1 - ramp(t, T_OUT, 0.45)
    const lift = phone ? 24 : 15

    // the still shows the whole rally as its path
    if (still) {
      g.save(); g.setLineDash([1.5, 5]); g.lineCap = 'round'; g.lineWidth = 1.5
      for (const s of SEG.slice(1)) {
        g.beginPath()
        const end = s.out ? 0.8 : 1
        for (let i = 0; i <= 36; i++) { const q = P(...posOn(s, i / 36 * end)); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]) }
        g.strokeStyle = s.out ? 'rgba(98,196,126,0.6)' : 'rgba(150,160,255,0.45)'; g.stroke()
      }
      g.restore()
    }

    // landing marks, leaders, ripples
    L.forEach((l, i) => {
      const on = still ? 1 : ramp(t, l.t, 0.3) * fade
      const past = i < 2 && (still || t >= ROUND2)
      chips[i].classList.toggle('is-on', still || (t >= l.t && t < T_OUT))
      chips[i].classList.toggle('is-past', past)
      if (on <= 0) return
      const a = on * (past ? 0.5 : 1)
      const s = P(...l.p)
      g.fillStyle = rgba(l.c, 0.95 * a); ring(g, l.p[0], l.p[1], 0.02, 18); g.fill()
      g.strokeStyle = rgba(l.c, 0.5 * a); g.lineWidth = 1.1; ring(g, l.p[0], l.p[1], 0.048, 28); g.stroke()
      g.strokeStyle = rgba(l.c, 0.42 * a); g.lineWidth = 1
      const dir = down[i] ? 1 : -1
      g.beginPath(); g.moveTo(s[0], s[1] + dir * 4); g.lineTo(s[0], s[1] + dir * lift); g.stroke()
      const u = t - l.t
      if (!still && u >= 0 && u < 0.8) {
        const e = eOut(u / 0.8)
        g.strokeStyle = rgba(l.c, 0.85 * (1 - u / 0.8) ** 2); g.lineWidth = 2 * (1 - e) + 0.5
        ring(g, l.p[0], l.p[1], 0.04 + 0.24 * e); g.stroke()
        g.fillStyle = rgba([235, 238, 255], 0.5 * (1 - u / 0.25) ** 2 * (u < 0.25)); ring(g, l.p[0], l.p[1], 0.06, 20); g.fill()
      }
    })

    // bats
    for (let w = 0; w < 2; w++) {
      const sg = w ? -1 : 1
      const [a, l] = still ? [0, 0] : swing(w, t)
      const y = still ? 0 : padY(w, t)
      const bob = still ? 0 : Math.sin(t * 2.1 + w * 1.7) * 0.012
      const s = P(-sg * (padX - l), y, 0.2 + bob)
      paddles[w].style.transform = `translate(${(s[0] * U).toFixed(2)}px, ${(s[1] * U).toFixed(2)}px) translate(-50%, -50%) rotate(${(sg * (28 + a)).toFixed(2)}deg)`
      let hit = 0
      if (!still) for (const c of K) if (c.who === w) { const u = t - c.t; if (u > -0.05 && u < 0.5) hit = Math.max(hit, (1 - clamp(u / 0.5)) ** 1.5 * clamp((u + 0.05) / 0.05)) }
      pglow[w].style.opacity = hit.toFixed(3)
    }

    // ball
    const b = still ? null : ballAt(t)
    const out = b ? b.out : 0
    const col = (o) => [lerp(125, 98, o), lerp(136, 196, o), lerp(255, 126, o)]
    if (b) {
      const [x, y, z] = b.p
      const s = P(x, y, z)
      const r = (phone ? 12 : 8) * s[2] / (cam.f / cam.d)
      const over = clamp((TL + 0.04 - Math.abs(x)) / 0.08) * clamp((TW + 0.04 - Math.abs(y)) / 0.08)
      if (over > 0) {
        // the light it throws on the table, and its contact shadow
        const f = P(x, y, 0), lz = clamp(z / 0.6)
        g.save(); g.translate(f[0], f[1]); g.scale(1, cam.sp * 0.85)
        const R = r * (4 + lz * 6)
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, R)
        gr.addColorStop(0, rgba(col(out), 0.34 * (1 - lz * 0.7) * over * b.a)); gr.addColorStop(1, rgba(col(out), 0))
        g.fillStyle = gr; g.fillRect(-R, -R, 2 * R, 2 * R)
        g.fillStyle = `rgba(0,0,0,${0.6 * (1 - lz) * over * b.a})`; g.beginPath(); g.arc(0, 0, r * (0.85 + lz * 1.2), 0, Math.PI * 2); g.fill()
        g.restore()
      }
      // trail, with a little spin in it
      let prev = s
      const N = 20, strand = [s]
      g.lineCap = 'round'
      for (let i = 1; i <= N; i++) {
        const ti = t - i * 0.015
        const tb = ballAt(ti)
        if (!tb || ti < 0) break
        const q = P(...tb.p), f = 1 - i / N
        g.strokeStyle = rgba(col(out), 0.55 * f * f * b.a); g.lineWidth = r * 1.8 * f
        g.beginPath(); g.moveTo(prev[0], prev[1]); g.lineTo(q[0], q[1]); g.stroke()
        const dxp = q[0] - prev[0], dyp = q[1] - prev[1], dl = Math.hypot(dxp, dyp) || 1
        const w = Math.sin(ti * 38) * r * 1.3 * f
        strand.push([q[0] - dyp / dl * w, q[1] + dxp / dl * w, f])
        prev = q
      }
      // a thin strand winding round the trail: the spin
      g.lineWidth = Math.max(0.6, r * 0.14)
      for (let i = 1; i < strand.length; i++) {
        g.strokeStyle = rgba([200, 206, 255], 0.42 * strand[i][2] ** 2 * b.a)
        g.beginPath(); g.moveTo(strand[i - 1][0], strand[i - 1][1]); g.lineTo(strand[i][0], strand[i][1]); g.stroke()
      }
      let gr = g.createRadialGradient(s[0], s[1], 0, s[0], s[1], r * 5.5)
      gr.addColorStop(0, rgba(col(out), 0.5 * b.a)); gr.addColorStop(0.35, rgba(col(out), 0.15 * b.a)); gr.addColorStop(1, rgba(col(out), 0))
      g.fillStyle = gr; g.beginPath(); g.arc(s[0], s[1], r * 5.5, 0, Math.PI * 2); g.fill()
      gr = g.createRadialGradient(s[0] - r * 0.35, s[1] - r * 0.4, 0, s[0], s[1], r)
      gr.addColorStop(0, `rgba(255,255,255,${b.a})`); gr.addColorStop(0.65, `rgba(238,235,246,${b.a})`); gr.addColorStop(1, `rgba(190,190,222,${b.a})`)
      g.fillStyle = gr; g.beginPath(); g.arc(s[0], s[1], r, 0, Math.PI * 2); g.fill()
      // a turning seam: the spin
      const sp = t * 22
      g.strokeStyle = `rgba(150,160,255,${0.55 * b.a})`; g.lineWidth = r * 0.22
      g.beginPath(); g.ellipse(s[0], s[1], r * 0.62, r * 0.62 * Math.abs(Math.cos(sp)), sp * 0.3, 0.2, Math.PI - 0.2); g.stroke()
      // you watch it, like anyone courtside
      const dx = clamp((s[0] - youS[0]) / 280, -1, 1)
      head.style.transform = `translate(${(dx * 13).toFixed(1)}%, 0) rotate(${(dx * 8).toFixed(1)}deg)`
      shoulders.style.transform = `translate(${(dx * 3).toFixed(1)}%, 0)`
      // once it leaves the table it is the pull request
      const ta = clamp((out - 0.7) / 0.1)
      tag.style.opacity = ta.toFixed(3)
      if (ta > 0) tag.style.transform = `translate(${(s[0] * U).toFixed(2)}px, ${(s[1] * U).toFixed(2)}px) translate(${phone ? '-115%' : '-112%'}, -50%)`
    } else {
      tag.style.opacity = 0
      const bump = still ? 0 : Math.sin(Math.PI * ramp(t, T_CATCH, 0.4)) * (t < T_CATCH + 0.4)
      head.style.transform = bump ? `translate(0, ${(bump * -7).toFixed(1)}%)` : 'none'
      shoulders.style.transform = bump ? `translate(0, ${(bump * -4).toFixed(1)}%)` : 'none'
    }

    // hit flashes
    if (!still) for (const c of K) {
      const u = t - c.t
      if (u < 0 || u > 0.5) continue
      const s = P(...c.p), e = eOut(u / 0.5), f = 1 - u / 0.5
      const cc = c === K[4] ? [140, 214, 162] : [130, 142, 255]
      const R = phone ? 48 : 34
      let gr = g.createRadialGradient(s[0], s[1], 0, s[0], s[1], R)
      gr.addColorStop(0, rgba([240, 242, 255], 0.8 * f * f)); gr.addColorStop(0.3, rgba(cc, 0.35 * f * f)); gr.addColorStop(1, rgba(cc, 0))
      g.fillStyle = gr; g.beginPath(); g.arc(s[0], s[1], R, 0, Math.PI * 2); g.fill()
      g.strokeStyle = rgba(cc, 0.85 * f * f); g.lineWidth = 2.2 * f + 0.3
      g.beginPath(); g.arc(s[0], s[1], 6 + R * 1.3 * e, 0, Math.PI * 2); g.stroke()
      g.lineWidth = 1.5 * f
      for (let i = 0; i < 8; i++) {
        const an = i / 8 * Math.PI * 2 + 0.3, r1 = R * 0.35 + R * 0.9 * e, r2 = r1 + R * 0.28 * f
        g.strokeStyle = rgba([220, 225, 255], 0.8 * f)
        g.beginPath(); g.moveTo(s[0] + Math.cos(an) * r1, s[1] + Math.sin(an) * r1); g.lineTo(s[0] + Math.cos(an) * r2, s[1] + Math.sin(an) * r2); g.stroke()
      }
    }

    // the catch
    const uc = t - T_CATCH
    if (!still && uc >= 0 && uc < 0.8) {
      const e = eOut(uc / 0.8), f = 1 - uc / 0.8
      g.strokeStyle = rgba([98, 196, 126], 0.8 * f * f); g.lineWidth = 2 * f + 0.4
      g.beginPath(); g.arc(handS[0], handS[1], (phone ? 14 : 8) + (phone ? 70 : 46) * e, 0, Math.PI * 2); g.stroke()
    }
    card.classList.toggle('is-on', still || (t >= T_CATCH && t < T_OUT))
    const ready = still || (t >= T_READY && t < T_OUT)
    you.classList.toggle('is-ready', ready); who.classList.toggle('is-ready', ready)
    setFlap(t, still)
  }

  // ---------- clock ----------
  let raf = 0, running = false, last = 0, onScreen = true
  function tick(now) {
    if (!running) return
    T = (T + Math.min(0.05, (now - last) / 1000)) % LOOP; last = now
    render(T, false)
    raf = requestAnimationFrame(tick)
  }
  function update() {
    const go = onScreen && !document.hidden && !reduce.matches
    if (go && !running) { running = true; last = performance.now(); raf = requestAnimationFrame(tick) }
    else if (!go && running) { running = false; cancelAnimationFrame(raf) }
    if (reduce.matches) render(STILL, true)
  }
  root.addEventListener('rv-seek', (e) => { T = ((+e.detail % LOOP) + LOOP) % LOOP; render(reduce.matches ? STILL : T, reduce.matches) })
  new ResizeObserver(layout).observe(root)
  new IntersectionObserver((es) => { onScreen = es[es.length - 1].isIntersecting; update() }).observe(root)
  document.addEventListener('visibilitychange', update)
  if (reduce.addEventListener) reduce.addEventListener('change', update)
  layout()
  update()
})()
</script>
