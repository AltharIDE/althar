.s-icon .ic-skin::before {

    }
  })
  const floor = root.querySelector('.ic-floor')
  const bounce = root.querySelector('.ic-bounce')
  const lines = [...root.querySelectorAll('.ic-line')]
  let lineOn = 0
  let lineKey = ''
  let lineText = ''

  const clamp = (v) => (v < 0 ? 0 : v > 1 ? 1 : v)
  const bez = (x1, y1, x2, y2) => (x) => {
    if (x <= 0) return 0
    if (x >= 1) return 1
    let t = x
    for (let i = 0; i < 6; i++) {
      const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x
      const dx = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t
      if (Math.abs(dx) < 1e-6) break
      t -= cx / dx
    }
    t = clamp(t)
    return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3
  }
  const ease = bez(0.22, 0.61, 0.24, 1)
  const glide = bez(0.55, 0, 0.2, 1)
  const easeIn = bez(0.5, 0, 0.9, 0.4)
  const sweep = bez(0.45, 0.05, 0.25, 1)
  const climb = (x) => 0.72 * x + 0.28 * x * x * (3 - 2 * x)
  const mix = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, r: a.r + (b.r - a.r) * k, s: a.s + (b.s - a.s) * k, fx: 0 })
  const fall = bez(0.55, 0, 0.85, 0.35) // gathering speed, like something tipping over
  const rise = bez(0.2, 0.7, 0.3, 1)

  function setCaption(name, right, limit, animate) {
    const key = name
    const text = right
    if (key === lineKey && text === lineText) return
    const cur = lines[lineOn]
    if (key !== lineKey && lineKey && animate) {
      // a new account: the line hands over too
      const next = lines[1 - lineOn]
      next.querySelector('b').textContent = name
      const sp = next.querySelector('span')
      sp.textContent = right
      sp.classList.toggle('is-limit', limit)
      if (cur.animate) {
        cur.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-0.5em)' }], {
          duration: 360,
          easing: 'cubic-bezier(0.4, 0, 1, 1)',
          fill: 'forwards',
        })
        next.animate([{ opacity: 0, transform: 'translateY(0.55em)' }, { opacity: 1, transform: 'none' }], {
          duration: 520,
          delay: 200,
          easing: 'cubic-bezier(0.22, 0.61, 0.24, 1)',
          fill: 'both',
        })
      }
      cur.style.opacity = '0'
      next.style.opacity = '1'
      lineOn = 1 - lineOn
    } else {
      cur.querySelector('b').textContent = name
      const sp = cur.querySelector('span')
      const was = sp.classList.contains('is-limit')
      sp.textContent = right
      sp.classList.toggle('is-limit', limit)
      if (animate && was !== limit && sp.animate) {
        sp.animate([{ opacity: 0, filter: 'blur(2px)' }, { opacity: 1, filter: 'blur(0)' }], {
          duration: 420,
          easing: 'cubic-bezier(0.22, 0.61, 0.24, 1)',
        })
      }
    }
    lineKey = key
    lineText = text
  }

  function render(t, still) {
    const turn = Math.floor(t / PERIOD)
    const within = t - turn * PERIOD
    const a = turn % N
    const prev = (a + N - 1) % N
    const handing = turn > 0 && within < SWAP + 900 && still == null
    const p = turn > 0 && still == null ? clamp(within / SWAP) : 1

    // usage of the account in use
    const base = ACCOUNTS[a].base
    let u
    if (still != null) u = still
    else if (within < CLIMB_FROM) u = base
    else u = base + (100 - base) * climb(clamp((within - CLIMB_FROM) / (CLIMB_TO - CLIMB_FROM)))
    const limit = still == null && within >= CLIMB_TO

    // idle: a slow float, and the light breathing on the glossy face
    const float = still == null ? Math.sin((t / 5200) * Math.PI * 2) : 0
    const sway = still == null ? Math.sin((t / 8300) * Math.PI * 2) : 0
    const breathe = still == null ? 0.62 + 0.38 * Math.sin((t / 4300) * Math.PI * 2) : 1
    stack.style.transform = `translate3d(0,${(float * -0.42).toFixed(3)}em,0) rotate(${(sway * 0.35).toFixed(3)}deg)`
    floor.style.transform = `scale(${(1 + float * 0.035).toFixed(4)})`
    floor.style.opacity = (0.94 + float * 0.06).toFixed(3)

    cards.forEach((c, i) => {
      const place = (i - a + N) % N
      let pose
      let z = 10 - place
      let o = 1
      let lo = place === 0 ? 1 : 0
      let wipe = 1
      if (p < 1 && place === N - 1) {
        // the card that ran out tips forward off the front, like a flap on a flip clock,
        // and stands up again at the back of the stack
        const down = 0.36
        const up = 0.44
        if (p < down) {
          const k = fall(p / down)
          pose = { ...SLOT[0], y: SLOT[0].y + 0.9 * k, fx: -90 * k }
          z = 20
          o = 1 - clamp((k - 0.82) / 0.18)
          lo = 1
        } else {
          const k = p < up ? 0 : rise((p - up) / (1 - up))
          pose = { ...SLOT[N - 1], fx: 90 * (1 - k) }
          z = 0
          o = clamp(k / 0.12)
          lo = 0
        }
      } else if (p < 1) {
        // everyone else moves up one place, the next one first
        const lag = (place - 0) * 0.07
        const k = glide(clamp((p - 0.04 - lag) / (0.86 - lag * 0.5)))
        pose = mix(SLOT[place + 1], SLOT[place], k)
        if (place === 0) {
          // fanning forward, it lifts a touch as it turns into the front
          const lift = Math.sin(Math.PI * k)
          pose.y -= lift * 1.1
          pose.r -= lift * 1.4
          pose.s += lift * 0.012
          // the glossy cobalt washes across it with the light
          wipe = clamp((p - 0.2) / 0.58)
          z = 15
        }
      } else {
        pose = SLOT[place]
      }
      let tf = `translate3d(${pose.x.toFixed(3)}em,${pose.y.toFixed(3)}em,0) rotate(${pose.r.toFixed(3)}deg) scale(${pose.s.toFixed(4)})`
      if (pose.fx) tf += ` translateY(10.75em) perspective(95em) rotateX(${pose.fx.toFixed(2)}deg) translateY(-10.75em)`
      if (tf !== c.tf) {
        c.tf = tf
        c.el.style.transform = tf
      }
      if (z !== c.z) {
        c.z = z
        c.el.style.zIndex = z
      }
      const ov = Math.round(o * 1000) / 1000
      if (ov !== c.o) {
        c.o = ov
        c.el.style.opacity = ov
      }
      const lv = Math.round(lo * 1000) / 1000
      if (lv !== c.lo) {
        c.lo = lv
        c.live.style.opacity = lv
      }
      const covered = lv === 1 && wipe === 1
      if (covered !== c.covered) {
        c.covered = covered
        c.plain.style.visibility = covered ? 'hidden' : 'visible'
      }
      // the ring on the glossy face
      const ru = place === 0 ? u : place === N - 1 ? 100 : ACCOUNTS[i].base
      const av = Math.round(C * (1 - ru / 100) * 100) / 100
      if (av !== c.arcV) {
        c.arcV = av
        c.arc.style.strokeDashoffset = av
      }
      const lim = (place === 0 && limit) || (place === N - 1 && p < 1)
      if (lim !== c.limit) {
        c.limit = lim
        c.el.classList.toggle('is-limit', lim)
      }
      // the new front card turns cobalt as a glint crosses it
      let g = 'off'
      let m = 'none'
      if (place === 0 && wipe < 1) {
        const k = sweep(wipe)
        const f = -0.2 + 1.4 * k // where the light is, across the card
        m = `${(((1.5 - f) / 2) * 100).toFixed(2)}% 0`
        if (wipe > 0) g = `${(((f - 0.03 - 0.22) / 0.44) * 100).toFixed(2)}|${Math.pow(Math.sin(Math.PI * wipe), 0.6).toFixed(3)}`
      }
      if (m !== c.m) {
        if (m === 'none') c.live.classList.remove('is-wipe')
        else {
          if (c.m === 'none' || c.m === undefined) c.live.classList.add('is-wipe')
          c.live.style.webkitMaskPosition = m
          c.live.style.maskPosition = m
        }
        c.m = m
      }
      if (g !== c.g) {
        c.g = g
        if (g === 'off') c.glint.style.opacity = '0'
        else {
          const [gx, go] = g.split('|')
          c.glint.style.opacity = go
          c.glint.style.transform = `translate3d(${gx}%,0,0) skewX(-14deg)`
        }
      }
      const bv = place === 0 ? Math.round(breathe * 200) / 200 : 1
      if (bv !== c.br) {
        c.br = bv
        c.light.style.opacity = bv
      }
    })

    // light from the glossy card onto the floor
    const front = cards[a]
    bounce.style.opacity = (0.75 + 0.25 * front.lo * (0.9 + 0.1 * breathe)).toFixed(3)

    // the caption
    const shown = Math.round(u)
    const capName = p < 0.45 && turn > 0 && still == null ? ACCOUNTS[prev].name : ACCOUNTS[a].name
    if (capName === ACCOUNTS[prev].name && capName !== ACCOUNTS[a].name) setCaption(capName, 'Limit reached', true, true)
    else setCaption(capName, limit ? 'Limit reached' : `${shown}% used`, limit, still == null)
  }

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  if (reduce) {
    // One still: Northwind in use at 62%, Personal back at the foot of the stack, Client next.
    render(PERIOD + 1600, 62)
    return
  }

  let t = START
  let raf = 0
  let last = 0
  let onScreen = false
  render(t)
  const tick = (now) => {
    const dt = last ? Math.min(now - last, 64) : 16
    last = now
    t += dt
    render(t)
    raf = requestAnimationFrame(tick)
  }
  const sync = () => {
    const run = onScreen && document.visibilityState === 'visible'
    if (run && !raf) {
      last = 0
      raf = requestAnimationFrame(tick)
    } else if (!run && raf) {
      cancelAnimationFrame(raf)
      raf = 0
    }
  }
  if ('ResizeObserver' in window) {
    new ResizeObserver((entries) => {
      setSpread(entries[0].contentRect.width)
      if (!raf) render(t)
    }).observe(root)
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      onScreen = entries[entries.length - 1].isIntersecting
      sync()
    }).observe(root)
  } else {
    onScreen = true
  }
  document.addEventListener('visibilitychange', sync)
  sync()
})()
</script>
