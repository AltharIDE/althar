  function sprite([r, g, b], core) {

  const SP_COB = sprite(PAL.cob, 0.18)

  const NB = 28
  const BEAM_COL = []

  const mix = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * f))

  const clamp = (v) => (v < 0 ? 0 : v > 1 ? 1 : v)

  // The story, in seconds. One clear motion at a time, with room between.
  const LOOP = 19
  const WRITE = [0.5, 1.7]                 // the lead writes the change
  const SEND = [[1.6, 3.3], [9.4, 11.1]]   // the change travels to the reviewer, round 1 and 2
  const REVIEW = [[3.2, 5.0], [11.0, 12.3]]
  const BACK = [[5.0, 6.5], [5.75, 7.25]]  // the two findings come back
  const FIX = [7.5, 9.0]                   // the lead fixes them
  const TICK = [8.0, 8.65]
  const ROUND2 = 9.15
  const CLEAN = [12.3, 13.8]               // Clean comes back
  const PR = [14.2, 15.6]                  // the pull request goes out to you
  const RESET = 18.2

  // Geometry (CSS px, relative to the root), measured on resize.
  let W = 0, H = 0, U = 1, dpr = 1
  const L = {}, R = {}
  const you = { x: 0, y: 0, r: 0 }
  const routes = {}
  let chW = 0, chH = 0, prW = 0, prH = 0
  const M = 140

  function rectOf(node, rb, o) {
    const b = node.getBoundingClientRect()
    o.x = b.left - rb.left; o.y = b.top - rb.top; o.w = b.width; o.h = b.height
    return o
  }
  function edge(o, rad) {
    o.bx = o.x + 0.5; o.by = o.y + 0.5; o.bw = o.w - 1; o.bh = o.h - 1; o.br = Math.max(1, rad - 0.5)
    o.per = 2 * (o.bw - 2 * o.br) + 2 * (o.bh - 2 * o.br) + 2 * Math.PI * o.br

  function cubic(x0, y0, x1, y1, x2, y2, x3, y3) {
    const xs = [], ys = [], Ls = [0]
    for (let i = 0; i <= 96; i++) {
      const t = i / 96, m = 1 - t
      xs.push(m * m * m * x0 + 3 * m * m * t * x1 + 3 * m * t * t * x2 + t * t * t * x3)
      ys.push(m * m * m * y0 + 3 * m * m * t * y1 + 3 * m * t * t * y2 + t * t * t * y3)
      if (i) Ls.push(Ls[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]))

  }
  function line(x0, y0, x1, y1) {

  }
  function resample(xs, ys, Ls) {
    const len = Ls[Ls.length - 1]
    const rx = new Float32Array(M), ry = new Float32Array(M)
    let s = 0
    for (let i = 0; i < M; i++) {
      const want = (i / (M - 1)) * len
      while (s < xs.length - 2 && Ls[s + 1] < want) s++
      const f = clamp((want - Ls[s]) / (Ls[s + 1] - Ls[s] || 1))
      rx[i] = xs[s] + (xs[s + 1] - xs[s]) * f
      ry[i] = ys[s] + (ys[s + 1] - ys[s]) * f
    }
    return { xs: rx, ys: ry, len }
  }

  function measure() {
    const rb = root.getBoundingClientRect()
    W = rb.width; H = rb.height; U = W / 100

  const PT = new Float32Array(2)

  const midTime = (t0, t1) => t0 + (t1 - t0) * 0.5

  function render(T) {

    const reset = T >= RESET
    const r2 = !reset && T >= ROUND2
    put(el.round, 'r', r2 ? '2' : '1')
    put(el.lead, 'on', !reset && (win(T, WRITE[0], WRITE[1], 0.01, 0.01) > 0 || win(T, FIX[0], FIX[1], 0.01, 0.01) > 0) ? '1' : '0')
    put(el.rev, 'on', !reset && (win(T, REVIEW[0][0], REVIEW[0][1], 0.01, 0.01) > 0 || win(T, REVIEW[1][0], REVIEW[1][1], 0.01, 0.01) > 0) ? '1' : '0')
    for (let i = 0; i < 2; i++) {

    const pp = io(clamp((T - PR[0]) / (PR[1] - PR[0])))
    const prTop0 = routes.mid.y - prH * 0.15, prTop1 = you.y - you.r - U * 1.2 - prH

    place(el.pr, 1, routes.mid.x - prW / 2, prTop0 + (prTop1 - prTop0) * pp, prO)

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    ctx.clearRect(0, 0, W, H)
    ctx.globalCompositeOperation = 'source-over'
    ctx.globalAlpha = 1
    ctx.lineWidth = 1
    ctx.strokeStyle = PAL.dormant
    dormant(routes.top); dormant(routes.bot); dormant(st)
    ctx.fillStyle = PAL.port
    port(routes.top.xs[0], routes.top.ys[0]); port(routes.top.xs[M - 1], routes.top.ys[M - 1])
    port(routes.bot.xs[0], routes.bot.ys[0]); port(routes.bot.xs[M - 1], routes.bot.ys[M - 1])
    port(routes.mid.x, routes.mid.y)

    if (!reset) {
      // Card beams: the lead while it writes and fixes, the reviewer while it reviews.
      const beam = (o, a, t0) => { if (a > 0.004) comet(rrPoint, o, (o.per / 2.4) * (T - t0), Math.min(o.per * 0.3, U * 18), a, false) }
      beam(L, win(T, WRITE[0], WRITE[1], 0.3, 0.35), WRITE[0])
      beam(L, win(T, FIX[0], FIX[1], 0.3, 0.4), FIX[0])
      beam(R, win(T, REVIEW[0][0], REVIEW[0][1], 0.3, 0.35), REVIEW[0][0])
      beam(R, win(T, REVIEW[1][0], REVIEW[1][1], 0.3, 0.35), REVIEW[1][0])
      // The change goes out along the top; what the reviewer found comes back along the bottom.
      for (const [t0, t1] of SEND) travel(routes.top, T, t0, t1, 1)
      for (const [t0, t1] of BACK) {

        const f = Math.exp(-Math.pow((T - midTime(t0, t1)) / 0.16, 2))
        flash(routes.mid.x, routes.mid.y, f * 0.9, false)
      }
      travel(routes.bot, T, CLEAN[0], CLEAN[1], 1)
      flash(routes.mid.x, routes.mid.y, Math.exp(-Math.pow((T - midTime(CLEAN[0], CLEAN[1])) / 0.2, 2)), true)
    }
    // The stem to you: lit as the pull request travels it, green on arrival.
    if (T >= PR[0]) {
      const fade = reset ? 1 - clamp((T - RESET) / 0.5) : 1
      lit(st, 0, st.len * clamp((T - PR[0]) / (PR[1] - PR[0] - 0.1)), 0.8 * fade)
      const arr = T >= PR[1] ? Math.exp(-Math.pow((T - PR[1] - 0.2) / 0.45, 2)) : 0
      const steady = T >= PR[1] ? clamp((T - PR[1]) / 0.6) : 0
      ctx.globalCompositeOperation = ADD
      glow(SP_GRN, you.x, you.y, U * 7, (0.42 * arr + 0.16 * steady) * fade * GA)
      ctx.globalCompositeOperation = 'source-over'
    }
    ctx.globalAlpha = 1
  }

  // Loop control: only while on screen and the tab is visible.
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)')
  let T = 0.2
  const STILL = 14.95 // round 2, Clean, both lines fixed, the PR on its way to you
  let raf = 0, last = 0, onScreen = false, ready = false
  function frame(now) {
    const dt = last ? Math.min(0.25, (now - last) / 1000) : 0
    last = now
    T = (T + dt) % LOOP
    render(T)
    raf = requestAnimationFrame(frame)
  }
  function sync() {
    const run = ready && onScreen && !document.hidden && !mq.matches
    if (run && !raf) { last = 0; raf = requestAnimationFrame(frame) }
    else if (!run && raf) { cancelAnimationFrame(raf); raf = 0 }
    if (ready && mq.matches) render(STILL)
  }
  const ro = new ResizeObserver(() => {
    ready = measure()
    if (ready) render(mq.matches ? STILL : T)
    sync()
  })
  ro.observe(root)
  new IntersectionObserver((es) => { onScreen = es[es.length - 1].isIntersecting; sync() }).observe(root)
  document.addEventListener('visibilitychange', sync)
  if (mq.addEventListener) mq.addEventListener('change', sync)
})()
</script>
