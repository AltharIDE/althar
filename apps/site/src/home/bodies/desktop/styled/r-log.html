    Object.assign(trackY.style, { transform: `translate(${xy}px, ${top}px)`, height: `${yEnd - top}px` })
    Object.assign(fillY.style, { height: `${yEnd - top}px` })
    G = { xa, xy, top, aEnd, yEnd, len, ys: [top, ...ns.map((n) => n.y)], ts: [0, ...R], lh: clock.offsetHeight || 14, lx: laneA.offsetLeft, ly: laneA.offsetTop }
  }

  function seg(T) {
    const { ts } = G
    for (let i = 1; i < ts.length; i++) if (T < ts[i]) return [i, ease((T - ts[i - 1]) / (ts[i] - ts[i - 1]))]
    return [ts.length - 1, 1]
  }
  let shown = ''

  function render(T) {
    if (!G) return
    const { xa, xy, top, aEnd, yEnd, len } = G
    root.classList.toggle('out', T >= OUT)
    root.classList.toggle('done', T >= R6 && T < OUT + 0.4)
    for (const [el, t] of SHOW) el.classList.toggle('on', T >= t)
    for (const [el, t] of FIX) el.classList.toggle('fixed', T >= t)
    // the agents' rail fills to the playhead, then turns into your lane
    const [i, s] = seg(T)
    const y = G.ys[i - 1] + (G.ys[i] - G.ys[i - 1]) * s
    // the clock rides the playhead and hands over to each row's stamp
    const m = Math.round(MIN[i - 1] + (MIN[i] - MIN[i - 1]) * s)
    const txt = `14:${String(m).padStart(2, '0')}`
    if (txt !== shown) { clock.textContent = txt; shown = txt }
    let d = Infinity
    for (const ry of G.ys.slice(1)) d = Math.min(d, Math.abs(y - ry))
    const lh = G.lh
    const hide = T >= R[4] - 0.05 || (i > 1 && m === MIN[i - 1])
    clock.style.opacity = hide ? 0 : Math.min(1, Math.max(0, (d - lh) / (0.9 * lh))).toFixed(3)
    clock.style.transform = `translateY(${y}px)`
    const w = ease((T - W0) / (R6 - W0))
    fillA.style.transform = `translate(${xa - 0.5}px, ${top}px) scaleY(${Math.max(0, (y - top) / (aEnd - top))})`
    path.style.strokeDashoffset = `${len * (1 - w)}`
    let hx = xa, hy = y
    if (T >= W0) { const p = path.getPointAtLength(len * w); hx = p.x; hy = p.y }
    headA.style.transform = `translate(${hx}px, ${hy}px)`
    pool.style.transform = `translate(${hx - G.lx}px, ${hy - G.ly}px)`
    pool.classList.toggle('gone', T >= R6)
    headA.classList.toggle('wired', T >= W0 - 0.15)
    headA.classList.toggle('gone', T >= R6 + 0.1)
    // your rail: the same clock, nothing on it
    const yy = T < R[4] ? y : aEnd + (yEnd - aEnd) * w
    const h = Math.min(yEnd, yy) - top
    fillY.style.transform = `translate(${xy}px, ${top}px)`
    fillY.style.clipPath = `inset(0 0 ${Math.max(0, yEnd - top - h)}px 0)`
    headY.style.transform = `translate(${xy}px, ${Math.min(yEnd, yy)}px)`
    headY.classList.toggle('gone', T >= R6 - 0.05)
  }

  let T = 0, last = 0, raf = 0, seen = false
  const still = matchMedia('(prefers-reduced-motion: reduce)')
  const STILL_T = 11.5
  function frame(now) {
    T = (T + Math.min(0.1, (now - last) / 1000)) % L
    last = now
    render(T)
    raf = requestAnimationFrame(frame)
  }
  function update() {
    const go = seen && !document.hidden && !still.matches
    if (go && !raf) { last = performance.now(); raf = requestAnimationFrame(frame) }
    if (!go && raf) { cancelAnimationFrame(raf); raf = 0 }
  }
  function relayout() { measure(); render(still.matches ? STILL_T : T) }
  relayout()
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout)
  new ResizeObserver(relayout).observe(log)
  new IntersectionObserver((es) => { seen = es[es.length - 1].isIntersecting; update() }).observe(root)
  document.addEventListener('visibilitychange', update)
  still.addEventListener('change', () => { relayout(); update() })
  root.addEventListener('rv-seek', (e) => { T = ((+e.detail % L) + L) % L; render(T) })
})()
</script>
