<style>
.h-paper{position:absolute;inset:0;overflow:hidden;background:#1a1511;color:#2a1f17;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;--grain:none;--wx:6%;--ww:88%;--hy:22%;--ly:68%;--lw:620px;--l1:30px;--sub:17px;--fw:60%;--fh:180px;--subcore:none}
.h-paper *{box-sizing:border-box}
.h-paper__scene{position:absolute;inset:0;pointer-events:none;-webkit-user-select:none;user-select:none}
.h-paper__defs{position:absolute;width:0;height:0;overflow:hidden}
.h-paper__out,.h-paper__rig{position:absolute;inset:0;will-change:transform}
.h-paper__out>*{position:absolute;left:0;top:0}
.h-paper__sky,.h-paper__glass,.h-paper__room{display:block;overflow:visible}
.h-paper__room{position:absolute;left:0;top:0}
.h-paper__fire,.h-paper__pa,.h-paper__pb{display:block}
.h-paper__pa,.h-paper__pb{visibility:hidden;will-change:transform;filter:drop-shadow(0 8px 10px rgba(18,8,2,.55))}
.h-paper__flash{background:#fff8ea;opacity:0}
.h-paper__clouds{overflow:visible}
.h-paper__cloud,.h-paper__sun{position:absolute;left:0;top:0;display:block;overflow:visible;will-change:transform}
.h-paper__mate{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 70%}
.h-paper__mate svg{display:block;width:100%;height:100%;overflow:visible}
.h-paper__ov{position:absolute;inset:0}
.h-paper__vig{background:radial-gradient(ellipse 78% 74% at 50% 40%,rgba(16,9,4,0) 38%,rgba(16,9,4,.62) 82%,rgba(12,7,3,.82) 100%)}
.h-paper__warm{background:radial-gradient(ellipse 85% 80% at 50% 42%,rgba(255,132,44,.34),rgba(255,104,32,.16) 52%,rgba(255,90,20,0) 88%);opacity:0}
.h-paper__bloom{background:#fff6e4;opacity:0}
.h-paper__dark{background:radial-gradient(ellipse 60% 55% at 50% 40%,rgba(14,11,9,.9),#0e0b09 75%)}
.h-paper__tag{position:absolute;left:0;top:0;width:164px;transform-origin:50% 0;will-change:transform;filter:drop-shadow(0 1px .6px rgba(25,12,4,.5)) drop-shadow(0 5px 5px rgba(25,12,4,.32))}
.h-paper__str{position:absolute;left:calc(50% - .75px);top:2px;width:1.5px;height:30px;background:#e9dcc0;border-radius:1px;box-shadow:1px 0 0 rgba(60,35,15,.25)}
.h-paper__pin{position:absolute;left:calc(50% - 6px);top:-4px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6dc9a,#c99a45 55%,#8a6526);box-shadow:0 1.5px 1.5px rgba(30,15,5,.5);z-index:2}
.h-paper__tagc{position:relative;margin-top:22px;padding:24px 14px 13px;background:var(--grain) #e8d1a0;background-size:256px;text-align:center}
.h-paper__tagc::before{content:"";position:absolute;left:calc(50% - 8px);top:7px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#5b3e24 0 3.6px,#d7bb84 4.2px 7px,rgba(0,0,0,0) 7.4px)}
.h-paper__tagk{display:block;font:700 10.5px/1 Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7a5532}
.h-paper__tagv{display:block;margin-top:6px;font:600 21px/1.05 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color:#2a1f17;font-variant-numeric:tabular-nums;white-space:nowrap}
.h-paper__tagv em{font-style:normal}
.h-paper__tagv small{font-size:11.5px;font-weight:500;color:#6b4c30}
.h-paper__copy{position:absolute;inset:0;pointer-events:none}
.h-paper__h1{position:absolute;left:var(--wx);top:var(--hy);width:var(--ww);margin:0;padding:0 2.5%;text-align:center;font-size:var(--l1);font-weight:800;line-height:1.08;letter-spacing:-.018em;color:#2a1f17;pointer-events:auto;will-change:transform}
.h-paper__l1{display:block;text-wrap:balance}
.h-paper__w{display:inline-block;vertical-align:top;margin:0 .015em .2em;filter:drop-shadow(0 1px .5px rgba(25,12,4,.6)) drop-shadow(0 3px 3px rgba(25,12,4,.32));will-change:transform}
.h-paper__w>span{display:block;padding:.13em .3em .17em;background:var(--grain) #f6eedd;background-size:256px}
.h-paper__w:nth-child(3)>span{background-color:#efe2c4}
.h-paper__w:nth-child(5)>span{background-color:#fbf4e6}
.h-paper__fast{display:block;position:relative;width:var(--fw);height:var(--fh);margin:calc(var(--l1)*.22) auto 0}
.h-paper__fsvg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.h-paper__sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.h-paper__low{position:absolute;left:50%;top:var(--ly);width:var(--lw);max-width:calc(100% - 28px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--sub)*1.2)}
.h-paper__sub{position:relative;margin:0;filter:drop-shadow(0 1px .6px rgba(25,12,4,.5)) drop-shadow(0 7px 8px rgba(25,12,4,.3));will-change:transform}
.h-paper__sub::before{content:"";position:absolute;left:0;right:0;top:-3px;bottom:-3px;background:var(--grain) #fffbf2;background-size:256px;clip-path:var(--subcore)}
.h-paper__sub>span{position:relative;display:block;padding:1.05em 1.4em 1.15em;background:var(--grain) #f3e9d5;background-size:256px;font-size:var(--sub);line-height:1.5;font-weight:500;color:#2b2018;text-align:center;text-wrap:balance}
.h-paper__tape{position:absolute;top:-.5em;z-index:1;width:4.6em;height:1.45em;background:var(--grain) rgba(238,224,190,.86);background-size:256px;font-size:var(--sub)}
.h-paper__tape:first-child{left:-1.1em;transform:rotate(-24deg)}
.h-paper__tape:nth-child(2){right:-1.1em;transform:rotate(19deg)}
.h-paper__ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 20px;pointer-events:auto;will-change:transform}
.h-paper__btn{position:relative;display:block;text-decoration:none;color:inherit;outline:none;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 1px .6px rgba(20,9,3,.55)) drop-shadow(0 7px 6px rgba(20,9,3,.34));transition:transform 160ms steps(2,end),filter 160ms steps(2,end)}
.h-paper__btn>span{display:flex;align-items:center;justify-content:center;gap:.55em;height:54px;padding:0 1.45em 0 1.25em;font:700 16.5px/1 Inter,system-ui,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.h-paper__btn svg{width:1.15em;height:1.15em;flex:none;overflow:visible}
.h-paper__dl{transform:rotate(-1.2deg)}
.h-paper__dl>span{background:var(--grain) #2b3bff;background-size:256px;color:#fdf8ee}
.h-paper__gh{transform:rotate(1deg)}
.h-paper__gh>span{background:var(--grain) #f7f0e2;background-size:256px;color:#2a1f17}
.h-paper__peel{position:absolute;right:0;top:0;width:15px;height:15px;background:linear-gradient(225deg,#bcae94,#e6dbc5 60%);clip-path:polygon(0 0,100% 100%,0 100%)}
.h-paper__dl:hover{transform:translateY(-2px) rotate(-2deg)}
.h-paper__gh:hover{transform:translateY(-2px) rotate(1.7deg)}
.h-paper__btn:hover{filter:drop-shadow(0 1px .6px rgba(20,9,3,.5)) drop-shadow(0 11px 9px rgba(20,9,3,.32))}
.h-paper__dl:active{transform:translateY(3px) rotate(-1.2deg)}
.h-paper__gh:active{transform:translateY(3px) rotate(1deg)}
.h-paper__btn:active{filter:drop-shadow(0 1px .4px rgba(20,9,3,.6)) drop-shadow(0 1.5px 1.5px rgba(20,9,3,.3))}
.h-paper__btn:focus-visible{outline:2px dashed #fff3d4;outline-offset:6px}
@container (max-width: 640px){
.h-paper__btn>span{height:48px;font-size:15.5px;padding:0 1.15em 0 1em}
.h-paper__ctas{gap:12px 12px}
.h-paper__tag{width:146px}
.h-paper__tagv{font-size:18px}
}
@media (prefers-reduced-motion: reduce){.h-paper__btn{transition:none}}

<script>
(() => {
  const root = document.currentScript.previousElementSibling
  if (!root || !root.classList.contains('h-paper')) return
  const uid = 'hp' + Math.random().toString(36).slice(2, 8)
  const mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false }
  let reduce = mq.matches
  const q = (s) => root.querySelector(s)
  const qa = (s) => Array.prototype.slice.call(root.querySelectorAll(s))
  const FPS = 12
  const REST = 14

  // ---------- small maths
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x)
  const sat = (x) => clamp(x, 0, 1)
  const lerp = (a, b, t) => a + (b - a) * t
  const smooth = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t) }
  function hash(a, b, c) {
    let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((b | 0) + 0x632be5ab, 0xc2b2ae35) ^ Math.imul((c | 0) + 0x1b873593, 0x27d4eb2f)
    h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d); h = Math.imul(h ^ (h >>> 12), 0x297a2d39); h ^= h >>> 15
    return (h >>> 0) / 4294967296
  }
  function rng(seed) {
    let a = seed >>> 0
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
  }
  const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]
  const mix = (a, b, t) => { const x = hex(a), y = hex(b); return 'rgb(' + x.map((v, i) => Math.round(lerp(v, y[i], sat(t)))).join(',') + ')' }
  const f1 = (n) => (Math.round(n * 10) / 10).toString()

  // ---------- hand-cut geometry
  function resample(pts, closed, step) {
    const out = [], n = pts.length, segs = closed ? n : n - 1
    for (let i = 0; i < segs; i++) {
      const a = pts[i], b = pts[(i + 1) % n]
      const k = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step))
      for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k])
    }
    if (!closed) out.push(pts[n - 1].slice())
    return out
  }
  function every(pts, sp) {
    const out = [], n = pts.length
    let acc = sp / 2
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n], l = Math.hypot(b[0] - a[0], b[1] - a[1])
      let t = acc
      while (t <= l) { out.push([a[0] + (b[0] - a[0]) * t / l, a[1] + (b[1] - a[1]) * t / l]); t += sp }
      acc = t - l
    }
    return out
  }
  function jitter(pts, closed, amp, r, wave) {
    const n = pts.length, out = [], ph = r() * 9
    for (let i = 0; i < n; i++) {
      if (!closed && (i === 0 || i === n - 1)) { out.push(pts[i].slice()); continue }
      const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n]
      const tx = b[0] - a[0], ty = b[1] - a[1], l = Math.hypot(tx, ty) || 1
      let o = (r() - 0.5) * 2 * amp
      if (wave) o = amp * ((r() - 0.5) * 1.2 + 0.7 * Math.sin(i * 0.41 + ph) + 0.4 * Math.sin(i * 1.27 + ph * 2))
      out.push([pts[i][0] - ty / l * o, pts[i][1] + tx / l * o])
    }
    return out
  }
  const cut = (pts, amp, step, r) => jitter(resample(pts, true, step), true, amp, r)
  const tornLine = (pts, amp, step, r) => jitter(resample(pts, false, step), false, amp, r, true)
  const P = (pts, open) => 'M' + pts.map((p) => f1(p[0]) + ' ' + f1(p[1])).join('L') + (open ? '' : 'Z')
  function rounded(c, radii, segs) {
    const out = [], n = c.length
    for (let i = 0; i < n; i++) {
      const p = c[i], a = c[(i - 1 + n) % n], b = c[(i + 1) % n], rr = Array.isArray(radii) ? radii[i] : radii
      if (!rr) { out.push(p.slice()); continue }
      const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1])
      const ra = Math.min(rr, la * 0.5), rb = Math.min(rr, lb * 0.5)
      const p1 = [p[0] + (a[0] - p[0]) / la * ra, p[1] + (a[1] - p[1]) / la * ra]
      const p2 = [p[0] + (b[0] - p[0]) / lb * rb, p[1] + (b[1] - p[1]) / lb * rb]
      for (let j = 0; j <= segs; j++) {
        const t = j / segs, u = 1 - t
        out.push([u * u * p1[0] + 2 * u * t * p[0] + t * t * p2[0], u * u * p1[1] + 2 * u * t * p[1] + t * t * p2[1]])
      }
    }
    return out
  }
  const ellipse = (cx, cy, rx, ry, n, a0 = 0, a1 = 360) => {
    const o = [], full = a1 - a0 >= 360
    const m = full ? n : n + 1
    for (let i = 0; i < m; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]) }
    return o
  }
  function offsetQuad(c, d) {
    const n = c.length, L = []
    for (let i = 0; i < n; i++) {
      const a = c[i], b = c[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy)
      L.push([a[0] + dy / l * d, a[1] - dx / l * d, dx, dy])
    }
    return L.map((L2, i) => {
      const L1 = L[(i - 1 + n) % n], den = L1[2] * L2[3] - L1[3] * L2[2]
      const t = ((L2[0] - L1[0]) * L2[3] - (L2[1] - L1[1]) * L2[2]) / den
      return [L1[0] + L1[2] * t, L1[1] + L1[3] * t]
    })
  }
  const area = (p) => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1] } return s / 2 }
  const orient = (p, sign) => (Math.sign(area(p)) === sign ? p : p.slice().reverse())

  // ---------- paper grain (generated once)
  function makeGrain() {
    const N = 256, c = document.createElement('canvas')
    c.width = c.height = N
    const g = c.getContext('2d'), img = g.createImageData(N, N), d = img.data, r = rng(11)
    const Gs = 16, grid = []
    for (let i = 0; i < Gs * Gs; i++) grid.push(r())
    const at = (i, j) => grid[(((j % Gs) + Gs) % Gs) * Gs + (((i % Gs) + Gs) % Gs)]
    const vn = (x, y) => {
      const gx = x / N * Gs, gy = y / N * Gs, x0 = Math.floor(gx), y0 = Math.floor(gy), fx = gx - x0, fy = gy - y0
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy)
      return lerp(lerp(at(x0, y0), at(x0 + 1, y0), sx), lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), sx), sy)
    }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = (y * N + x) * 4, m = vn(x, y) - 0.5, s = r()
      let v, a
      if (s < 0.045) { v = 40; a = 26 + r() * 40 } else if (s > 0.955) { v = 255; a = 34 + r() * 46 } else { v = m > 0 ? 255 : 30; a = Math.abs(m) * 30 + r() * 9 }
      d[i] = v; d[i + 1] = v * 0.96; d[i + 2] = v * 0.9; d[i + 3] = a
    }
    g.putImageData(img, 0, 0)
    for (let k = 0; k < 150; k++) {
      const x = r() * N, y = r() * N, an = r() * Math.PI * 2, L = 5 + r() * 20, bend = (r() - 0.5) * 9, light = r() < 0.62
      g.strokeStyle = light ? 'rgba(255,250,238,' + (0.16 + r() * 0.24).toFixed(2) + ')' : 'rgba(64,40,18,' + (0.1 + r() * 0.14).toFixed(2) + ')'
      g.lineWidth = 0.45 + r() * 0.7
      for (let ox = -N; ox <= N; ox += N) for (let oy = -N; oy <= N; oy += N) {
        g.beginPath(); g.moveTo(x + ox, y + oy)
        g.quadraticCurveTo(x + ox + Math.cos(an) * L / 2 - Math.sin(an) * bend, y + oy + Math.sin(an) * L / 2 + Math.cos(an) * bend, x + ox + Math.cos(an) * L, y + oy + Math.sin(an) * L)
        g.stroke()
      }
    }
    return c
  }
  const grainC = makeGrain()
  const grainURL = grainC.toDataURL('image/png')
  root.style.setProperty('--grain', 'url("' + grainURL + '")')

  // ---------- elements
  const E = {
    defs: q('.h-paper__defs'), out: q('.h-paper__out'), sky: q('.h-paper__sky'), sun: q('.h-paper__sun'), clouds: q('.h-paper__clouds'),
    fire: q('.h-paper__fire'), pa: q('.h-paper__pa'), pb: q('.h-paper__pb'), flash: q('.h-paper__flash'), glass: q('.h-paper__glass'),
    rig: q('.h-paper__rig'), room: q('.h-paper__room'), tags: qa('.h-paper__tag'), vv: q('.h-paper__vv'), av: q('.h-paper__av'),
    mates: qa('.h-paper__mate'), vig: q('.h-paper__vig'), warm: q('.h-paper__warm'), bloom: q('.h-paper__bloom'), dark: q('.h-paper__dark'),
    h1: q('.h-paper__h1'), words: qa('.h-paper__w'), fsvg: q('.h-paper__fsvg'), low: q('.h-paper__low'), sub: q('.h-paper__sub'), ctas: q('.h-paper__ctas'), btns: qa('.h-paper__btn'),
  }
  const fctx = E.fire.getContext('2d')
  const grainPat = fctx.createPattern(grainC, 'repeat')

  E.defs.innerHTML = '<defs>' +
    '<pattern id="' + uid + 'g" patternUnits="userSpaceOnUse" width="256" height="256"><image href="' + grainURL + '" width="256" height="256"/></pattern>' +

  // ---------- geometry
  let G = null
  function geom() {
    const W = root.clientWidth, H = root.clientHeight
    if (!W || !H) return null
    const portrait = W / H < 0.9
    let ww, wy0, wy1
    if (!portrait) {
      ww = Math.min(W * 0.6, H * 1.0)
      wy0 = Math.max(98, H * 0.118)
      wy1 = H * lerp(0.62, 0.655, sat((H - 720) / 180))
    } else {
      ww = W - 2 * Math.max(14, W * 0.04)
      wy0 = 94
      wy1 = H * (H < 720 ? 0.565 : 0.555)
    }
    const wx0 = (W - ww) / 2, wx1 = wx0 + ww, wh = wy1 - wy0
    const ft = clamp(ww * 0.032, 13, 34)
    const ins = ww * (portrait ? 0.035 : 0.05)
    const rt = Math.min(ww, wh) * 0.17, rb = Math.min(ww, wh) * 0.12
    const quad = [[wx0 + ins, wy0], [wx1 - ins, wy0], [wx1, wy1], [wx0, wy1]]
    const k = clamp(Math.min(W, H * 1.25) / 1000, 0.42, 1.3)
    return { W, H, portrait, ww, wh, wx0, wx1, wy0, wy1, ft, ins, rt, rb, quad, k,
      bx: wx0 - ft, by: wy0 - ft, bw: ww + 2 * ft, bh: wh + 2 * ft }
  }
  const winShape = (d) => rounded(offsetQuad(G.quad, d), [G.rt + d, G.rt + d, G.rb + d, G.rb + d], 10)
  const local = (pts) => pts.map((p) => [p[0] - G.bx, p[1] - G.by])
  const box = (el) => { el.style.left = G.bx + 'px'; el.style.top = G.by + 'px'; el.style.width = G.bw + 'px'; el.style.height = G.bh + 'px' }
  const svgSize = (el, w, h) => { el.setAttribute('viewBox', '0 0 ' + f1(w) + ' ' + f1(h)); el.setAttribute('width', f1(w)); el.setAttribute('height', f1(h)) }

  // ---------- cabin (wall, frame, ribs, ceiling)
  function buildRoom() {
    const { W, H, portrait, ft, ww } = G, r = rng(1234)
    svgSize(E.room, W, H)

    let s = ''

    // score lines on the back wall
    const seams = []
    for (let i = 1; i < 6; i++) { const y = G.wy0 + G.wh * 0.16 * i + (r() - 0.5) * 8; seams.push(P(tornLine([[-10, y], [W + 10, y + (r() - 0.5) * 10]], 0.6, 40, r), true)) }
    s += '<defs><clipPath id="' + uid + 'wc"><path clip-rule="evenodd" d="' + wallD + '"/></clipPath></defs><g clip-path="url(#' + uid + 'wc)">'

    s += '<path d="' + seams.join('') + '" fill="none" stroke="#b78a5b" stroke-width="1" opacity=".35" transform="translate(0 1.4)"/></g>'
    s += gr(wallD, 0.62, 1) + '</g>'
    if (!portrait) {
      const pad = ft + ww * 0.055
      const plate = cut(winShape(pad), 1, 18, r)
      const plateD = P(plate) + P(hole)
      s += '<g filter="url(#' + uid + 's2)"><path fill-rule="evenodd" fill="#b5864f" d="' + plateD + '"/>' + gr(plateD, 0.6, 1)
      s += every(winShape(pad - ww * 0.022), ww * 0.045).map(([x, y]) => '<circle cx="' + f1(x) + '" cy="' + f1(y) + '" r="2.8" fill="#6b4627"/><circle cx="' + f1(x - 0.9) + '" cy="' + f1(y - 0.9) + '" r="1.1" fill="#dcb886"/>').join('')

    s += every(winShape(ft * 0.7), Math.max(ft * 2.6, 34)).map(([x, y]) => '<circle cx="' + f1(x) + '" cy="' + f1(y) + '" r="' + f1(ft * 0.12) + '" fill="#c8a678"/><circle cx="' + f1(x + 0.5) + '" cy="' + f1(y + 0.6) + '" r="' + f1(ft * 0.05) + '" fill="#6d5236"/>').join('')
    s += '</g>'
    const bev = cut(winShape(ft * 0.34), 0.7, 12, r)
    const bevD = P(bev) + P(hole)
    s += '<g filter="url(#' + uid + 's1)"><path fill-rule="evenodd" fill="#5a493c" d="' + bevD + '"/>' + gr(bevD, 0.7, 1) + '</g>'
    // curved ribs at the sides (desktop)
    if (!portrait && G.wx0 > 120) {
      const rw = Math.min(G.wx0 * 0.3, 96)
      for (const side of [0, 1]) {
        const pts = [[-30, 60]]
        for (let i = 0; i <= 16; i++) { const y = 60 + (H - 40) * i / 16, e = (y - H * 0.45) / (H * 0.62); pts.push([rw * (0.55 + 0.75 * e * e), y]) }

        const inner = []

        s += '<g filter="url(#' + uid + 's2)"><path fill="#4a3627" d="' + P(sp) + '"/>' + gr(P(sp), 0.65)
        s += '<path d="' + P(ip, true) + '" fill="none" stroke="#6c513c" stroke-width="3" opacity=".8"/>'
        s += every(ip.slice(0, -1).concat(ip.slice(0, -1).reverse()), 46).slice(0, 12).map(([x, y]) => '<circle cx="' + f1(x + (side ? 14 : -14)) + '" cy="' + f1(y) + '" r="2.6" fill="#b89366"/>').join('')

    // ceiling card under the nav
    const ch = 80
    const ceil = [[-30, -30], [W + 30, -30]]

    const ceilP = ceil.concat(edge)
    s += '<g filter="url(#' + uid + 's2)"><path fill="#1c1611" d="' + P(ceilP) + '"/>'
    const lip = tornLine([[W + 30, ch - 4], [W * 0.5, ch], [-30, ch - 4]], 0.7, 30, r)
    s += '<path d="' + P(lip.concat(edge.slice().reverse())) + '" fill="#2e241b"/>' + gr(P(ceilP), 0.5)
    for (const lx of portrait ? [0.5] : [0.32, 0.68]) {

      s += '<circle cx="' + f1(x) + '" cy="' + f1(y) + '" r="15" fill="#f7c86c" opacity=".12"/><circle cx="' + f1(x) + '" cy="' + f1(y) + '" r="9" fill="#f7c86c" opacity=".18"/>'

    E.room.innerHTML = s

  }

  // ---------- outside: sky, earth, sun, clouds on sticks, glass
  let CL = []
  function buildOut() {
    const { bw: w, bh: h, ft, ww, wh, portrait } = G, r = rng(4321)
    ;[E.sky, E.glass, E.clouds, E.flash].forEach(box)
    svgSize(E.sky, w, h); svgSize(E.glass, w, h)
    let s = ''
    const bands = [[0, '#2753c4'], [0.15, '#3567d4'], [0.28, '#457be0'], [0.4, '#5a92ea'], [0.5, '#76a9f1'], [0.585, '#98c2f6'], [0.65, '#bcd9f9']]
    bands.forEach(([f, c], i) => {
      if (!i) { s += '<rect x="-20" y="-20" width="' + f1(w + 40) + '" height="' + f1(h + 40) + '" fill="' + c + '"/>'; return }
      const y = ft + wh * f, tilt = (r() - 0.5) * wh * 0.03
      const top = tornLine([[-20, y - tilt], [w * 0.5, y + (r() - 0.5) * wh * 0.02], [w + 20, y + tilt]], 0.9 + i * 0.1, 22, r)
      const d = P(top.concat([[w + 20, h + 20], [-20, h + 20]]))
      s += '<g filter="url(#' + uid + 's3)"><path d="' + d + '" fill="' + c + '"/></g>'
    })
    // the curve of the earth, far below
    const yh = ft + wh * (portrait ? 0.74 : 0.72), R = w * 1.5, cx = w * 0.43, cy = yh + R
    const arc = (rad, amp, step) => {
      const span = Math.asin(Math.min(0.99, (w * 0.62) / rad)), pts = []
      const n = Math.max(12, Math.round(rad * span * 2 / step))
      for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 - span + span * 2 * i / n; pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]) }
      return amp ? jitter(pts, false, amp, r, true) : pts
    }
    const closeDown = (pts) => P(pts.concat([[pts[pts.length - 1][0], h + 30], [pts[0][0], h + 30]]))
    s += '<path d="' + closeDown(arc(R + wh * 0.06, 0.6, 18)) + '" fill="#d3ebfb" opacity=".95"/>'
    s += '<g filter="url(#' + uid + 's3)"><path d="' + closeDown(arc(R + wh * 0.016, 0.5, 18)) + '" fill="#f1f9ff"/></g>'
    s += '<g filter="url(#' + uid + 's1)"><path d="' + closeDown(arc(R, 0.7, 16)) + '" fill="#5b93cb"/>'
    s += '<path d="' + closeDown(arc(R - wh * 0.022, 1.2, 14)) + '" fill="#3f78b8"/>'
    s += '<path d="' + closeDown(arc(R - wh * 0.08, 1.6, 14)) + '" fill="#3168a8"/>'
    s += '<path d="' + closeDown(arc(R - wh * 0.17, 1.8, 14)) + '" fill="#2b5c9b"/>'
    // land, sand-coloured, and clusters of cut-paper cloud on the sea
    const onArc = (fx, depth) => { const x = w * fx, dx = x - cx, rad = R - depth; return [x, cy - Math.sqrt(Math.max(0, rad * rad - dx * dx))] }
    for (const [lx, lw, dp] of [[0.12, 0.17, 0.05], [0.7, 0.22, 0.07]]) {
      const [x0, y0] = onArc(lx, wh * dp), pts = []
      for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; pts.push([x0 + Math.cos(a) * w * lw * (0.5 + 0.16 * Math.sin(a * 3 + lx * 9)), y0 + wh * 0.035 + Math.sin(a) * wh * 0.04 * (1 + 0.35 * Math.cos(a * 2))]) }
      const lp = cut(pts, 1.4, 9, r)
      s += '<path d="' + P(lp) + '" fill="#c9a86d"/><path d="' + P(lp.map(([x, y]) => [x0 + (x - x0) * 0.62, y0 + wh * 0.02 + (y - y0 - wh * 0.035) * 0.55])) + '" fill="#b08f58"/>'
    }
    const puff = (x, y, sz, seed) => {
      const rr = rng(seed), parts = []
      const n = 3 + Math.floor(rr() * 3)
      for (let i = 0; i < n; i++) { const px = x + (i - (n - 1) / 2) * sz * 0.9 + (rr() - 0.5) * sz * 0.3, pr = sz * (0.55 + rr() * 0.45) * (1 - Math.abs(i - (n - 1) / 2) * 0.18); parts.push(P(cut(ellipse(px, y - pr * 0.25, pr, pr * 0.62, 12), 0.5, 5, rr))) }
      parts.push(P(cut([[x - sz * n * 0.48, y - sz * 0.05], [x + sz * n * 0.48, y - sz * 0.05], [x + sz * n * 0.42, y + sz * 0.22], [x - sz * n * 0.42, y + sz * 0.22]], 0.5, 6, rr)))
      return parts.join('')
    }
    let pd = ''

      const [x, y] = onArc(fx, depth)
      pd += puff(x, y, wh * (0.011 + depth / wh * 0.09), 200 + i)
    }
    s += '<path d="' + pd + '" fill="#a9c3e2" transform="translate(1.5 2.5)"/><path d="' + pd + '" fill="#f6f9fc"/>'
    s += '</g>'
    s += gr('M0 0H' + f1(w) + 'V' + f1(h) + 'H0Z', 0.5)
    E.sky.innerHTML = s

    // sun, peeking past the frame's top corner
    const sr = Math.min(ww, wh) * 0.06, sx = ft + ww * 0.885, sy = ft + wh * 0.1
    svgSize(E.sun, sr * 4.4, sr * 4.4)
    E.sun.style.left = f1(G.bx + sx - sr * 2.2) + 'px'; E.sun.style.top = f1(G.by + sy - sr * 2.2) + 'px'
    let su = '<g transform="translate(' + f1(sr * 2.2) + ' ' + f1(sr * 2.2) + ')" filter="url(#' + uid + 's1)">'
    const rays = []
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2, L = sr * (i % 2 ? 1.65 : 2.05), wd = 0.16
      rays.push([Math.cos(a - wd) * sr * 1.12, Math.sin(a - wd) * sr * 1.12], [Math.cos(a) * L, Math.sin(a) * L], [Math.cos(a + wd) * sr * 1.12, Math.sin(a + wd) * sr * 1.12])

    for (let i = 0; i < 12; i++) su += '<path d="' + P(rays.slice(i * 3, i * 3 + 3)) + '" fill="#ffe28f"/>'
    su += '<path d="' + P(cut(ellipse(0, 0, sr * 1.18, sr * 1.18, 18), 0.6, 6, r)) + '" fill="#ffd65e"/>'
    su += '<path d="' + P(cut(ellipse(0, 0, sr, sr, 16), 0.6, 6, r)) + '" fill="#fff3c4"/>'
    su += '</g>'
    E.sun.innerHTML = su

    // clouds on sticks
    E.clouds.innerHTML = ''
    CL = []
    const defs = portrait
      ? [[0.2, 0.5, 0.36], [0.62, 0.58, 0.3], [0.86, 0.44, 0.24]]
      : [[0.16, 0.5, 0.21], [0.47, 0.62, 0.17], [0.8, 0.46, 0.24]]
    defs.forEach(([fx, fy, fw], i) => {
      const cw = ww * fw, chh = cw * 0.56, rr = rng(70 + i)

      const ox = 8
      const bumps = [[0.2, 0.62, 0.19], [0.39, 0.42, 0.25], [0.62, 0.38, 0.24], [0.82, 0.6, 0.17], [0.52, 0.66, 0.2]]
      let c = ''
      const sw = Math.max(5, cw * 0.045), sxx = ox + cw * 0.5 - sw / 2
      c += '<g filter="url(#' + uid + 's1)"><path d="' + P(cut([[sxx, stickTop], [sxx + sw, stickTop], [sxx + sw, stickTop + stickLen], [sxx, stickTop + stickLen]], 0.5, 20, rr)) + '" fill="#d6ad74"/>'
      c += '<rect x="' + f1(sxx + sw * 0.62) + '" y="' + f1(stickTop) + '" width="' + f1(sw * 0.28) + '" height="' + f1(stickLen) + '" fill="#b98b52"/></g>'
      const shapes = (grow) => bumps.map(([bx, by, br]) => P(cut(ellipse(ox + cw * bx, chh * by, cw * br + grow, cw * br + grow, 15), 0.7, 7, rr))).join('') +
        P(cut(rounded([[ox + cw * 0.06 - grow, chh * 0.58], [ox + cw * 0.94 + grow, chh * 0.58], [ox + cw * 0.94 + grow, chh * 0.86 + grow], [ox + cw * 0.06 - grow, chh * 0.86 + grow]], chh * 0.14, 5), 0.6, 10, rr))
      c += '<g filter="url(#' + uid + 's2)"><path d="' + shapes(2.5) + '" fill="#b7cde6" transform="translate(2 3.5)"/><path d="' + shapes(0) + '" fill="#fbfcfd"/>'
      c += '<path d="' + shapes(0) + '" fill="url(#' + uid + 'g)" opacity=".5"/></g>'
      c += '<path d="' + P(cut([[sxx - sw * 0.9, stickTop - 2], [sxx + sw * 1.9, stickTop - 4], [sxx + sw * 1.9, stickTop + sw * 1.5], [sxx - sw * 0.9, stickTop + sw * 1.6]], 0.6, 6, rr)) + '" fill="#ecdfbd" opacity=".85"/>'

      E.clouds.appendChild(svg)
      CL.push({ el: svg, hide: h + 40 - ctop, i, amp: ww * (0.018 + 0.01 * i), per: 11 + i * 2.7, ph: i * 2.1 })
    })

    // cellophane glass with a glint
    const win = local(winShape(0))
    let gl = '<defs><clipPath id="' + uid + 'gc"><path d="' + P(win) + '"/></clipPath></defs><g clip-path="url(#' + uid + 'gc)">'
    gl += '<path d="' + P(win) + '" fill="#d6e6ff" opacity=".05"/>'
    gl += '<path d="' + P([[w * 0.06, h], [w * 0.2, h], [w * 0.6, 0], [w * 0.46, 0]]) + '" fill="#fff" opacity=".045"/>'
    gl += '<path d="' + P([[w * 0.24, h], [w * 0.27, h], [w * 0.67, 0], [w * 0.64, 0]]) + '" fill="#fff" opacity=".07"/>'
    gl += '<g class="h-paper__glint" style="display:none"><path d="' + P([[0, h], [w * 0.05, h], [w * 0.45, 0], [w * 0.4, 0]]) + '" fill="#fff" opacity=".26"/><path d="' + P([[w * 0.07, h], [w * 0.085, h], [w * 0.485, 0], [w * 0.47, 0]]) + '" fill="#fff" opacity=".2"/></g>'
    gl += '</g>'
    E.glass.innerHTML = gl
    E.glint = E.glass.querySelector('.h-paper__glint')

    // fire canvas and the two halves it tears into
    const dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2600000 / (w * h)))
    ;[E.fire, E.pa, E.pb].forEach((c) => { box(c); c.width = Math.round(w * dpr); c.height = Math.round(h * dpr) })
    FX.dpr = dpr; FX.w = w; FX.h = h; FX.torn = false
    const d = [0.86, -0.51], n = [0.51, 0.86]
    FX.d = d; FX.n = n
    const corners = [[0, 0], [w, 0], [w, h], [0, h]]
    const us = corners.map((p) => p[0] * d[0] + p[1] * d[1]), vs = corners.map((p) => p[0] * n[0] + p[1] * n[1])
    FX.umin = Math.min(...us); FX.umax = Math.max(...us); FX.vmin = Math.min(...vs); FX.vmax = Math.max(...vs)
    FX.diag = Math.hypot(w, h)
    const rs = rng(99)
    FX.stars = []
    for (let i = 0; i < 70; i++) FX.stars.push({ x: rs() * w, y: rs() * h * 0.9, r: 0.6 + rs() * rs() * 1.8, c: rs() < 0.8 ? '#efe4cf' : '#ffd9a0', i })
    // tear line, top to bottom

  const FX = {}

  // ---------- fire, drawn as layered paper strips at 12 fps
  const LAYERS = [
    { c0: '#4f170c', c1: '#8a2913', n: 6, w: 0.36, s: 0.0, fl: 0 },
    { c0: '#7d2412', c1: '#c03b1b', n: 7, w: 0.25, s: 0.05, fl: 3 },
    { c0: '#a83c19', c1: '#e5602a', n: 8, w: 0.18, s: 0.16, fl: 4 },
    { c0: '#cc6a26', c1: '#f39634', n: 8, w: 0.13, s: 0.3, fl: 5 },
    { c0: '#e8a53b', c1: '#fbc84b', n: 8, w: 0.085, s: 0.46, fl: 5 },
    { c0: '#fbe39c', c1: '#fff3c9', n: 6, w: 0.045, s: 0.64, fl: 7 },
  ]
  function drawFire(F, t, I) {
    const g = fctx, { w, h, dpr, d, n, diag } = FX
    const V = FX.vmax - FX.vmin
    const uv = (u, v) => [u * d[0] + v * n[0], u * d[1] + v * n[1]]
    const enter = (v) => Math.max(-v * n[0] / d[0], (h - v * n[1]) / d[1])

    })
  }

  // ---------- layout of the copy and the tags
  function layoutCopy() {
    if (!G) return
    const s = root.style, { portrait, ww, wh, W, H } = G
    const l1 = portrait ? clamp(ww * 0.066, 19, 40) : clamp(ww * 0.039, 22, 42)
    const u = portrait ? Math.min(ww * 0.192, wh * 0.27) : Math.min(ww * 0.162, wh * 0.3)
    s.setProperty('--wx', G.wx0 + 'px'); s.setProperty('--ww', ww + 'px'); s.setProperty('--l1', f1(l1) + 'px')
    s.setProperty('--fw', f1(4.5 * u) + 'px'); s.setProperty('--fh', f1(1.62 * u) + 'px')
    const sub = portrait ? clamp(W * 0.04, 14.5, 17) : clamp(H * 0.0195, 15, 18.5)
    s.setProperty('--sub', f1(sub) + 'px')
    s.setProperty('--lw', f1(portrait ? Math.min(W - 28, 540) : clamp(ww * 0.7, 480, sub * 36)) + 'px')
    if (G.u !== u) buildFast(u)
    const hh = E.h1.offsetHeight
    const hy = G.wy0 + Math.max(wh * 0.05, (wh - hh) * (portrait ? 0.3 : 0.38))
    s.setProperty('--hy', f1(hy) + 'px')
    const lh = E.low.offsetHeight
    let ly = G.wy1 + G.ft * (portrait ? 1.5 : 1.15)
    ly = Math.min(ly, H - lh - (portrait ? 22 : 26))
    s.setProperty('--ly', f1(ly) + 'px')
    // on phones the crew sit behind the label: cut them off under its top edge
    E.mates.forEach((m) => { m.style.clipPath = portrait ? 'inset(0 0 ' + f1(Math.max(0, parseFloat(m.style.top) + parseFloat(m.style.height) - (ly + 14))) + 'px 0)' : '' })
    // readout tags
    G.tagSpots = []
    if (!portrait) {
      const tw = clamp(G.wx0 * 0.6, 128, 172)
      const py = G.wy0 + wh * 0.14
      G.tagSpots = [[G.wx0 * 0.5, py, tw], [W - G.wx0 * 0.5, py + wh * 0.06, tw]]
    } else {
      const bottom = ly + lh
      if (H - bottom > 96) {
        const tw = Math.min(146, (W - 48) / 2)
        G.tagSpots = [[W * 0.5 - tw * 0.56, bottom + 20, tw], [W * 0.5 + tw * 0.56, bottom + 26, tw]]
      }
    }
    E.tags.forEach((t, i) => {
      const sp = G.tagSpots[i]
      if (!sp) { t.style.display = 'none'; return }
      t.style.display = ''; t.style.width = f1(sp[2]) + 'px'
      t.style.left = f1(sp[0] - sp[2] / 2) + 'px'; t.style.top = f1(sp[1]) + 'px'
    })
  }

  function buildAll() {
    G = geom()
    if (!G) return false
    buildRoom(); buildOut(); placeMates()
    if (E.matesFor !== G.portrait) { E.matesFor = G.portrait; E.mates.forEach((m, i) => buildMate(m.firstElementChild, i)) }
    layoutCopy()
    return true
  }

  // ---------- one clock: everything is a function of T, stepped at 12 fps
  const tf = (x, y, r, s) => 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)' + (r ? ' rotate(' + r.toFixed(3) + 'deg)' : '') + (s && s !== 1 ? ' scale(' + s.toFixed(3) + ')' : '')
  const jig = (F, id, a) => [(hash(F, id, 1) - 0.5) * 2 * a, (hash(F, id, 2) - 0.5) * 2 * a, (hash(F, id, 3) - 0.5) * 2]
  const show = (el, on) => { const v = on ? 'visible' : 'hidden'; if (el.style.visibility !== v) el.style.visibility = v }
  const fade = (el, on) => { const v = on ? '1' : '0'; if (el.style.opacity !== v) el.style.opacity = v }
  const SEQ = [[1.62, -0.5, 3, 1], [1.32, -0.24, 2, 0.62], [1.1, -0.06, 1.4, 0.28], [0.94, 0.02, -0.5, 0], [1.03, 0, 1.25, 0.04]]
  let lastRead = ''
  function render(T) {
    if (!G) return
    const F = Math.floor(T * FPS + 1e-6), t = F / FPS, k = G.k
    const I = t < 0.5 ? 0 : Math.min(1, Math.pow((t - 0.5) / 3.4, 1.3))
    const kb = F - 54, broke = kb >= 0
    let shk
    if (t < 0.5) shk = 0
    else if (!broke) shk = 0.5 + 8.5 * Math.pow(Math.min(1, (t - 0.5) / 3.7), 2.1)
    else shk = 13 * Math.exp(-(t - 4.5) * 3.4)
    const Fb = t > 10 ? F >> 1 : F
    const boil = 0.32
    const amp = (shk + boil) * k
    let j = jig(Fb, 1, amp)
    E.rig.style.transform = tf(j[0], j[1], j[2] * amp * 0.045)
    j = jig(Fb, 2, amp * 0.55)
    E.out.style.transform = tf(j[0], j[1], j[2] * amp * 0.02)
    // crew jostle, a frame late, and sway at rest
    E.mates.forEach((m, i) => {
      const jj = jig(Fb - 1, 10 + i, amp * 1.15), sw = Math.sin(t * (0.55 + i * 0.13) + i * 2) * 0.9
      m.style.transform = tf(jj[0], jj[1] + (broke ? Math.sin(t * 0.9 + i) * 1.2 * k : 0), jj[2] * amp * 0.08 + sw * (broke ? 1 : 0.3))
    })
    // copy: headline shakes a little, the label and buttons hardly
    j = jig(F, 3, shk * k * 0.35)
    E.h1.style.transform = tf(j[0], j[1], j[2] * shk * 0.02)
    j = jig(F, 4, shk * k * 0.12)
    E.low.style.transform = 'translateX(-50%) ' + tf(j[0], j[1], 0)

    // first line: words slapped down one by one from 0.42s
    E.words.forEach((w, i) => {
      const jw = F - (5 + i)
      fade(w, jw >= 0)
      if (jw < 0) return
      const r0 = [-1.6, 1.1, -0.7, 1.4, -1.1, 0.9][i], dy0 = [0, 2, -1, 1, -2, 1][i] * k
      const sc = jw === 0 ? 1.24 : jw === 1 ? 1.06 : 1, rr = jw === 0 ? r0 * 3 : jw === 1 ? r0 * 1.6 : r0
      const wj = shk > 1 ? jig(F, 40 + i, shk * 0.1) : [0, 0, 0]
      w.style.transform = tf(wj[0], dy0 + (jw === 0 ? -8 * k : 0) + wj[1], rr + wj[2] * shk * 0.05, sc)
    })
    // label and buttons
    const js = F - 9
    fade(E.sub, js >= 0); fade(E.ctas, F >= 11)
    if (js >= 0) E.sub.style.transform = js === 0 ? 'translateY(-10px) rotate(-2deg) scale(1.04)' : js === 1 ? 'translateY(-2px) rotate(-.2deg)' : 'rotate(-.6deg)'
    E.btns.forEach((b, i) => { const jb = F - 11 - i; b.style.opacity = jb >= 0 ? '' : '0'; b.style.translate = jb === 0 ? '0 -8px' : '' })

    // "fast." drops in at the peak, cools at the break
    const cool = broke ? sat(kb / 6) : 0
    const hotFlick = !broke && hash(F, 77, 1) > 0.5
    const col = (key) => cool > 0 ? mix(HOT[key], COOL[key], cool) : key === 'fc' && hotFlick ? '#ffe789' : HOT[key]
    const cfc = col('fc'), cmd = col('md'), cbk = col('bk')
    LET.forEach((L, i) => {
      const jl = F - (41 + i), m = L.m, u = G.u
      if (jl < 0) { fade(L.el, false); return }
      fade(L.el, true)
      const sq = jl < SEQ.length ? SEQ[jl] : [1, 0, 1, 0]
      let [sc, dy, rm, lift] = sq
      if (kb === 0) { dy -= 0.05; lift = 0.12 } else if (kb === 1) { dy += 0.01 }
      const key = sc + '|' + dy + '|' + lift + '|' + cfc + cmd
      if (L.key !== key) {
        L.key = key
        const rot = m.rot * rm
        L.el.setAttribute('transform', 'translate(' + f1(m.cx) + ' ' + f1(m.cy + m.dy + dy * u) + ') rotate(' + rot.toFixed(2) + ') scale(' + sc + ') translate(' + f1(-m.cx) + ' ' + f1(-m.cy) + ')')
        L.sh.setAttribute('transform', 'translate(' + f1((0.05 + lift * 0.25) * u) + ' ' + f1((0.08 + lift * 0.4) * u) + ')')
        L.sh.setAttribute('opacity', (0.5 - lift * 0.25).toFixed(2))
        L.fc.setAttribute('fill', cfc); L.md.setAttribute('fill', cmd); L.bk.setAttribute('fill', cbk)
      }
    })
    // confetti from the forge
    const kf = F - 44
    E.burst.forEach((b, i) => {
      if (kf < 0 || kf > 9) { if (b.style.display !== 'none') b.style.display = 'none'; return }
      b.style.display = ''
      const u = G.u, L = LET[i % 5].m, a = hash(i, 3, 3) * Math.PI * 2, sp = (0.6 + hash(i, 4, 4)) * u * 0.45
      const x = L.cx + Math.cos(a) * sp * kf * 0.55, y = L.cy + Math.sin(a) * sp * kf * 0.4 + 0.02 * u * kf * kf
      b.setAttribute('transform', 'translate(' + f1(x) + ' ' + f1(y) + ') rotate(' + ((hash(F, i, 5) * 360) | 0) + ')')
      b.setAttribute('opacity', kf > 6 ? '0.5' : '1')
    })

    // outside
    if (!broke) {
      show(E.fire, true); show(E.pa, false); show(E.pb, false)
      if (FX.lastF !== F) { drawFire(F, t, I); FX.lastF = F }
      FX.torn = false
      E.flash.style.opacity = '0'
    } else {
      tearPieces(); FX.lastF = -1
      show(E.fire, false)
      const on = kb < 9
      show(E.pa, on); show(E.pb, on)
      if (on) {
        const q2 = kb * kb
        E.pa.style.transformOrigin = '0% 100%'; E.pb.style.transformOrigin = '100% 100%'
        E.pa.style.transform = tf(-(4 + kb * 0.03 * G.bw + q2 * 0.02 * G.bw), q2 * 0.012 * G.bh, -Math.min(50, q2 * 1.3))
        E.pb.style.transform = tf(4 + kb * 0.035 * G.bw + q2 * 0.022 * G.bw, q2 * 0.009 * G.bh, Math.min(50, q2 * 1.15))
      }
      E.flash.style.opacity = ['0', '.9', '.5', '.2'][kb] || '0'
    }
    show(E.sky, broke); show(E.sun, broke); show(E.clouds, broke)
    if (broke) {
      CL.forEach((c) => {
        const kr = F - (55 + c.i)
        const rise = kr < 0 ? 1 : [0.75, 0.4, 0.12, -0.05, 0.02][kr] ?? 0
        const dx = Math.sin(t * Math.PI * 2 / c.per + c.ph) * c.amp + (hash(Fb, c.i, 8) - 0.5) * 0.8
        const dy = rise * c.hide + Math.sin(t * 1.1 + c.i) * 1.5 * k + (hash(Fb, c.i, 9) - 0.5) * 0.8
        c.el.style.transform = tf(dx, dy, Math.sin(t * 0.7 + c.ph) * 1.2 + (kr >= 0 && kr < 4 ? (2 - kr) * 2 : 0))
      })
      const sunStep = Math.floor(t / 1.25) % 2
      E.sun.style.transform = tf(0, 0, sunStep * 5)
      // an occasional glint across the glass
      const gp = (t - 6.5) % 9.5
      if (t > 6.5 && gp < 0.84) { E.glint.style.display = ''; E.glint.setAttribute('transform', 'translate(' + f1(-G.bw * 0.5 + (Math.floor(gp * FPS) / 10) * G.bw * 1.1) + ' 0)') } else E.glint.style.display = 'none'
    }

    // the cabin light: up out of the dark, firelight flicker, then daylight
    const dk = t < 1 ? 1 - smooth(0, 1, t) : 0
    E.dark.style.opacity = dk.toFixed(3); show(E.dark, dk > 0)
    const mf = dk > 0 ? 'brightness(' + (1 - dk * 0.9).toFixed(3) + ')' : ''
    E.mates.forEach((m) => { if (m.style.filter !== mf) m.style.filter = mf })
    let vg, wm = 0, bl = 0
    if (!broke) { vg = 0.95 - 0.5 * I * (0.65 + 0.35 * hash(F, 61, 1)); wm = Math.min(1, 0.12 + I * (0.55 + 0.45 * hash(F, 62, 1))) * smooth(0, 0.6, t) }
    else { vg = lerp(0.45, 0.95 - 0.5 * 0.8, Math.exp(-kb * 0.5)); wm = kb < 3 ? 0.6 - kb * 0.2 : 0; bl = ['0', '.42', '.2', '.07'][kb] || 0 }
    E.vig.style.opacity = vg.toFixed(3); E.warm.style.opacity = wm.toFixed(3); show(E.warm, wm > 0)
    E.bloom.style.opacity = bl; show(E.bloom, +bl > 0)

    // tags sway on their pins
    E.tags.forEach((tg, i) => {
      const sw = Math.sin(t * (1.3 + i * 0.21) + i * 1.7) * (broke ? 2.2 : 0.8) + (shk > 1 ? (hash(F, 80 + i, 1) - 0.5) * shk * 1.6 : 0)
      tg.style.transform = 'rotate(' + (sw + (i ? 1.5 : -1.5)).toFixed(2) + 'deg)'
    })
    // thumbs up from the right seat
    if (E.arm) {
      const ka = F - 64, kd = F - 104
      let a = 185
      if (ka >= 0) a = [150, 95, 45, 6, 20, 12][ka] ?? 12
      if (ka >= 6 && kd < 0) a = 12 + Math.round(Math.sin(t * 6) * 1.5) * 4
      if (kd >= 0) a = [30, 80, 140, 180][kd] ?? 185
      if (E.arm.a !== a) { E.arm.a = a; E.arm.setAttribute('transform', 'rotate(' + a + ' 205 140)') }
    }

    // readouts
    let v, al
    if (t < 4.8) { v = 7.8; al = 122 }
    else if (t < 10) { const p = 1 - Math.pow(1 - (t - 4.8) / 5.2, 2.4); v = lerp(7.8, 0.24, p); al = lerp(122, 38, p) }
    else { const e = 1 - Math.exp(-(t - 10) / 420); v = 0.24 - 0.06 * e; al = 38 - 6 * e }
    const rv = v.toFixed(3), ra = al.toFixed(2)
    if (rv + ra !== lastRead) { lastRead = rv + ra; E.vv.textContent = rv; E.av.textContent = ra }
  }

  // ---------- driving the clock
  let T = 0, last = 0, raf = 0, running = false, lastF = -1, onscreen = true
  function frame(now) {
    raf = requestAnimationFrame(frame)
    const dt = last ? Math.min(0.5, (now - last) / 1000) : 0
    last = now; T += dt
    const F = Math.floor(T * FPS + 1e-6)
    if (F !== lastF) { lastF = F; render(T) }
  }
  function sync() {
    const go = !reduce && onscreen && !document.hidden && !!G
    if (go && !running) { running = true; last = 0; raf = requestAnimationFrame(frame) }
    else if (!go && running) { running = false; cancelAnimationFrame(raf) }
  }
  function relayout() {
    if (!buildAll()) return
    lastF = -1
    render(reduce ? REST : T)
    sync()
  }
  clipDOM()
  relayout()
  let pend = 0
  const later = (fn) => { if (pend) return; pend = requestAnimationFrame(() => { pend = 0; fn() }) }
  if (window.ResizeObserver) {
    let w0 = 0, h0 = 0
    new ResizeObserver(() => {
      const w = root.clientWidth, h = root.clientHeight
      if (w === w0 && h === h0) return
      w0 = w; h0 = h
      later(relayout)
    }).observe(root)
    new ResizeObserver(() => later(() => { if (G) { layoutCopy(); render(reduce ? REST : T) } })).observe(E.h1)
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (G) { layoutCopy(); render(reduce ? REST : T) } })
  if (window.IntersectionObserver) new IntersectionObserver((es) => { onscreen = es[es.length - 1].isIntersecting; sync() }).observe(root)
  document.addEventListener('visibilitychange', sync)
  if (mq.addEventListener) mq.addEventListener('change', () => { reduce = mq.matches; lastF = -1; render(reduce ? REST : T); sync() })
  root.addEventListener('h-seek', (e) => { T = Math.max(0, +e.detail || 0); last = 0; lastF = Math.floor(T * FPS + 1e-6); render(T) })
})()
</script>
