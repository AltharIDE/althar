<style>

.h-ascii .h-ascii-bg{image-rendering:pixelated}
.h-ascii .h-ascii-gl{mix-blend-mode:screen;opacity:.6}
.h-ascii .h-ascii-h1{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.h-ascii .h-ascii-copy{position:absolute;left:0;top:0;font-size:var(--fs);line-height:var(--ch);font-weight:400;letter-spacing:0;font-kerning:none;font-variant-ligatures:none}

.h-ascii .h-ascii-cta[data-off]{visibility:hidden}
.h-ascii .h-ascii-btn{display:inline-flex;align-items:center;justify-content:space-between;box-sizing:border-box;height:calc(var(--ch)*var(--bh));padding:0 var(--cw);white-space:pre;text-decoration:none;font:700 var(--fs)/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff;background:#2b3bff;box-shadow:var(--cw) calc(var(--ch)/2) 0 #040302;outline:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

.h-ascii .h-ascii-btn:focus-visible{box-shadow:var(--cw) calc(var(--ch)/2) 0 #040302,0 0 0 2px #0e0b09,0 0 0 4px #f4ede2}

.h-ascii[data-phone] .h-ascii-btn{flex:1 1 0}

</style>

<script>

  function lut(stops, n) {

  }

    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041);

  {
    let s = 20261030; const rnd = () => ((s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296);

    for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = PERM[i]; PERM[i] = PERM[j]; PERM[j] = t; }

  }
  function vn(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf_ = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = RV[PERM[PERM[X] + Y]], b = RV[PERM[PERM[X + 1] + Y]], c = RV[PERM[PERM[X] + Y + 1]], d = RV[PERM[PERM[X + 1] + Y + 1]];
    const u = xf_ * xf_ * (3 - 2 * xf_), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function wrap(s, w) {
    const out = []; let line = '';
    for (const word of s.split(' ')) {
      if (!line) line = word;
      else if (line.length + 1 + word.length <= w) line += ' ' + word;
      else { out.push(line); line = word; }
    }
    if (line) out.push(line);
    return out;
  }

  // ---------- palettes
  const FIRE = lut([[0, '#0c0605'], [0.12, '#2c0a04'], [0.27, '#6a1705'], [0.41, '#b3330a'], [0.55, '#ec600e'], [0.69, '#ff962c'], [0.81, '#ffc45c'], [0.91, '#ffe8a4'], [1, '#fffaf0']], 256);
  const EXT = lut([[0, '#2a190f'], [0.22, '#4f1a09'], [0.45, '#a52a08'], [0.7, '#f26a12'], [0.88, '#ff963a'], [1, '#ffbb5c']], 256);
  const SKY = ['#a9d3ff', '#86bbfa', '#649ff2', '#4886e7', '#336fd8', '#285ec6', '#204dae', '#1b4096', '#17357f', '#132b6b', '#102359', '#0e1d4c'].map(HX);
  const RAMP = Array.from(' .:-=+*#%@', (c) => c.codePointAt(0));
  const QUAD = [32, 0x2598, 0x259d, 0x2580, 0x2596, 0x258c, 0x259e, 0x259b, 0x2597, 0x259a, 0x2590, 0x259c, 0x2584, 0x2599, 0x259f, 0x2588];
  const QM = {}; QUAD.forEach((c, i) => { QM[c] = i; });
  const BOX = { 0x2500: [1, 1, 0, 0], 0x2502: [0, 0, 1, 1], 0x250c: [0, 1, 0, 1], 0x2510: [1, 0, 0, 1], 0x2514: [0, 1, 1, 0], 0x2518: [1, 0, 1, 0], 0x251c: [0, 1, 1, 1], 0x2524: [1, 0, 1, 1], 0x252c: [1, 1, 0, 1], 0x2534: [1, 1, 1, 0], 0x253c: [1, 1, 1, 1], 0x2501: [2, 2, 0, 0], 0x2503: [0, 0, 2, 2] };
  const ARC = { 0x256d: 0, 0x256e: 1, 0x256f: 2, 0x2570: 3 };
  const STR = new Map();
  const str = (c) => { let s = STR.get(c); if (!s) { s = String.fromCodePoint(c); STR.set(c, s); } return s; };
  const CP = (s) => s.codePointAt(0);
  const C_FULL = 0x2588, C_TOP = 0x2580, C_BOT = 0x2584, C_S1 = 0x2591, C_S2 = 0x2592, C_S3 = 0x2593;

  // ---------- "fast." : a heavy lowercase bitmap face, 12px tall, drawn in cells
  const GL = {
    f: ['..####', '.#####', '.##...', '.##...', '#####.', '#####.', '.##...', '.##...', '.##...', '.##...', '.##...', '.##...'],
    a: ['.......', '.......', '.......', '.......', '######.', '#######', '.....##', '.######', '#######', '##...##', '#######', '.######'],
    s: ['.......', '.......', '.......', '.......', '.######', '#######', '##.....', '######.', '.######', '.....##', '#######', '######.'],
    t: ['......', '.##...', '.##...', '.##...', '#####.', '#####.', '.##...', '.##...', '.##...', '.##...', '.#####', '..####'],
    '.': ['..', '..', '..', '..', '..', '..', '..', '..', '..', '..', '##', '##'],
  };
  const BW = 32, BH = 12, BM = new Uint8Array(BW * BH);
  { let x0 = 0; for (const k of 'fast.') { const g = GL[k], w = g[0].length; for (let y = 0; y < BH; y++) for (let x = 0; x < w; x++) if (g[y][x] === '#') BM[y * BW + x0 + x] = 1; x0 += w + 1; } }
  const bm = (x, y) => (x >= 0 && y >= 0 && x < BW && y < BH ? BM[y * BW + x] : 0);

  // ---------- metrics (measured once the font is in)
  let adv = 0.6, gA = 0.94, gD = 0.25;
  function measure() {
    xf.font = `400 100px ${FAM}`;
    const m = xf.measureText('M'); if (m.width > 30) adv = m.width / 100;
    const b = xf.measureText('█');
    if (b.actualBoundingBoxAscent > 10) { gA = b.actualBoundingBoxAscent / 100; gD = b.actualBoundingBoxDescent / 100; }
  }

  // ---------- layout state
  let dpr = 1, cw = 9, ch = 18, font = 15, lw = 1, C = 0, R = 0, ox = 0, oy = 0, N = 0, phone = false;
  let fN = '', fB = '', fBig = '', fSh = '', baseN = 0, baseBig = 0, baseSh = 0;
  const G = {};
  const M = 4; let SW = 0, SH = 0;
  let sReg, sD, sQ, sCh, sA, sB, sL, sK;
  let lT, lB, lY, lHs, lHalo;
  let chA, flA, fgA, bgA, glA, pCh, pFl, pFg, bgImg, glImg, bgU, glU;
  let lineEls = [];
  const WALL = 0, GLASS = 1, EDGE = 2, FRAME = 3, CONS = 4;

  function sdf(x, y) {
    const qx = Math.abs(x - G.cx) - (G.hw - G.rad), qy = Math.abs(y - G.cy) - (G.hh - G.rad);

  function layout() {

    baseN = Math.round((ch - (gA + gD) * font) / 2 + gA * font);
    baseBig = Math.round((2 * ch - (gA + gD) * 2 * font) / 2 + gA * 2 * font);

      cv.style.width = (C * cw) / dpr + 'px'; cv.style.height = (R * ch) / dpr + 'px';

  function placeDom() {
    root.toggleAttribute('data-phone', phone);

          else { sCh[i] = C_S2; sA[i] = HX('#4e4036'); sB[i] = HX('#17110d'); }
          if (!phone && ((onTB && f > 0.36 && f < 0.72 && (sc - G.gL) % 7 === 3) || (onLR && f > 0.44 && f < 0.66 && sr % 3 === 1))) { sCh[i] = 0x2022; sA[i] = HX('#e8d3bd'); sB[i] = HX('#2a2019'); }
          continue;
        }
        // wall / console
        if (sr >= G.consTop) {
          sReg[i] = CONS; sB[i] = conB; sA[i] = conA; sCh[i] = 32;
          if (sr === G.consTop) { sCh[i] = C_BOT; sA[i] = HX('#6d5a4a'); sB[i] = HX('#1d1611'); }
          else if (sr === G.consTop + 1) { sCh[i] = C_TOP; sA[i] = HX('#2c231c'); }

    // embers at rest, now and then
    if (t > 5.6) {
      const per = 6.5, e0 = Math.max(0, Math.floor((t - 5.6) / per) - 1);
      for (let e = e0; e <= e0 + 1; e++) {
        const t0 = 5.6 + e * per + hh(e, 1, 21) * 2.5, life = 3.2;
        const age = t - t0; if (age < 0 || age > life) continue;
        const x = G.gL + 3 + hh(e, 2, 21) * (gw - 6) + Math.sin(age * 2.2 + e) * 1.4;
        const y = G.gBot - 1 - age * (gh / life) * 0.7;
        const b = Math.sin((age / life) * Math.PI) * (0.65 + 0.35 * vn(t * 6, e));
        putScene(Math.round(x), Math.round(y), 0, 0, b > 0.55 ? 0x2a : 0xb7, mix(HX('#3a1a0a'), HX('#ffb04a'), b), mul(HX('#ff8a1e'), b * 0.5));
      }
    }
  }

  // ---------- the terminal layer: typed line, cursor, pane, status line (never shakes)
  function cell(c, r, code, fg, bg, flg) {
    if (c < 0 || r < 0 || c >= C || r >= R) return;
    const i = r * C + c; chA[i] = code; fgA[i] = fg; flA[i] = flg || 0; if (bg !== undefined && bg !== null) bgA[i] = bg;
  }
  function dimCell(c, r, k, to) {
    if (c < 0 || r < 0 || c >= C || r >= R) return;
    const i = r * C + c; fgA[i] = mix(fgA[i], to, k); bgA[i] = mix(bgA[i], to, k); glA[i] = mul(glA[i], 1 - k);
  }
  function text(c, r, s, fg, bg, flg) { for (let k = 0; k < s.length; k++) cell(c + k, r, s.charCodeAt(k), fg, bg, flg); }

  function ui(t) {
    const TXT = HX('#fff3e2'), CUR = HX('#f4ede2');
    // --- headline, line one: double-width, double-height (DECDHL), typed
    const typed = reduced ? L1.length : G.tType.filter((x) => x <= t).length;
    const alpha = reduced ? 0.24 : t < 4.6 ? 0.86 : 0.86 - 0.62 * sm(4.6, 6.5, t);
    let curC = -1, curR = -1;
    if (typed > 0 || t > 0.45) {
      for (const ln of G.l1) {
        const n = clamp(typed - ln.g0, 0, ln.txt.length);
        const showCur = typed >= ln.g0 && (typed < ln.g0 + ln.txt.length || ln === G.l1[G.l1.length - 1]);
        const w = n + (showCur && t < 3.9 ? 1 : 0);
        if (w <= 0) continue;
        for (let rr = 0; rr < 2; rr++) for (let cc = -1; cc <= w * 2; cc++) dimCell(ln.col + cc, ln.row + rr, alpha, BAR);
        for (let k = 0; k < n; k++) {
          const code = ln.txt.charCodeAt(k), cc = ln.col + k * 2;
          if (code === 32) { for (let q = 0; q < 4; q++) cell(cc + (q & 1), ln.row + (q >> 1), 32, TXT); continue; }
          for (let q = 0; q < 4; q++) cell(cc + (q & 1), ln.row + (q >> 1), code, TXT, null, 2 | ((q >> 1) ? 4 : 0) | ((q & 1) ? 8 : 0));
        }
        if (showCur && n < ln.txt.length + 1 && (typed < ln.g0 + ln.txt.length || ln === G.l1[G.l1.length - 1])) { curC = ln.col + n * 2; curR = ln.row; }
      }
    }
    // cursor: on while typing, blinking after; after the word is forged it waits behind "fast."
    if (!reduced && t < 3.9 && curC >= 0) {
      const on = t < G.tTyped + 0.05 || ((t - G.tTyped) % 1.06) < 0.53;
      if (on) for (let q = 0; q < 4; q++) cell(curC + (q & 1), curR + (q >> 1), C_FULL, CUR);
    } else if (t >= 4.0 || reduced) {
      const on = reduced || t < 4.6 || ((t - 4.6) % 1.2) < 0.6;
      if (on) {
        const s = G.s, c0 = G.lc + BW * s + Math.max(1, s), r0 = G.lr + 5 * s;
        for (let rr = 0; rr < s; rr++) for (let cc = 0; cc < s; cc++) cell(c0 + cc, r0 + rr, C_FULL, mix(CUR, HX('#ffb04a'), 0.5 * (1 - sm(4.6, 7, t))));
        if (s === 1) { const i = r0 * C + c0; if (i >= 0 && i < N) chA[i] = C_BOT; }
      }
    }

    // --- the pane: a rounded terminal box with a TUI drop shadow
    const pT = G.paneTop, pB = G.paneBot, pL = G.paneL, pR = G.paneL + G.paneW - 1;
    const prog = reduced ? 1 : sm(0.95, 1.35, t);
    if (prog > 0) {
      const FR = HX('#6a584a'), PB = HX('#110d0a');
      const perim = 2 * (pR - pL) + 2 * (pB - pT);
      const rowsBg = Math.ceil(prog * (pB - pT + 1));
      if (!phone) {
        for (let r = pT + 1; r <= pB + 1; r++) for (let c = pR + 1; c <= pR + 2; c++) dimCell(c, r, 0.62 * prog, 0x030202);
        for (let c = pL + 2; c <= pR; c++) dimCell(c, pB + 1, 0.62 * prog, 0x030202);
      }
      for (let r = pT; r <= pB; r++) for (let c = pL; c <= pR; c++) {
        let p;
        if (r === pT) p = (c - pL);
        else if (c === pR) p = (pR - pL) + (r - pT);
        else if (r === pB) p = (pR - pL) + (pB - pT) + (pR - c);
        else if (c === pL) p = 2 * (pR - pL) + (pB - pT) + (pB - r);
        else p = -1;
        if (p < 0) { if (r - pT < rowsBg) cell(c, r, 32, 0, PB); continue; }
        if (p / perim > prog) { if (r - pT < rowsBg) { const i = r * C + c; bgA[i] = PB; } continue; }
        let code = 0x2500;
        if (r === pT && c === pL) code = 0x256d; else if (r === pT && c === pR) code = 0x256e;
        else if (r === pB && c === pL) code = 0x2570; else if (r === pB && c === pR) code = 0x256f;
        else if (c === pL || c === pR) code = 0x2502;
        cell(c, r, code, FR, PB);
      }
      // small lamp row in the top border
      if (prog >= 1 && G.paneW > 20) {
        cell(pL + 2, pT, 32, 0, PB);
        cell(pL + 3, pT, 0x2022, HX('#d0893a'), PB); cell(pL + 4, pT, 32, 0, PB); cell(pL + 5, pT, 0x2022, HX('#5b6bff'), PB);
        cell(pL + 6, pT, 32, 0, PB);
      }
      for (let r = pT; r <= pB; r++) for (let c = pL; c <= pR; c++) { const i = r * C + c; if (i >= 0 && i < N) glA[i] = 0; }
    }

    // --- status line: readouts
    const sr = R - 2;
    const sp = reduced ? 1 : sm(0.75, 1.05, t);
    if (sp > 0) {
      const SB = HX('#18120e'), LAB = HX('#9c8a76'), VAL = HX('#f7efe4');
      const lim = Math.round(sp * C);
      const [v, a] = readouts(t);
      const vs = v.toFixed(3), as = a.toFixed(2).padStart(6, ' ');
      for (let c = 0; c < C; c++) { cell(c, sr, 32, 0, SB); glA[sr * C + c] = 0; }
      const bar = (c0, n, frac, col) => {
        const fill = clamp(frac, 0, 1) * n;
        for (let k = 0; k < n; k++) {
          const f = fill - k, TR = HX('#2d241d');
          if (f >= 1) cell(c0 + k, sr, C_FULL, col, TR);
          else if (f > 0.06) cell(c0 + k, sr, 0x2590 - Math.max(1, Math.round(f * 8)), col, TR);
          else cell(c0 + k, sr, 32, 0, TR);
        }
      };
      if (!phone) {
        const bw = clamp(Math.floor((C - 60) / 6), 8, 18);
        let c = 2;
        text(c, sr, 'Velocity', LAB, SB); text(c + 10, sr, vs, VAL, SB, 1); text(c + 15, sr, ' km/s', LAB, SB);
        bar(c + 22, bw, v / 7.8, HX('#5c6aff'));
        const w = 8 + 2 + 6 + 3 + 2 + bw; c = C - 2 - w;
        text(c, sr, 'Altitude', LAB, SB); text(c + 10, sr, as, VAL, SB, 1); text(c + 16, sr, ' km', LAB, SB);
        bar(c + 21, bw, a / 122, HX('#c9822f'));
      } else {
        const m = C >= 44 ? 2 : 1;
        text(m, sr, 'Velocity', LAB, SB); text(m + 9, sr, vs, VAL, SB, 1); text(m + 14, sr, ' km/s', LAB, SB);
        const c = C - 1 - m - 17;
        text(c, sr, 'Altitude', LAB, SB); text(c + 9, sr, as.trim().padStart(6, ' '), VAL, SB, 1); text(c + 15, sr, ' km', LAB, SB);
      }
      if (lim < C) for (let c = lim; c < C; c++) { const i = sr * C + c; chA[i] = 32; bgA[i] = mix(bgA[i], 0, 0); }
    }
  }

  // ---------- drawing
  function block(code, px, py) {
    if (code === C_FULL) { xf.fillRect(px, py, cw, ch); return; }
    if (code === C_TOP) { xf.fillRect(px, py, cw, Math.round(ch / 2)); return; }
    if (code > 0x2580 && code < 0x2588) { const h = Math.round((ch * (code - 0x2580)) / 8); xf.fillRect(px, py + ch - h, cw, h); return; }
    if (code >= 0x2589 && code <= 0x258f) { xf.fillRect(px, py, Math.max(1, Math.round((cw * (0x2590 - code)) / 8)), ch); return; }
    if (code === 0x2590) { const w = Math.round(cw / 2); xf.fillRect(px + cw - w, py, w, ch); return; }
    if (code === 0x2594) { xf.fillRect(px, py, cw, Math.max(1, Math.round(ch / 8))); return; }
    if (code === 0x2595) { const w = Math.max(1, Math.round(cw / 8)); xf.fillRect(px + cw - w, py, w, ch); return; }
    const m = QM[code];
    if (m !== undefined) {
      const hw = Math.round(cw / 2), hhh = Math.round(ch / 2);
      if (m & 1) xf.fillRect(px, py, hw, hhh);
      if (m & 2) xf.fillRect(px + hw, py, cw - hw, hhh);
      if (m & 4) xf.fillRect(px, py + hhh, hw, ch - hhh);
      if (m & 8) xf.fillRect(px + hw, py + hhh, cw - hw, ch - hhh);
    }
  }
  function box(code, px, py) {
    const b = BOX[code];
    if (b) {
      const th = b[0] === 2 || b[1] === 2 ? lw * 2 : lw, tv = b[2] === 2 || b[3] === 2 ? lw * 2 : lw;
      const vx = px + ((cw - tv) >> 1), hy = py + ((ch - th) >> 1);
      if (b[0]) xf.fillRect(px, hy, vx + tv - px, th);
      if (b[1]) xf.fillRect(vx, hy, px + cw - vx, th);
      if (b[2]) xf.fillRect(vx, py, tv, hy + th - py);
      if (b[3]) xf.fillRect(vx, hy, tv, py + ch - hy);
      return true;
    }
    const a = ARC[code];
    if (a === undefined) return false;
    const t = lw, vx = px + ((cw - t) >> 1), hy = py + ((ch - t) >> 1), lx = vx + t / 2, ly = hy + t / 2, r = Math.max(2, Math.floor(cw / 2) - 0.5);
    xf.strokeStyle = xf.fillStyle; xf.lineWidth = t; xf.beginPath();
    if (a === 0) { xf.arc(lx + r, ly + r, r, Math.PI, 1.5 * Math.PI); xf.fillRect(lx + r, hy, px + cw - lx - r, t); xf.fillRect(vx, ly + r, t, py + ch - ly - r); }
    else if (a === 1) { xf.arc(lx - r, ly + r, r, 1.5 * Math.PI, 2 * Math.PI); xf.fillRect(px, hy, lx - r - px, t); xf.fillRect(vx, ly + r, t, py + ch - ly - r); }
    else if (a === 2) { xf.arc(lx - r, ly - r, r, 0, 0.5 * Math.PI); xf.fillRect(px, hy, lx - r - px, t); xf.fillRect(vx, py, t, ly - r - py); }
    else { xf.arc(lx + r, ly - r, r, 0.5 * Math.PI, Math.PI); xf.fillRect(lx + r, hy, px + cw - lx - r, t); xf.fillRect(vx, py, t, ly - r - py); }
    xf.stroke();
    return true;
  }
  function drawRow(r) {
    const o = r * C, y = r * ch, Wd = C * cw;
    xf.save(); xf.beginPath(); xf.rect(0, y, Wd, ch); xf.clip();
    xf.clearRect(0, y, Wd, ch);
    let col = -1, fnt = '';
    for (let c = 0; c < C; c++) {
      const i = o + c, code = chA[i], fl = flA[i], fg = fgA[i];
      pCh[i] = code; pFl[i] = fl; pFg[i] = fg;
      if (code === 32 || code === 0) continue;
      if (fg !== col) { col = fg; xf.fillStyle = hex(fg); }
      const px = c * cw;
      if (fl & 2) {
        if (fl & 8) continue;
        if (fnt !== fBig) { fnt = fBig; xf.font = fBig; }
        xf.fillText(str(code), px, y - (fl & 4 ? ch : 0) + baseBig);
        continue;
      }
      if (code >= 0x2580 && code <= 0x259f && code !== C_S1 && code !== C_S2 && code !== C_S3) { block(code, px, y); continue; }
      if (code >= 0x2500 && code <= 0x257f && box(code, px, y)) continue;
      if (code >= C_S1 && code <= C_S3) { if (fnt !== fSh) { fnt = fSh; xf.font = fSh; } xf.fillText(str(code), px, y + baseSh); continue; }
      const f = fl & 1 ? fB : fN; if (fnt !== f) { fnt = f; xf.font = f; }
      xf.fillText(str(code), px, y + baseN);
    }
    xf.restore();
  }
  function flush() {
    for (let r = 0; r < R; r++) {
      const o = r * C; let d = false;
      for (let c = 0; c < C; c++) { const i = o + c; if (chA[i] !== pCh[i] || fgA[i] !== pFg[i] || flA[i] !== pFl[i]) { d = true; break; } }
      if (d) drawRow(r);
    }
    let nb = false, ng = false;
    for (let i = 0; i < N; i++) {
      const v = bgA[i], p = (0xff000000 | ((v & 255) << 16) | (v & 0xff00) | ((v >>> 16) & 255)) >>> 0;
      if (bgU[i] !== p) { bgU[i] = p; nb = true; }
      const g = glA[i], pg = (0xff000000 | ((g & 255) << 16) | (g & 0xff00) | ((g >>> 16) & 255)) >>> 0;
      if (glU[i] !== pg) { glU[i] = pg; ng = true; }
    }
    if (nb) xb.putImageData(bgImg, 0, 0);
    if (ng) xg.putImageData(glImg, 0, 0);
  }

  // ---------- the real text follows the same clock
  let domState = '';
  function dom(t) {
    const L = lineEls.length, t0 = 1.3;
    let shown = reduced ? L : 0;
    if (!reduced) for (let k = 0; k < L; k++) if (t >= t0 + k * 0.07) shown = k + 1;
    const btn = reduced || t >= t0 + L * 0.07 + 0.12;
    const st = shown + (btn ? 'b' : '');
    if (st === domState) return;
    domState = st;
    lineEls.forEach((e, k) => e.toggleAttribute('data-off', k >= shown));
    cta.toggleAttribute('data-off', !btn);
  }

  // ---------- one clock
  let T = 0, base = performance.now(), raf = 0, onScreen = true, lastKey = -1, ready = false;
  const fpsAt = (t) => (t < 10.5 ? 30 : 8);
  function frame(now) {
    raf = 0;
    if (!running()) return;
    T = (now - base) / 1000;
    const fps = fpsAt(T), key = Math.floor(T * fps) + (fps === 8 ? 1e7 : 0);
    if (key !== lastKey) { lastKey = key; render(Math.floor(T * fps) / fps); }
    raf = requestAnimationFrame(frame);
  }
  const running = () => ready && !reduced && onScreen && document.visibilityState !== 'hidden';
  function sync() {
    if (running()) { if (!raf) { base = performance.now() - T * 1000; raf = requestAnimationFrame(frame); } }
    else if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function rebuild() {
    if (!layout()) return;
    ready = true; lastKey = -1;
    render(reduced ? 14 : T);
    sync();
  }
  root.addEventListener('h-seek', (e) => {
    T = Math.max(0, +e.detail || 0); base = performance.now() - T * 1000; lastKey = -1;
    if (ready) render(reduced ? 14 : T);
  });
  measure();
  rebuild();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load(`400 20px "JetBrains Mono"`), document.fonts.load(`700 20px "JetBrains Mono"`)])
      .then(() => { const a0 = adv, g0 = gA; measure(); if (a0 !== adv || g0 !== gA) rebuild(); else if (ready) { pCh.fill(0xffffffff); render(reduced ? 14 : T); } })
      .catch(() => {});
  }
  if ('IntersectionObserver' in window) new IntersectionObserver((es) => { onScreen = es[es.length - 1].isIntersecting; sync(); }).observe(root);
  document.addEventListener('visibilitychange', sync);
  if ('ResizeObserver' in window) {
    let rw = root.clientWidth, rh = root.clientHeight, pend = 0;
    new ResizeObserver(() => {
      if (pend) return;
      pend = requestAnimationFrame(() => { pend = 0; if (root.clientWidth !== rw || root.clientHeight !== rh) { rw = root.clientWidth; rh = root.clientHeight; rebuild(); } });
    }).observe(root);
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { reduced = mq.matches; rebuild(); });
})();
</script>
