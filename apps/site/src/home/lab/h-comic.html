<style>
.h-comic {
  --ink: #120d0a;
  --paper: #fff8ea;
  --capbg: #ffe892;
  --cobalt: #2b3bff;
  --warm: #c9822f;
  --wl: 21cqw; --wr: 21cqw; --wt: 12cqh; --wh: 54cqh;
  --fs: min(14cqw, 23.5cqh);
  --fy: .5;
  --rx: 0px; --ry: 0px;
  --b-out: #ffe14a; --b-in: #ff4a1c; --b-dot: #c71f0a;
  --f-hi: #fffbe6; --f-mid: #ffd23a; --f-dot: #ff6a1f;
  position: absolute; inset: 0; overflow: hidden;
  background: #0e0b09; color: var(--ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  isolation: isolate;
}
.h-comic *, .h-comic *::before, .h-comic *::after { box-sizing: border-box; }
.h-comic__art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.h-comic__win { position: absolute; left: var(--wl); right: var(--wr); top: var(--wt); height: var(--wh); visibility: hidden; pointer-events: none; }

/* headline */
.h-comic__h1 { position: absolute; inset: 0; margin: 0; font-size: 16px; font-weight: 800; line-height: 1; pointer-events: none; z-index: 2; }
.h-comic__cap {
  position: absolute; z-index: 3;
  left: calc(var(--wl) + 2.4cqw); top: calc(var(--wt) + 3.6cqh);
  max-width: min(24em, calc(100cqw - var(--wl) - var(--wr) - 6cqw));
  padding: .5em .8em .46em;
  background: var(--capbg) radial-gradient(circle, rgba(201,130,47,.26) 0 .8px, transparent 1.1px) 0 0 / 5px 5px;
  border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
  font-size: clamp(17px, 1.6cqw, 27px); font-weight: 800; line-height: 1.14; letter-spacing: .015em;
  text-transform: uppercase; color: var(--ink);
  transform-origin: 0 0; rotate: -1.4deg;
}
.h-comic__fast { position: absolute; z-index: 1; left: 50%; top: calc(var(--wt) + var(--wh) * var(--fy)); width: 0; height: 0; font-size: var(--fs); line-height: 1; }
.h-comic__fx { position: absolute; left: 0; top: 0; translate: -50% -50%; rotate: -5deg; transform: skewX(-9deg); }
.h-comic__burst { position: absolute; left: 50%; top: 50%; width: 4.1em; height: 2.24em; translate: -50% -50%; transform: skewX(9deg); }
.h-comic__burst svg { display: block; width: 100%; height: 100%; overflow: visible; }
.h-comic__bsh { fill: var(--ink); }
.h-comic__bo { fill: var(--b-out); stroke: var(--ink); stroke-width: max(3px, calc(var(--fs) * .03)); vector-effect: non-scaling-stroke; stroke-linejoin: miter; stroke-miterlimit: 12; }
.h-comic__bi { fill: var(--b-in); stroke: var(--ink); stroke-width: max(2px, calc(var(--fs) * .018)); vector-effect: non-scaling-stroke; stroke-linejoin: miter; stroke-miterlimit: 12; }
.h-comic__bdot { fill: var(--b-dot); }
.h-comic__w { display: block; position: relative; white-space: nowrap; text-transform: uppercase; letter-spacing: -.02em; font-weight: 800; padding: 0 .08em; }
.h-comic__w--a { position: absolute; left: 0; top: 0; -webkit-user-select: none; user-select: none; }
.h-comic__w--c { color: #12c4ff; -webkit-text-stroke: .11em #12c4ff; translate: var(--rx) var(--ry); }
.h-comic__w--m { color: #ff2f86; -webkit-text-stroke: .11em #ff2f86; translate: calc(var(--rx) * -1) calc(var(--ry) * -1); }
.h-comic__w--s { color: var(--ink); -webkit-text-stroke: .11em var(--ink); translate: .055em .065em; }
.h-comic__w--k { color: var(--ink); -webkit-text-stroke: .11em var(--ink); }
.h-comic__w--f {
  color: transparent;
  background: linear-gradient(180deg, var(--f-hi) 0 49%, transparent 49%), radial-gradient(circle, var(--f-dot) 0 33%, transparent 36%) 0 0 / .056em .056em, var(--f-mid);
  -webkit-background-clip: text; background-clip: text;
}

/* sound effect */
.h-comic__sfx { position: absolute; z-index: 1; left: calc(var(--wl) + 5cqw); top: calc(var(--wt) + var(--wh) * .6); font-size: clamp(30px, 5.4cqw, 92px); font-weight: 800; line-height: 1; white-space: nowrap; text-transform: uppercase; pointer-events: none; transform-origin: 0 100%; rotate: -17deg; }
.h-comic__sfx span { display: inline-block; color: #ffe14a; -webkit-text-stroke: .1em var(--ink); paint-order: stroke fill; text-shadow: .07em .08em 0 var(--ink); letter-spacing: -.02em; transform: skewX(-14deg); }
.h-comic__sfx span:nth-child(1) { font-size: .64em; }
.h-comic__sfx span:nth-child(2) { font-size: .74em; }
.h-comic__sfx span:nth-child(3) { font-size: .84em; }
.h-comic__sfx span:nth-child(4) { font-size: .95em; }
.h-comic__sfx span:nth-child(5) { font-size: 1.07em; }
.h-comic__sfx span:nth-child(6) { font-size: 1.2em; }

/* lower block */
.h-comic__low { position: absolute; z-index: 4; left: 4cqw; right: 3.6cqw; bottom: 6.5cqh; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; pointer-events: none; }
.h-comic__main { width: clamp(330px, 31cqw, 450px); display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }
.h-comic__sub {
  margin: 0; padding: 14px 18px 15px; pointer-events: auto;
  background: var(--paper) radial-gradient(circle, rgba(18,13,10,.07) 0 .8px, transparent 1.1px) 0 0 / 5px 5px;
  border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--warm);
  font-size: 17px; line-height: 1.45; font-weight: 600; color: var(--ink); letter-spacing: -.003em;
  rotate: .5deg;
}
.h-comic__ctas { display: flex; gap: 16px; pointer-events: auto; }
.h-comic__btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 56px; padding: 0 22px 0 18px;
  border: 3px solid var(--ink); border-radius: 9px;
  font-size: 17px; font-weight: 800; letter-spacing: .035em; text-transform: uppercase; line-height: 1;
  text-decoration: none; white-space: nowrap;
  box-shadow: 5px 5px 0 var(--warm);
  transition: transform .1s steps(2, end), box-shadow .1s steps(2, end);
}
.h-comic__btn svg { width: 22px; height: 22px; flex: none; overflow: visible; }
.h-comic__btn--dl {
  color: #fff; text-shadow: 2px 2px 0 var(--ink);
  background: linear-gradient(180deg, #3d4cff 0 50%, transparent 50%), radial-gradient(circle, #1a25c8 0 31%, transparent 34%) 0 0 / 6px 6px, #2b3bff;
  rotate: -1deg;
}
.h-comic__btn--gh { color: var(--ink); background: var(--paper); rotate: .8deg; }
.h-comic__btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--warm); }
.h-comic__btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--warm); transition-duration: .04s; }
.h-comic__btn:focus-visible { outline: 3px solid #ffe14a; outline-offset: 4px; }
.h-comic__btn--dl:active { background: linear-gradient(180deg, #5562ff 0 50%, transparent 50%), radial-gradient(circle, #2b3bff 0 31%, transparent 34%) 0 0 / 6px 6px, #3d4cff; }

/* readouts */
.h-comic__ro { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; margin: 0; pointer-events: auto; font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; rotate: -1deg; }
.h-comic__chip { display: flex; align-items: stretch; border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--warm); background: var(--paper); }
.h-comic__chip dt { display: flex; align-items: center; min-width: 92px; padding: 6px 9px 5px; background: var(--ink); color: var(--capbg); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.h-comic__chip dd { margin: 0; padding: 5px 10px 4px; font-size: 17px; font-weight: 700; color: var(--ink); white-space: nowrap; display: flex; align-items: baseline; }
.h-comic__chip b { display: inline-block; min-width: 6ch; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.h-comic__chip i { font-style: normal; font-size: 12px; font-weight: 600; margin-left: .4em; min-width: 4ch; }

@container (max-aspect-ratio: 1/1) {
  .h-comic { --wl: 4.5cqw; --wr: 4.5cqw; --wt: max(84px, 10.4cqh); --wh: 44cqh; --fs: 22cqw; --fy: .56; }
  .h-comic__cap { left: calc(var(--wl) + 14px); top: calc(var(--wt) + 14px); font-size: clamp(15px, 4.5cqw, 24px); max-width: calc(100cqw - var(--wl) - var(--wr) - 44px); }
  .h-comic__sfx { left: calc(var(--wl) + 6cqw); top: calc(var(--wt) + var(--wh) * .64); font-size: 10cqw; }
  .h-comic__low { left: 16px; right: max(16px, calc(100cqw - 16px - 560px)); bottom: max(16px, 2.4cqh); flex-direction: column; align-items: stretch; gap: 14px; }
  .h-comic__main { width: auto; align-items: stretch; gap: 16px; }
  .h-comic__sub { font-size: 15px; line-height: 1.42; padding: 11px 14px 12px; }
  .h-comic__ctas { gap: 12px; }
  .h-comic__btn { flex: 1 1 auto; height: 48px; padding: 0 12px; gap: 8px; font-size: 15px; letter-spacing: .03em; }
  .h-comic__btn svg { width: 19px; height: 19px; }
  .h-comic__ro { order: -1; flex-direction: row; align-items: stretch; gap: 10px; rotate: 0deg; }
  .h-comic__chip { flex: 1 1 0; min-width: 0; }
  .h-comic__chip dt { min-width: 0; padding: 5px 7px 4px; font-size: 9.5px; letter-spacing: .1em; }
  .h-comic__chip dd { padding: 4px 7px 3px; font-size: 14px; flex: 1; justify-content: flex-end; }
  .h-comic__chip i { font-size: 10.5px; min-width: 3.4ch; }
}
@container (max-aspect-ratio: 1/1) and (max-height: 720px) {
  .h-comic__ro { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .h-comic__btn { transition: none; }
}
</style>
<div class="h-comic">
  <canvas class="h-comic__art" aria-hidden="true"></canvas>
  <div class="h-comic__win" aria-hidden="true"></div>
  <div class="h-comic__sfx" aria-hidden="true"><span>F</span><span>W</span><span>O</span><span>O</span><span>S</span><span>H</span></div>
  <h1 class="h-comic__h1">
    <span class="h-comic__cap">Building software has never felt so</span>
    <span class="h-comic__fast"><span class="h-comic__fx"><span class="h-comic__burst" aria-hidden="true"></span><span class="h-comic__w h-comic__w--a h-comic__w--c" aria-hidden="true">fast.</span><span class="h-comic__w h-comic__w--a h-comic__w--m" aria-hidden="true">fast.</span><span class="h-comic__w h-comic__w--a h-comic__w--s" aria-hidden="true">fast.</span><span class="h-comic__w h-comic__w--a h-comic__w--k" aria-hidden="true">fast.</span><span class="h-comic__w h-comic__w--f">fast.</span></span></span>
  </h1>
  <div class="h-comic__low">
    <div class="h-comic__main">
      <p class="h-comic__sub">Althar is an open-source IDE for building with AI agents. It runs the ones you already pay for, and keeps going whatever the labs change.</p>
      <div class="h-comic__ctas">
        <a class="h-comic__btn h-comic__btn--dl" href="https://github.com/AltharIDE/althar/releases"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5v10.5M7 9.5l5 5 5-5M4.5 19.5h15" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Download</span></a>
        <a class="h-comic__btn h-comic__btn--gh" href="https://github.com/AltharIDE/althar"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.6l2.8 5.7 6.3.9-4.55 4.43 1.07 6.27L12 16.95l-5.62 2.95 1.07-6.27L2.9 9.2l6.3-.9z" fill="#ffd23a" stroke="#120d0a" stroke-width="2.3" stroke-linejoin="round"/></svg><span>Star on GitHub</span></a>
      </div>
    </div>
    <dl class="h-comic__ro">
      <div class="h-comic__chip"><dt>Velocity</dt><dd><b data-v>7.800</b><i>km/s</i></dd></div>
      <div class="h-comic__chip"><dt>Altitude</dt><dd><b data-a>122.00</b><i>km</i></dd></div>
    </dl>
  </div>
</div>
<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  if (!root) return;
  const $ = (s) => root.querySelector(s);
  const cv = $('.h-comic__art');
  const ctx = cv.getContext('2d');
  const winEl = $('.h-comic__win');
  const capEl = $('.h-comic__cap');
  const fastEl = $('.h-comic__fast');
  const fxEl = $('.h-comic__fx');
  const burstEl = $('.h-comic__burst');
  const sfxEl = $('.h-comic__sfx');
  const sfxL = [...sfxEl.children];
  const subEl = $('.h-comic__sub');
  const btns = [...root.querySelectorAll('.h-comic__btn')];
  const roEl = $('.h-comic__ro');
  const vEl = $('[data-v]');
  const aEl = $('[data-a]');
  const RM = matchMedia('(prefers-reduced-motion: reduce)');
  const SUF = Math.random().toString(36).slice(2, 8);

  const INK = '#120d0a';
  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const h1 = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); };
  const rgbOf = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mixc = (a, b, t) => { const A = rgbOf(a), B = rgbOf(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t))).toString(16).padStart(2, '0')).join(''); };
  const eoc = (t) => 1 - Math.pow(1 - clamp(t), 3);

  /* ---------- burst svg ---------- */
  burstEl.innerHTML = `<svg viewBox="-205 -112 410 224" preserveAspectRatio="none" aria-hidden="true" focusable="false"><defs><pattern id="hcd-${SUF}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle class="h-comic__bdot" cx="4" cy="4" r="2.1"/></pattern><clipPath id="hcc-${SUF}"><rect x="-260" y="4" width="520" height="160" transform="rotate(-9)"/></clipPath></defs><polygon class="h-comic__bsh"/><polygon class="h-comic__bo"/><polygon class="h-comic__bi"/><polygon class="h-comic__bid" fill="url(#hcd-${SUF})" clip-path="url(#hcc-${SUF})"/></svg>`;
  const bSh = burstEl.querySelector('.h-comic__bsh');
  const bO = burstEl.querySelector('.h-comic__bo');
  const bI = burstEl.querySelector('.h-comic__bi');
  const bD = burstEl.querySelector('.h-comic__bid');
  function burstPts(seed, n, rx, ry, inner, jit, ox = 0, oy = 0) {
    let s = '';
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * TAU + (h1(seed + i * 1.7) - 0.5) * 0.16 - Math.PI / 2;
      const r = i % 2 === 0 ? 1 - h1(seed + i * 3.1) * 0.2 - jit * h1(seed * 3 + i) : inner + h1(seed + i * 5.3) * 0.07;
      s += (Math.cos(a) * rx * r + ox).toFixed(1) + ',' + (Math.sin(a) * ry * r + oy).toFixed(1) + ' ';
    }
    return s;
  }
  let burstSeed = -1;
  function setBurst(seed, jit) {
    if (seed === burstSeed) return;
    burstSeed = seed;
    const o = burstPts(11 + seed * 0.37, 17, 198, 106, 0.69, jit);
    bO.setAttribute('points', o);
    bSh.setAttribute('points', burstPts(11 + seed * 0.37, 17, 198, 106, 0.69, jit, 9, 11));
    const i = burstPts(53 + seed * 0.41, 14, 150, 74, 0.8, jit * 0.6);
    bI.setAttribute('points', i);
    bD.setAttribute('points', i);
  }
  setBurst(0, 0);

  /* ---------- layout ---------- */
  let W = 0, H = 0, dpr = 1, U = 1, SU = 1, LW = 4, M = 34, SP = 40;
  let WX = 0, WY = 0, WW = 1, WH = 1, K = 0, RAD = 0, BZ = 0, winP, bezO, bezI, CX = [0, 0], CY = 0, CR = 0, portrait = false, FY = 0;
  let cabF, cabI, skyC, glowC, spW, spC;
  let pats = new Map();
  const flow = { dx: Math.sin(0.4), dy: -Math.cos(0.4) };
  flow.nx = -flow.dy; flow.ny = flow.dx;

  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr)); return c; };
  const cctx = (cnv, ox, oy) => { const c = cnv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, ox * dpr, oy * dpr); c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = INK; return c; };

  function rpoly(pts, r) {
    const p = new Path2D(), n = pts.length;
    p.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; p.arcTo(a[0], a[1], b[0], b[1], r); }
    p.closePath();
    return p;
  }
  const trap = (g) => [[WX + K - g, WY - g], [WX + WW - K + g, WY - g], [WX + WW + g, WY + WH + g], [WX - g, WY + WH + g]];
  const poly = (pts) => { const p = new Path2D(); pts.forEach((q, i) => (i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1]))); p.closePath(); return p; };

  function dots(col, sp, rf) {
    const key = col + '|' + sp + '|' + rf;
    let p = pats.get(key);
    if (p) return p;
    const s = Math.max(3, Math.round(sp * dpr));
    const t = document.createElement('canvas'); t.width = t.height = s;
    const c = t.getContext('2d'); c.fillStyle = col;
    const r = rf * s;
    c.beginPath();
    for (const [x, y] of [[0, 0], [s, 0], [0, s], [s, s], [s / 2, s / 2]]) { c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); }
    c.fill();
    p = ctx.createPattern(t, 'repeat');
    p.setTransform(new DOMMatrix([1 / dpr, 0, 0, 1 / dpr, 0, 0]));
    pats.set(key, p);
    return p;
  }
  function field(c, x0, y0, w, h, sp, rfn) {
    c.beginPath();
    let j = 0;
    for (let y = y0; y <= y0 + h + sp; y += sp / 2, j++) {
      const o = (j & 1) * sp / 2;
      for (let x = x0 - o; x <= x0 + w + sp; x += sp) {
        const r = rfn(x, y);
        if (r > 0.3) { c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); }
      }
    }
    c.fill();
  }
  // fill region (minus a hole) with a halftone of dot radius rf (0..0.5 of the screen pitch)
  function dotFill(c, region, hole, col, sp, rf) {
    rf = Math.round(rf * 40) / 40;
    if (rf <= 0.02) return;
    c.save();
    if (hole) { const P = new Path2D(); P.addPath(region); P.addPath(hole); c.clip(P, 'evenodd'); } else c.clip(region);
    c.fillStyle = rf >= 0.49 ? col : dots(col, sp, rf);
    c.fillRect(0, 0, W, H);
    c.restore();
  }
  const rectDist = (x, y, cx, cy, hx, hy) => Math.hypot(Math.max(0, Math.abs(x - cx) - hx), Math.max(0, Math.abs(y - cy) - hy));

  function layout() {
    const r = root.getBoundingClientRect();
    W = r.width; H = r.height;
    if (W < 2 || H < 2) return false;
    const wr = winEl.getBoundingClientRect();
    WX = wr.left - r.left; WY = wr.top - r.top; WW = wr.width; WH = wr.height;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    portrait = W / H < 1;
    U = Math.min(W, H) / 900;
    SU = clamp(Math.min(W, H) / 900, 0.5, 1.25);
    LW = clamp(Math.min(W, H) * 0.0058, 2.6, 6);
    K = WW * 0.035; RAD = Math.min(WW, WH) * 0.15; BZ = Math.max(13, Math.min(WW, WH) * 0.06);
    winP = rpoly(trap(0), RAD);
    bezO = rpoly(trap(BZ), RAD + BZ);
    bezI = rpoly(trap(BZ * 0.42), RAD + BZ * 0.42);
    CR = portrait ? Math.min(WH * 0.15, WW * 0.12) : Math.min(WH * 0.155, WW * 0.1);
    CY = WY + WH + CR * (portrait ? 0.2 : 0.05);
    CX = portrait ? [WX + WW * 0.29, WX + WW * 0.69] : [WX + WW * 0.37, WX + WW * 0.64];
    FY = WY + WH * (portrait ? 0.56 : 0.5);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    pats = new Map();
    buildCabin(); buildSky(); buildGlow(); buildSpill(); buildTop(); buildFireBg();
    restC = null;
    return true;
  }

  /* ---------- static caches ---------- */
  function buildCabin() {
    cabF = mk(W + 2 * M, H + 2 * M); cabI = mk(W + 2 * M, H + 2 * M);
    const f = cctx(cabF, M, M), k = cctx(cabI, M, M);
    const S = [[-M, -M], [W + M, -M], [W + M, H + M], [-M, H + M]];
    const B = trap(BZ);

      const len = 2 * ed * (0.2 + 0.42 * f) * sz;
      const wid = 2 * en * (0.032 + 0.036 * f) * sz;
      const p = (h1(s * 2.1) + ph * (0.75 + 0.5 * h1(s * 3.7))) % 1;
      const along = lerp(-ed - len, ed + len * 0.05, p);
      const gk = clamp((front - along) / (ed * 0.4));
      if (gk <= 0.03) continue;
      const lane = lerp(-en * 1.1, en * 1.1, (i + h1(s * 5.3)) / nU);
      const bx = cx + nx * lane + dx * along, by = cy + ny * lane + dy * along;
      const wph = h1(s * 7.7) * TAU + fr * 0.75 * (h1(s * 1.9) > 0.5 ? 1 : -1);
      const lick = h1(s * 8.3) < 0.55 ? (h1(s * 4.4) > 0.5 ? 1 : -1) : 0;
      const L = len * gk, Wd = wid * Math.sqrt(gk);
      tongue(Pr, bx, by, L, Wd, wph, lick, Wd);
      tongue(Ps, bx + nx * Wd * 0.4, by + ny * Wd * 0.4, L * 0.94, Wd * 0.6, wph, 0, Wd);
      tongue(Po, bx + dx * L * 0.05, by + dy * L * 0.05, L * 0.8, Wd * 0.62, wph, lick, Wd);
      tongue(Py, bx + dx * L * 0.1, by + dy * L * 0.1, L * 0.56, Wd * 0.34, wph, 0, Wd);
      if (f > 0.4) tongue(Pw, bx + dx * L * 0.14, by + dy * L * 0.14, L * 0.36 * f, Wd * 0.15, wph, 0, Wd);
    }
    c.fillStyle = '#d6311d'; c.fill(Pr);
    c.fillStyle = dots('#8e1508', sp * 0.85, 0.36); c.fill(Ps);
    c.fillStyle = '#ff7b1c'; c.fill(Po);
    c.fillStyle = '#ffcb3c'; c.fill(Py);
    c.fillStyle = '#fff5d4'; c.fill(Pw);
    inkStroke(c, Pr, LW * 0.6);
    // plasma streaks
    const ns = Math.floor(52 * Math.pow(f, 1.2));
    if (ns) {
      c.beginPath();
      for (let i = 0; i < ns; i++) {
        const s = fr * 31 + i * 3.7;
        const lane = lerp(-en, en, h1(s * 1.1)), along = lerp(-ed, ed, h1(s * 2.3));
        if (along > front) continue;
        const len = 2 * ed * (0.06 + 0.34 * f * h1(s * 3.1));
        const x = cx + nx * lane + dx * along, y = cy + ny * lane + dy * along;
        c.moveTo(x, y); c.lineTo(x + dx * len, y + dy * len);
      }
      c.strokeStyle = '#fff1c2'; c.lineWidth = Math.max(1.3, 2.4 * U); c.lineCap = 'round'; c.stroke();
    }
    // sparks
    const nk = Math.floor(26 * f);
    if (nk) {
      const P = new Path2D();
      for (let i = 0; i < nk; i++) {
        const s = 500 + i;
        const p = (h1(s) + ph * (1.5 + h1(s * 2))) % 1;
        const along = lerp(-ed, ed, p), lane = lerp(-en, en, h1(s * 3));
        if (along > front) continue;
        star(P, cx + nx * lane + dx * along, cy + ny * lane + dy * along, (4 + 7 * h1(s * 4)) * Math.max(0.65, U));
      }
      c.fillStyle = '#fffbe8'; c.fill(P);
      inkStroke(c, P, Math.max(1, LW * 0.3));
    }
  }

  const PUFFS = [[-1.35, 0.18, 0.55], [-0.7, -0.12, 0.8], [0.1, -0.32, 1.0], [0.95, -0.08, 0.78], [1.6, 0.2, 0.52], [0.35, 0.28, 0.72], [-0.45, 0.3, 0.62]];

  function drawSky(c, T) {
    c.drawImage(skyC, WX - SP, WY - SP, WW + 2 * SP, WH + 2 * SP);
    const { hy, Re, ecx, ecy } = EH;
    // high streak clouds
    const P = new Path2D();
    for (let i = 0; i < 3; i++) {
      const span = WW * 1.6;
      const x = WX - WW * 0.3 + ((h1(i * 4.1) * span + T * (5 + i * 2) * Math.max(0.6, U)) % span);
      const y = hy - WH * (0.09 + i * 0.07);
      const l = WW * (0.22 + 0.1 * h1(i * 2.2)), t = WH * (0.012 + 0.006 * i);
      P.moveTo(x - l / 2, y);
      P.quadraticCurveTo(x - l * 0.1, y - t * 2.4, x + l / 2, y - t * 0.4);
      P.quadraticCurveTo(x + l * 0.05, y + t * 1.2, x - l / 2, y);
      P.closePath();
    }
    c.fillStyle = '#ffffff'; c.fill(P);
    inkStroke(c, P, Math.max(1.2, LW * 0.4));
    // cloud deck drifting along the curve
    for (const row of cloudRows) {
      const { z, sz, sprites } = row;
      const gap = sz * lerp(3.6, 2.7, z);
      const dyo = WH * lerp(0.035, 0.3, Math.pow(z, 1.25));
      const spd = lerp(2.5, 11, z) * Math.max(0.6, U);
      const span = WW + gap * 5;
      const cnt = Math.ceil(span / gap);
      for (let j = 0; j < cnt; j++) {
        const s = z * 150 + j;
        const x0 = WX - gap * 2.5 + ((j * gap + h1(s) * gap * 0.6 + T * spd) % span);
        const y0 = ecy - Math.sqrt(Math.max(0, Re * Re - (x0 - ecx) * (x0 - ecx))) + dyo + (h1(s * 2) - 0.5) * sz * 0.7;
        const sp = sprites[j % sprites.length];
        c.drawImage(sp.cnv, x0 - sp.ox, y0 - sp.oy, sp.w, sp.h);
      }
    }
  }

  function drawOutside(c, T, fr) {
    c.save();
    c.translate(REG.x, REG.y);
    c.clip(winP);
    const brk = T >= 4.5;
    if (brk) drawSky(c, T);
    if (T < 5.0) {
      const b = brk ? ss(4.52, 5.0, T) : 0;
      c.save();
      let edge = null;
      if (brk) {
        const base = WY + WH * 1.1 - b * WH * 1.5;
        edge = [];
        const n = 16;
        for (let k = 0; k <= n; k++) {
          const x = WX - 60 + ((WW + 120) * k) / n;
          edge.push([x, base + (k % 2 ? 1 : -1) * WH * 0.05 * (0.5 + h1(k * 7 + fr)) - (x - WX) * 0.14]);
        }
        const P = new Path2D();
        P.moveTo(WX - 80, WY - 400);
        P.lineTo(WX + WW + 80, WY - 400);
        for (let k = edge.length - 1; k >= 0; k--) P.lineTo(edge[k][0], edge[k][1]);
        P.closePath();
        c.clip(P);
      }
      drawFire(c, T, fr, brk ? (T - 4.5) * 4 : 0);
      c.restore();
      if (edge) {
        const P = new Path2D();
        edge.forEach((q, i) => (i ? P.lineTo(q[0], q[1]) : P.moveTo(q[0], q[1])));
        c.lineJoin = 'miter';
        c.lineWidth = LW * 3.2; c.strokeStyle = '#fff3c4'; c.stroke(P);
        inkStroke(c, P, LW * 0.8);
        c.lineJoin = 'round';
      }
    }
    // glass shine
    const al = brk ? 0.22 : 0.06 + 0.06 * FI;
    c.fillStyle = `rgba(255,255,255,${al})`;
    const P = new Path2D();
    for (const [t, w] of [[0.7, 0.07], [0.8, 0.025]]) {
      const x = WX + WW * t, sl = WH * 0.42;
      P.moveTo(x + sl, WY - 10); P.lineTo(x + sl + WW * w, WY - 10); P.lineTo(x - sl + WW * w, WY + WH + 10); P.lineTo(x - sl, WY + WH + 10); P.closePath();
    }
    c.fill(P);
    c.restore();
  }

  function rimFill(c, P, base, rim, dy, pat) {
    c.save();
    c.translate(REG.x, REG.y);
    c.clip(P);
    c.fillStyle = rim; c.fill(P);
    c.translate(0, dy);
    c.fillStyle = base; c.fill(P);
    if (pat) { c.fillStyle = pat; c.fill(P); }
    c.restore();
  }
  const fillC = (c, P, col) => { c.save(); c.translate(REG.x, REG.y); c.fillStyle = col; c.fill(P); c.restore(); };
  function drawArm(c, T, cx, cy, R, rim) {
    const q = T < 6.083 ? 0.45 : T < 6.167 ? 1.12 : T < 8.5 ? 1 : T < 8.583 ? 0.65 : 0.3;
    const sx0 = cx + R * 1.2, sy0 = cy + R * 1.25;
    const fx = cx + R * 1.95, fy = cy + R * 0.9 - R * 1.75 * q;
    const A = new Path2D(); A.moveTo(sx0, sy0); A.quadraticCurveTo(cx + R * 2.25, cy + R * 1.0, fx, fy + R * 0.3);
    c.lineCap = 'round';
    c.lineWidth = R * 0.5 + LW * 2; c.strokeStyle = INK; c.stroke(A);
    c.save(); c.translate(REG.x, REG.y); c.lineWidth = R * 0.5; c.strokeStyle = '#857a6e'; c.stroke(A); c.restore();
    const fw = R * 0.6, fh = R * 0.5;
    const F = rpoly([[fx - fw / 2, fy - fh / 2], [fx + fw / 2, fy - fh / 2], [fx + fw / 2, fy + fh / 2], [fx - fw / 2, fy + fh / 2]], R * 0.17);
    const th = rpoly([[fx - fw * 0.5, fy - fh * 0.5 - R * 0.4], [fx - fw * 0.14, fy - fh * 0.5 - R * 0.4], [fx - fw * 0.1, fy], [fx - fw * 0.5, fy]], R * 0.1);
    rimFill(c, th, '#d9cdb9', rim, R * 0.07);
    rimFill(c, F, '#d9cdb9', rim, R * 0.1);
    c.lineWidth = LW * 0.85; c.strokeStyle = INK; c.stroke(th); c.stroke(F);
    c.lineWidth = LW * 0.45;
    c.beginPath();
    for (let j = 1; j < 3; j++) { const y = fy - fh / 2 + (fh * j) / 3; c.moveTo(fx - fw * 0.02, y); c.lineTo(fx + fw * 0.38, y); }
    c.stroke();
    if (T >= 6.083 && T < 6.75) {
      c.lineWidth = LW * 0.7; c.beginPath();
      for (const a of [-2.5, -1.6, -0.75]) { const r0 = R * 0.72, r1 = R * 1.02; c.moveTo(fx + Math.cos(a) * r0, fy - R * 0.2 + Math.sin(a) * r0); c.lineTo(fx + Math.cos(a) * r1, fy - R * 0.2 + Math.sin(a) * r1); }
      c.stroke();
    }
  }
  function drawCrew(c, T, fr, rim) {
    const R = CR, sp = Math.max(4, 6 * U);
    for (let i = 0; i < 2; i++) {
      const cx = CX[i], cy = CY, by = H + M + 20;
      if (i === 1 && T >= 6.0 && T < 8.75) drawArm(c, T, cx, cy, R, rim);
      // shoulders of the suit
      const B = new Path2D();
      B.moveTo(cx - 1.42 * R, by);
      B.lineTo(cx - 1.5 * R, cy + 1.5 * R);
      B.bezierCurveTo(cx - 1.56 * R, cy + 1.0 * R, cx - 1.42 * R, cy + 0.8 * R, cx - 1.05 * R, cy + 0.74 * R);
      B.quadraticCurveTo(cx - 0.6 * R, cy + 0.64 * R, cx, cy + 0.64 * R);
      B.quadraticCurveTo(cx + 0.6 * R, cy + 0.64 * R, cx + 1.05 * R, cy + 0.74 * R);
      B.bezierCurveTo(cx + 1.42 * R, cy + 0.8 * R, cx + 1.56 * R, cy + 1.0 * R, cx + 1.5 * R, cy + 1.5 * R);
      B.lineTo(cx + 1.42 * R, by);
      B.closePath();
      rimFill(c, B, '#857a6e', rim, R * 0.1, dots('#5f564d', sp, 0.32));
      const pxs = cx + (i ? 1.22 : -1.22) * R, pys = cy + 1.12 * R;
      const Pt = new Path2D(); Pt.ellipse(pxs, pys, R * 0.17, R * 0.2, 0, 0, TAU);
      fillC(c, Pt, i ? '#c9822f' : '#2b3bff');
      // helmet
      const HP = new Path2D(); HP.ellipse(cx, cy, R, R * 1.06, 0, 0, TAU);
      rimFill(c, HP, '#9a9083', rim, R * 0.15, dots('#6f665b', sp, 0.34));
      c.save(); c.translate(REG.x, REG.y); c.clip(HP);
      const HS = new Path2D(); HS.ellipse(cx, cy + R * 0.15, R, R * 1.06, 0, 0, TAU); c.clip(HS);
      c.fillStyle = i ? '#9a6224' : '#2b3bff';
      c.fillRect(cx - R * 0.13, cy - R * 1.2, R * 0.26, R * 2.4);
      c.fillStyle = mixc('#9a9083', '#ffffff', 0.55);
      c.beginPath(); c.ellipse(cx - R * 0.52, cy - R * 0.2, R * 0.11, R * 0.34, 0.5, 0, TAU); c.fill();
      c.beginPath(); c.ellipse(cx - R * 0.7, cy + R * 0.2, R * 0.055, R * 0.11, 0.3, 0, TAU); c.fill();
      c.restore();
      // seat: headrest + back, seen from behind
      const S = new Path2D();
      const hr = rpoly([[cx - 0.6 * R, cy + 0.18 * R], [cx + 0.6 * R, cy + 0.18 * R], [cx + 0.66 * R, cy + 1.0 * R], [cx - 0.66 * R, cy + 1.0 * R]], R * 0.24);
      const bk = rpoly([[cx - 1.22 * R, cy + 0.94 * R], [cx + 1.22 * R, cy + 0.94 * R], [cx + 1.1 * R, by], [cx - 1.1 * R, by]], R * 0.34);
      S.addPath(hr); S.addPath(bk);
      rimFill(c, S, '#2c231d', mixc('#2c231d', rim, 0.75), R * 0.07, dots('#1c1612', sp, 0.3));
      // ink
      c.strokeStyle = INK;
      c.lineWidth = LW * 1.0; c.stroke(B); c.stroke(HP); c.stroke(bk); c.stroke(hr);
      c.lineWidth = LW * 0.5; c.stroke(Pt);
      c.beginPath(); c.moveTo(cx - R * 0.13, cy - R * 1.03); c.lineTo(cx - R * 0.13, cy + R * 0.3); c.moveTo(cx + R * 0.13, cy - R * 1.03); c.lineTo(cx + R * 0.13, cy + R * 0.3); c.stroke();
      // stitching
      c.save();
      c.lineWidth = Math.max(1, LW * 0.32); c.strokeStyle = mixc('#2c231d', rim, 0.45);
      c.setLineDash([Math.max(3, R * 0.07), Math.max(3, R * 0.06)]);
      c.beginPath();
      c.moveTo(cx - 0.42 * R, cy + 0.38 * R); c.lineTo(cx + 0.42 * R, cy + 0.38 * R);
      c.moveTo(cx - 0.78 * R, cy + 1.3 * R); c.lineTo(cx - 0.7 * R, by);
      c.moveTo(cx + 0.78 * R, cy + 1.3 * R); c.lineTo(cx + 0.7 * R, by);
      c.stroke();
      c.restore();
    }
  }

  function focusPath(k, fr) {
    const cx = W / 2, cy = FY, n = Math.floor(30 + 130 * k), R = Math.hypot(W, H);
    const rx = portrait ? lerp(W * 0.62, W * 0.5, k) : lerp(W * 0.48, W * 0.34, k);
    const ry = portrait ? lerp(H * 0.36, H * 0.25, k) : lerp(H * 0.48, H * 0.31, k);
    const P = new Path2D();
    for (let i = 0; i < n; i++) {
      const s = fr * 97.3 + i * 13.1;
      const a = ((i + h1(s)) / n) * TAU;
      const aw = (0.0025 + 0.008 * h1(s * 2)) * (0.6 + k * 0.6);
      const r0 = 0.95 + 0.5 * h1(s * 3);
      P.moveTo(cx + Math.cos(a) * rx * r0, cy + Math.sin(a) * ry * r0);
      P.lineTo(cx + Math.cos(a - aw) * R, cy + Math.sin(a - aw) * R);
      P.lineTo(cx + Math.cos(a + aw) * R, cy + Math.sin(a + aw) * R);
      P.closePath();
    }
    return P;
  }

  /* ---------- state ---------- */
  const vel = (T) => (T < 4.5 ? 7.8 - 0.16 * (T / 4.5) : T < 10 ? lerp(7.64, 0.24, eoc((T - 4.5) / 5.5)) : 0.24 - 0.02 * (1 - Math.exp(-(T - 10) / 400)));
  const alt = (T) => (T < 4.5 ? 122 - 5.6 * (T / 4.5) : T < 10 ? lerp(116.4, 38, eoc((T - 4.5) / 5.5)) : 38 - 4 * (1 - Math.exp(-(T - 10) / 400)));

  function state(T, fr) {
    FI = Math.pow(ss(0.5, 3.9, T), 1.15);
    let A = 0;
    if (T > 0.5 && T < 3.833) A = Math.pow(ss(0.5, 3.9, T), 1.7);
    else if (T >= 3.833 && T < 4.5) A = 1.15;
    else if (T >= 4.5) A = 1.5 * Math.exp(-(T - 4.5) * 2.1);
    A *= 7.5 * SU;
    SX = A * (h1(fr * 1.71) * 2 - 1) + Math.sin(T * 0.62) * 1.6 * SU;
    SY = A * (h1(fr * 2.37 + 3) * 2 - 1) + Math.sin(T * 0.47 + 1.1) * 1.1 * SU;
    ROT = A * 0.0008 * (h1(fr * 3.1 + 7) * 2 - 1) + Math.sin(T * 0.33 + 0.4) * 0.0016;
    let rg = 0;
    if (T > 3.2 && T < 3.833) rg = ss(3.2, 3.833, T) * 0.55;
    else if (T >= 3.833) rg = T < 4.6 ? 1 : Math.exp(-(T - 4.6) * 3.2);
    const rp = 9 * SU * rg;
    REG.x = rp * (0.75 + 0.5 * h1(fr * 5.1)) + 0.9;
    REG.y = -rp * 0.55 * (0.75 + 0.5 * h1(fr * 6.3)) - 0.6;
  }

  /* ---------- DOM ---------- */
  const pop = (dt, seq) => { if (dt < 0) return null; let k = seq[0]; for (const s of seq) if (dt >= s[0] - 1e-6) k = s; return k; };
  const set = (el, prop, v) => { const key = '_hc_' + prop; if (el[key] !== v) { el[key] = v; if (prop === 'text') el.textContent = v; else if (prop[0] === '-') el.style.setProperty(prop, v); else el.style[prop] = v; } };
  const show = (el, on) => set(el, 'visibility', on ? '' : 'hidden');
  const fade = (el, on) => set(el, 'opacity', on ? '' : '0');
  const f2 = (x) => x.toFixed(1);
  const F = 1 / 12;
  const PROPS = ['--b-out', '--b-in', '--b-dot', '--f-hi', '--f-mid', '--f-dot'];
  const PAL = [
    ['#ffe14a', '#ff4a1c', '#c71f0a', '#fffbe6', '#ffd23a', '#ff6a1f'],
    ['#fff4c4', '#7a3ff0', '#5124b5', '#ffffff', '#ffe7a6', '#a66dff'],
    ['#ffffff', '#2b3bff', '#1a24c4', '#ffffff', '#a9e6ff', '#3d8bff'],
  ];

  function dom(T, fr) {
    const cp = pop(T - 0.45, [[0, 0.55, -7], [F, 1.12, 2.5], [2 * F, 0.96, -0.6], [3 * F, 1, 0]]);
    fade(capEl, !!cp);
    if (cp) set(capEl, 'transform', `translate(${f2(SX * 0.35)}px,${f2(SY * 0.35)}px) scale(${cp[1]}) rotate(${cp[2]}deg)`);
    const sq = pop(T - 1.0, [[0, -46, -3], [F, -8, 1], [2 * F, 3, 0], [3 * F, 0, 0]]);
    fade(subEl, !!sq);
    if (sq) set(subEl, 'transform', `translateX(${sq[1]}px) rotate(${sq[2]}deg)`);
    btns.forEach((b, i) => {
      const q = pop(T - 1.25 - i * 0.1, [[0, 0.4], [F, 1.14], [2 * F, 0.95], [3 * F, 1]]);
      show(b, !!q);
      if (q) set(b, 'scale', String(q[1]));
    });
    const rq = pop(T - 1.5, [[0, 0.5], [F, 1.1], [2 * F, 1]]);
    fade(roEl, !!rq);
    if (rq) set(roEl, 'scale', String(rq[1]));
    // sfx
    const sOn = T >= 2.2 && T < 3.75;
    show(sfxEl, sOn);
    if (sOn) {
      sfxL.forEach((l, i) => {
        const q = pop(T - 2.2 - i * F, [[0, 1.6], [F, 0.88], [2 * F, 1]]);
        show(l, !!q);
        if (q) set(l, 'scale', String(q[1]));
      });
      const g = 1 + ss(2.7, 3.75, T) * 0.22;
      set(sfxEl, 'transform', `translate(${f2(SX)}px,${f2(SY)}px) scale(${g.toFixed(3)})`);
    }
    // fast.
    const fq = pop(T - 3.833, [[0, 1.75, -10], [F, 0.9, -3], [2 * F, 1.06, -6], [3 * F, 1, -5]]);
    fade(fastEl, !!fq);
    if (fq) {
      set(fxEl, 'scale', String(fq[1]));
      set(fxEl, 'rotate', fq[2] + 'deg');
      set(fastEl, 'transform', `translate(${f2(SX * 0.6)}px,${f2(SY * 0.6)}px)`);
      const bq = pop(T - 3.833, [[0, 0.35], [F, 1.22], [2 * F, 0.94], [3 * F, 1.04], [4 * F, 1]]);
      set(burstEl, 'scale', (bq[1] * lerp(1, 0.88, ss(4.62, 5.6, T))).toFixed(3));
      if (T < 5.4) setBurst(fr, 0.08); else setBurst(0, 0);
      // cools in stepped cel stages: fire, violet, cobalt
      const pal = PAL[T < 4.75 ? 0 : T < 5.0 ? 1 : 2];
      PROPS.forEach((k, j) => set(root, k, pal[j]));
      set(root, '--rx', f2(REG.x * 1.5) + 'px');
      set(root, '--ry', f2(REG.y * 1.5) + 'px');
    }
    // readouts
    set(vEl, 'text', vel(T).toFixed(3));
    set(aEl, 'text', alt(T).toFixed(2));
  }

  /* ---------- cabin, live part ---------- */
  let restC = null;
  function drawCabin(c, T, fr) {
    c.drawImage(cabF, -M + REG.x, -M + REG.y, W + 2 * M, H + 2 * M);
    // firelight / skylight spill
    let la = 0;
    if (T < 4.5) { la = ss(0.0, 1.2, T) * 0.25 + FI * 0.75; la *= 0.72 + 0.28 * h1(fr * 9.1); }
    else la = 0.4 + 0.6 * (1 - ss(4.5, 5.6, T));
    if (la > 0.01) {
      c.globalAlpha = clamp(la);
      c.drawImage(T < 4.5 ? spW : spC, -M + REG.x, -M + REG.y, W + 2 * M, H + 2 * M);
      c.save(); c.translate(REG.x, REG.y);
      const P = new Path2D(); P.rect(-M, -M, W + 2 * M, H + 2 * M); P.addPath(winP);
      c.clip(P, 'evenodd');
      c.lineWidth = BZ * 0.85; c.strokeStyle = T < 4.5 ? mixc('#ff8a2a', '#ffd36b', h1(fr * 3.3)) : '#cdefff'; c.stroke(winP);
      c.restore();
      c.globalAlpha = 1;
    }
    c.drawImage(cabI, -M, -M, W + 2 * M, H + 2 * M);
  }
  function drawNeedle(c, T, fr, fire) {
    if (!dial) return;
    const a = lerp(Math.PI * 0.8, Math.PI * 2.2, clamp(vel(T) / 8)) + (fire ? (h1(fr * 4.7) - 0.5) * 0.12 * FI : 0);
    c.lineWidth = Math.max(2, LW * 0.6); c.strokeStyle = '#d8341f';
    c.beginPath(); c.moveTo(dial.x, dial.y); c.lineTo(dial.x + Math.cos(a) * dial.r * 0.8, dial.y + Math.sin(a) * dial.r * 0.8); c.stroke();
    c.fillStyle = INK; c.beginPath(); c.arc(dial.x, dial.y, Math.max(2.5, dial.r * 0.12), 0, TAU); c.fill();
  }
  function rimAt(T, fr) {
    if (T < 0.5) return mixc('#51473f', '#b4612a', ss(0, 1, T));
    if (T < 4.5) return mixc(mixc('#b4612a', '#ff9a2e', FI * 1.5), '#ffd76e', h1(fr * 4.4) * FI);
    if (T < 4.583) return '#ffffff';
    return '#d6f3ff';
  }

  /* ---------- render ---------- */
  function render(T) {
    if (!W && !layout()) return;
    const fps = T > 10 ? 8 : 12;
    T = Math.floor(T * fps + 1e-6) / fps;
    const fr = Math.floor(T * 12 + 1e-6);
    state(T, fr);
    const c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.fillStyle = '#0e0b09'; c.fillRect(0, 0, W, H);
    c.save();
    c.translate(W / 2 + SX, H / 2 + SY); c.rotate(ROT); c.translate(-W / 2, -H / 2);
    drawOutside(c, T, fr);
    const fire = T >= 0.3 && T < 4.5;
    if (T >= 9) {
      if (!restC) {
        restC = mk(W + 2 * M, H + 2 * M);
        const q = cctx(restC, M, M);
        drawCabin(q, 12, 0);
        drawCrew(q, 12, 0, rimAt(12, 0));
      }
      c.drawImage(restC, -M, -M, W + 2 * M, H + 2 * M);
      drawNeedle(c, T, fr, false);
    } else {
      drawCabin(c, T, fr);
      drawNeedle(c, T, fr, fire);
      drawCrew(c, T, fr, rimAt(T, fr));
    }
    if (T > 10) {
      const k = (T - 10) % 6.5;
      if (k < 0.375) {
        const i = Math.floor((T - 10) / 6.5) % 2, g = [0.55, 1, 0.45][Math.min(2, Math.floor(k / 0.125))];
        const P = new Path2D(); star(P, CX[i] - CR * 0.56, CY - CR * 0.42, CR * 0.42 * g);
        c.fillStyle = '#ffffff'; c.fill(P); c.lineWidth = Math.max(1.2, LW * 0.4); c.strokeStyle = INK; c.stroke(P);
      }
    }
    c.restore();
    // impact frame (one frame before "fast." lands): inverted, grey, crushed
    const impact = T >= 3.75 && T < 3.833;
    if (impact) {
      c.globalCompositeOperation = 'saturation'; c.fillStyle = '#808080'; c.fillRect(0, 0, W, H);
      c.globalCompositeOperation = 'difference'; c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
      c.globalCompositeOperation = 'multiply'; c.drawImage(cv, 0, 0, W, H);
      c.globalCompositeOperation = 'source-over';
    }
    // radiating speed lines: ink over the window, firelight over the dark cabin
    const fk = T >= 2.2 && T < 4.5 ? ss(2.2, 3.833, T) : 0;
    if (fk > 0) {
      const P = focusPath(fk, fr);
      if (impact) { c.fillStyle = INK; c.fill(P); }
      else {
        c.save(); c.clip(winP); c.fillStyle = INK; c.fill(P); c.restore();
        const O = new Path2D(); O.rect(0, 0, W, H); O.addPath(winP);
        c.save(); c.clip(O, 'evenodd'); c.globalAlpha = 0.3 + 0.55 * fk; c.fillStyle = '#ffd98a'; c.fill(P); c.restore();
        c.globalAlpha = 1;
      }
    }
    // break flash: halftone white, centred on the window
    if (T >= 4.5 && T < 4.75) {
      const base = T < 4.583 ? 1 : 1 - ss(4.583, 4.75, T);
      const sp = Math.max(9, 15 * U), g = Math.min(W, H) * 0.2;
      const halo = rpoly(trap(BZ + g), RAD + BZ + g);
      dotFill(c, winP, null, '#fffdf4', sp, 0.5 * base);
      dotFill(c, halo, winP, '#fffdf4', sp, 0.5 * base * 0.5);
    }
    // rise from the dark: halftone dissolve, the window clears first
    if (T < 1.0) {
      const base = 1 - ss(0.0, 1.0, T);
      const sp = Math.max(10, 16 * U);
      if (T < 0.05) { c.fillStyle = '#0e0b09'; c.fillRect(0, 0, W, H); }
      else {
        const all = new Path2D(); all.rect(0, 0, W, H);
        const near = rpoly(trap(BZ + Math.min(W, H) * 0.12), RAD + BZ);
        dotFill(c, winP, null, '#0e0b09', sp, 0.5 * clamp(base * 1.6 - 0.62));
        dotFill(c, near, winP, '#0e0b09', sp, 0.5 * clamp(base * 1.6 - 0.35));
        dotFill(c, all, near, '#0e0b09', sp, 0.5 * clamp(base * 1.6 - 0.1));
      }
    }
    // ink band under the nav
    c.drawImage(topC, 0, 0, W, topH);
    dom(T, fr);
  }

  /* ---------- clock ---------- */
  let T = 0, t0 = performance.now(), running = false, raf = 0, lastKey = -1, inView = true;
  const restT = 10;
  function loop(now) {
    if (!running) return;
    T = (now - t0) / 1000;
    const fps = T > 10 ? 8 : 12;
    const key = fps * 1e6 + Math.floor(T * fps);
    if (key !== lastKey) { lastKey = key; render(T); }
    raf = requestAnimationFrame(loop);
  }
  function sync() {
    const want = inView && !document.hidden && !RM.matches;
    if (want && !running) { running = true; t0 = performance.now() - T * 1000; lastKey = -1; raf = requestAnimationFrame(loop); }
    else if (!want && running) { running = false; cancelAnimationFrame(raf); }
    if (RM.matches) { T = restT; render(T); }
  }
  root.addEventListener('h-seek', (e) => {
    T = Math.max(0, Number(e.detail) || 0);
    t0 = performance.now() - T * 1000;
    lastKey = -1;
    render(T);
  });
  new ResizeObserver(() => { if (layout()) render(T); }).observe(root);
  if ('IntersectionObserver' in window) new IntersectionObserver((es) => { inView = es[es.length - 1].isIntersecting; sync(); }).observe(root);
  document.addEventListener('visibilitychange', sync);
  RM.addEventListener && RM.addEventListener('change', sync);
  layout();
  if (RM.matches) T = restT;
  render(T);
  sync();
})();
</script>
