    const line = new Path2D(), dots = new Path2D(), ends = new Path2D()
    let left = upto, head = null
    for (let i = 0; i < P.S.length && left > 0; i++) {
      const s = P.S[i]
      if (s.dot) { dots.moveTo(s[0][0], s[0][1]); dots.lineTo(s[0][0] + 0.05, s[0][1]); left -= P.lens[i]; head = s[0]; continue }
      line.moveTo(s[0][0], s[0][1]); ends.moveTo(s[0][0], s[0][1]); ends.lineTo(s[0][0] + 0.05, s[0][1])
      for (let j = 1; j < s.length; j++) {
        const dx = s[j][0] - s[j - 1][0], dy = s[j][1] - s[j - 1][1], d = Math.hypot(dx, dy)
        if (d >= left) { const t = left / d; head = [s[j - 1][0] + dx * t, s[j - 1][1] + dy * t]; line.lineTo(head[0], head[1]); left = -1; break }
        line.lineTo(s[j][0], s[j][1]); left -= d
      }
      if (left > 0) { const e = s[s.length - 1]; ends.moveTo(e[0], e[1]); ends.lineTo(e[0] + 0.05, e[1]); head = e }
    }
    return { line, dots, ends, head, done: left > 0 }
  }
  const headAt = (P, len) => build(P, len).head || [0, 0]

  // ---------- geometry ----------
  function trap(cx, y0, y1, wt, wb) { return [[cx - wt, y0], [cx + wt, y0], [cx + wb, y1], [cx - wb, y1]] }
  function grow(t, d) {
    const cx = (t[0][0] + t[1][0]) / 2, y0 = t[0][1], y1 = t[3][1], wt = t[1][0] - cx, wb = t[2][0] - cx
    const m = (wb - wt) / (y1 - y0), q = d * Math.sqrt(1 + m * m)
    return trap(cx, y0 - d, y1 + d, wt - m * d + q, wb + m * d + q)
  }
  function roundPoly(pts, r, seg) {
    const n = pts.length, out = [], mids = []
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n]
      let ax = p0[0] - p1[0], ay = p0[1] - p1[1], bx = p2[0] - p1[0], by = p2[1] - p1[1]
      const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by)
      ax /= la; ay /= la; bx /= lb; by /= lb
      const ang = Math.acos(clamp(ax * bx + ay * by, -1, 1))
      const tl = r / Math.tan(ang / 2)
      let mx = ax + bx, my = ay + by
      const ml = Math.hypot(mx, my); mx /= ml; my /= ml
      const dc = r / Math.sin(ang / 2), c = [p1[0] + mx * dc, p1[1] + my * dc]
      const q0 = [p1[0] + ax * tl, p1[1] + ay * tl], q2 = [p1[0] + bx * tl, p1[1] + by * tl]
      const a0 = Math.atan2(q0[1] - c[1], q0[0] - c[0])
      let da = Math.atan2(q2[1] - c[1], q2[0] - c[0]) - a0
      while (da > PI) da -= TAU
      while (da < -PI) da += TAU
      for (let k = 0; k <= seg; k++) { const a = a0 + da * k / seg; out.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]); if (k === seg >> 1) mids.push(out[out.length - 1]) }
    }
    const top = [(pts[0][0] + pts[1][0]) / 2, pts[0][1]], k0 = seg + 1
    const ring = [top].concat(out.slice(k0), out.slice(0, k0), [top])
    ring.mids = mids
    return ring
  }
  function polyPath(pts, path) {
    const p = path || new Path2D()
    p.moveTo(pts[0][0], pts[0][1])
    for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1])
    return p
  }
  function cumLen(pts) { const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return c }
  function subPath(pts, cl, a, b, path) {
    let started = false
    for (let i = 1; i < pts.length; i++) {
      const l0 = cl[i - 1], l1 = cl[i]
      if (l1 < a) continue
      if (l0 > b) break
      const t0 = clamp((a - l0) / (l1 - l0 || 1)), t1 = clamp((b - l0) / (l1 - l0 || 1))
      if (!started) { path.moveTo(lerp(pts[i - 1][0], pts[i][0], t0), lerp(pts[i - 1][1], pts[i][1], t0)); started = true }
      path.lineTo(lerp(pts[i - 1][0], pts[i][0], t1), lerp(pts[i - 1][1], pts[i][1], t1))
    }
    return path
  }
  function traced(ring, f) {
    // two beams leave the top middle and meet at the bottom
    const cl = ring.cl || (ring.cl = cumLen(ring)), Lt = cl[cl.length - 1], p = new Path2D()
    if (f <= 0) return p
    subPath(ring, cl, 0, f * Lt / 2, p)
    subPath(ring, cl, Lt - f * Lt / 2, Lt, p)
    return p
  }
  function pointAtLen(ring, l) {
    const cl = ring.cl || (ring.cl = cumLen(ring))
    for (let i = 1; i < ring.length; i++) if (cl[i] >= l) { const t = (l - cl[i - 1]) / (cl[i] - cl[i - 1] || 1); return [lerp(ring[i - 1][0], ring[i][0], t), lerp(ring[i - 1][1], ring[i][1], t)] }
    return ring[ring.length - 1]
  }

  // ---------- timeline ----------
  function fireI(t) {
    if (t < 0.5) return 0
    if (t < 3.9) return Math.pow((t - 0.5) / 3.4, 1.5)
    if (t < 4.5) return 1
    return 1 - ss(4.5, 5.05, t)
  }
  function speed(t) {
    if (t > 4.5) return 9.6 + 120 * (t - 4.5)
    return 0.32 + 9.3 * Math.pow(fireI(t), 1.2)
  }
  const DT = 0.01, DMAX = 7, Dtab = new Float32Array(Math.round(DMAX / DT) + 2)
  for (let i = 1; i < Dtab.length; i++) Dtab[i] = Dtab[i - 1] + speed((i - 0.5) * DT) * DT
  function Dof(t) {
    if (t <= 0) return 0
    const f = t / DT
    if (f >= Dtab.length - 1) return Dtab[Dtab.length - 1] + (t - DMAX) * 0.3
    const i = f | 0
    return Dtab[i] + (Dtab[i + 1] - Dtab[i]) * (f - i)
  }
  function readouts(t) {
    if (t < 4.5) return [7.8, 122]
    if (t < 10) { const u = 1 - (t - 4.5) / 5.5; return [0.24 + 7.56 * u * u * u, 38 + 84 * u * u] }
    return [Math.max(0.2, 0.24 - (t - 10) * 0.0004), Math.max(30, 38 - (t - 10) * 0.012)]
  }

  // ---------- particles (seeded: any second can be drawn on its own) ----------
  const R0 = rng(11)
  const NS = 420
  const streaks = []
  for (let i = 0; i < NS; i++) streaks.push({ th: R0() * TAU, R: 0.42 + Math.pow(R0(), 0.8) * 1.9, u: R0(), temp: R0(), cut: 4.36 + R0() * 0.16, sw: (R0() - 0.5) * 0.9, n: R0() })
  const NK = 70
  const sparks = []
  for (let i = 0; i < NK; i++) sparks.push({ P: 0.32 + R0() * 0.6, ph: R0() * 3, on: R0() })
  const NB = 40
  const beamSparks = []
  for (let i = 0; i < NB; i++) beamSparks.push({ f: (i + R0() * 0.8) / NB, a: -PI / 2 + (R0() - 0.5) * 2.8, v: 0.3 + R0() * 0.9, life: 0.45 + R0() * 0.6 })
  const stars = []
  for (let i = 0; i < 46; i++) stars.push({ x: R0(), y: Math.pow(R0(), 1.25), b: R0(), tw: R0() * TAU })
  const clouds = []
  for (let i = 0; i < 13; i++) clouds.push({ b: (R0() - 0.5) * 0.42, p: (i + R0() * 0.7) / 13, r: 0.008 + R0() * 0.016, s1: R0() * TAU, s2: R0() * TAU, sq: 0.5 + R0() * 0.4 })
  const burst = []
  for (let i = 0; i < 28; i++) burst.push({ a: (i + R0() * 0.6) / 28 * TAU, v: 0.6 + R0() * 0.8, l: 0.25 + R0() * 0.5 })

  // ---------- layout ----------
  let L = null
  function layout() {
    const W = root.clientWidth, H = root.clientHeight
    if (!W || !H) return
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    const bw = Math.round(W * dpr), bh = Math.round(H * dpr)
    if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh }
    // halving steps, each a plain 2x2 average, down to a quarter of a CSS pixel
    down.length = 0
    let cw = bw, ch = bh
    while (cw > W / 4 + 1) {
      cw = Math.ceil(cw / 2); ch = Math.ceil(ch / 2)
      const last = cw <= W / 4 + 1
      const [c, x] = last ? [b1, b1x] : mk()
      c.width = cw; c.height = ch
      down.push([c, x])
    }
    if (!down.length) { b1.width = bw; b1.height = bh; down.push([b1, b1x]) }
    h3.width = Math.ceil(b1.width / 2); h3.height = Math.ceil(b1.height / 2)
    b2.width = Math.ceil(h3.width / 2); b2.height = Math.ceil(h3.height / 2)
    const rr = root.getBoundingClientRect(), cr = copyEl.getBoundingClientRect()
    const copyTop = cr.top - rr.top
    const md = Math.min(W, H)
    const narrow = W < 720 || W / H < 1.0
    const y0 = Math.max(92, H * 0.105)
    const fd = clamp(md * 0.016, 7, 16)
    const y1 = copyTop - (narrow ? 22 : clamp(H * 0.045, 24, 48)) - fd
    const cx = W / 2
    let wt, wb
    if (narrow) { wt = W * 0.43; wb = W * 0.455 } else { wt = Math.min(W * 0.29, (y1 - y0) * 1.05); wb = wt * 1.13 }
    const winH = y1 - y0, winW = wt + wb
    const rc = Math.min(winW, winH) * 0.13
    const glassT = trap(cx, y0, y1, wt, wb)
    const glass = roundPoly(glassT, rc, 10)
    const frame = roundPoly(grow(glassT, fd), rc + fd, 10)
    const wd = clamp(md * 0.045, 16, 44)
    const well = roundPoly(grow(glassT, fd + wd), rc + fd + wd * 1.6, 10)
    const mid = roundPoly(grow(glassT, fd * 0.5), rc + fd * 0.5, 10)
    const glassPath = polyPath(glass)
    // the glass edge resampled, with inward normals, for the plasma licking round it
    const gcl = cumLen(glass), gL = gcl[gcl.length - 1], edge = []
    const NE = 180
    for (let i = 0; i <= NE; i++) {
      const p = pointAtLen(glass, i / NE * gL), q = pointAtLen(glass, ((i + 0.5) / NE) * gL % gL), o = pointAtLen(glass, ((i - 0.5 + NE) / NE) * gL % gL)
      let tx = q[0] - o[0], ty = q[1] - o[1]
      const tl = Math.hypot(tx, ty) || 1
      tx /= tl; ty /= tl
      edge.push([p[0], p[1], -ty, tx, Math.abs(i / NE - 0.5) * 2])
    }
    // bolts around the frame
    const bolts = new Path2D()
    const mcl = cumLen(mid), mL = mcl[mcl.length - 1], nb = Math.max(16, Math.round(mL / clamp(md * 0.06, 34, 56)))
    const br = clamp(md * 0.0032, 1.4, 2.6)
    for (let i = 0; i < nb; i++) { const p = pointAtLen(mid, (i + 0.5) * mL / nb); bolts.moveTo(p[0] + br, p[1]); bolts.arc(p[0], p[1], br, 0, TAU) }
    const bevel = new Path2D()
    for (let i = 0; i < 4; i++) { const a = frame.mids[i], b = well.mids[i]; bevel.moveTo(a[0], a[1]); bevel.lineTo(b[0], b[1]) }
    const ribs = new Path2D(), seams = new Path2D()
    for (let k = 1; k <= 3; k++) {
      const d = fd + wd + k * clamp(md * 0.085, 36, 90) * (1 + k * 0.25)
      polyPath(roundPoly(grow(glassT, d), rc + d * 1.4, 10), ribs)
    }
    for (let i = 0; i < 4; i++) {
      const b = well.mids[i], tx = i === 0 || i === 3 ? -W * 0.1 : W * 1.1, ty = i < 2 ? -H * 0.2 : H * 1.25
      seams.moveTo(b[0], b[1]); seams.lineTo(lerp(b[0], tx, 0.8), lerp(b[1], ty, 0.8))
    }
    const cRect = { x: cr.left - rr.left - 14, y: copyTop - 12, w: cr.width + 28, h: cr.height + 24 }
    const offCopy = new Path2D()
    offCopy.rect(-W, -H, W * 3, H * 3); offCopy.rect(cRect.x, cRect.y, cRect.w, cRect.h)

    // headline: the first line (wrapping on phones), then "fast."
    const xh1 = narrow ? clamp(W * 0.034, 11, 15) : clamp(W * 0.0118, 12, 21)
    const line1 = 'Building software has never felt so'
    const maxW1 = wt * 2 * (narrow ? 0.9 : 0.86)
    let lines = [line1]
    if (measure(line1, xh1) > maxW1) {
      lines = []
      let cur = ''
      for (const w of line1.split(' ')) { const t = cur ? cur + ' ' + w : w; if (cur && measure(t, xh1) > maxW1) { lines.push(cur); cur = w } else cur = t }
      if (cur) lines.push(cur)
    }
    const fastU = walkText('fast.', { track: 2.6 }) / 10
    const xhF = Math.min(H * 0.13, (winW * (narrow ? 0.84 : 0.6)) / fastU, 150)
    const lh1 = xh1 * 2.05, gap = xh1 * 1.1 + xhF * 0.2
    const horY = y0 + winH * (narrow ? 0.665 : 0.72)
    const blockH = lines.length * lh1 + gap + xhF * 1.4
    const aTop = y0 + Math.max(winH * 0.07, 18), aBot = horY - winH * 0.06
    const top = Math.max(aTop, (aTop + aBot) / 2 - blockH / 2 - winH * 0.02)
    const S1 = []
    lines.forEach((ln, i) => { const w = measure(ln, xh1); S1.push(...setText(ln, xh1, cx - w / 2, top + xh1 * 1.42 + i * lh1)) })
    const fastW = fastU * xhF
    const fastBase = top + lines.length * lh1 + gap + xhF * 1.4
    const SF = setText('fast.', xhF, cx - fastW / 2, fastBase, { track: 2.6 })
    const P1 = prep(S1), PF = prep(SF)
    const emit = beamSparks.map((b) => headAt(PF, PF.total * b.f))

    // readouts: a HUD on the glass's lower corners
    const ro = []
    const valCap = narrow ? 12 : clamp(W * 0.0135, 15, 20)
    const labX = narrow ? 6.4 : clamp(W * 0.0055, 7, 8.4)
    const vxh = valCap / 1.4
    const roW = Math.max(measure('122.00', vxh, { tab: true }) + measure('km', labX), measure('7.800', vxh, { tab: true }) + measure('km/s', labX)) + labX * 0.9
    if (winW > 280) {
      const pad = narrow ? 8 : 11, pw = roW + pad * 2, ph = pad * 2 + labX * 1.4 + labX * 1.25 + valCap + (narrow ? 0 : 12)
      for (let s = 0; s < 2; s++) {
        const inset = rc * 0.5 + (narrow ? 6 : 10)
        const x = s ? cx + wb - inset - pw : cx - wb + inset, y = y1 - inset - ph
        const box = new Path2D()
        box.rect(x, y, pw, ph)
        const brk = new Path2D(), k = Math.min(10, ph * 0.3)
        for (const [bx, by, dx, dy] of [[x, y, 1, 1], [x + pw, y, -1, 1], [x + pw, y + ph, -1, -1], [x, y + ph, 1, -1]]) { brk.moveTo(bx + dx * k, by); brk.lineTo(bx, by); brk.lineTo(bx, by + dy * k) }
        const lab = prep(setText(s ? 'Altitude' : 'Velocity', labX, x + pad, y + pad + labX * 1.4))
        ro.push({ x, y, pw, ph, pad, box, brk, lab, unit: s ? 'km' : 'km/s', valBase: y + pad + labX * 1.4 + labX * 1.25 + valCap, gaugeY: y + ph - pad + 1 })
      }
    }

    // crew: two helmets from behind, where there is room beside the copy
    const helmets = []
    const side = cRect.x
    const hr = Math.min(H * 0.1, side * 0.3)
    if (!narrow && hr > 44) for (let s = 0; s < 2; s++) helmets.push({ x: s ? W - side * 0.46 : side * 0.46, y: H - hr * 1.05, r: hr, s: s ? -1 : 1 })

    const wcx = cx, wcy = (y0 + y1) / 2
    const vpx = cx, vpy = fastBase - xhF * 0.55
    const hh = 0.1, cosDip = 1 / (1 + hh), dip = Math.acos(cosDip)
    const F = 0.62 * Math.max(winW, winH * 1.1) * (narrow ? 1.25 : 1)
    const pitch = dip - Math.atan((horY - wcy) / F)
    L = {
      W, H, dpr, md, narrow, cx, y0, y1, wt, wb, winW, winH, rc, fd, glass, frame, well, glassPath, edge, bolts, bevel, ribs, seams, offCopy,
      xh1, P1, PF, xhF, fastBase, emit, ro, valCap, labX, helmets, wcx, wcy, vpx, vpy, horY,
      hh, cosDip, dip, F, sinP: Math.sin(pitch), cosP: Math.cos(pitch), pF: Math.max(winW, winH) * 0.34,
      ns: narrow ? 250 : NS, wLine: clamp(md * 0.0019, 1.1, 2.1),
    }
  }

  // ---------- the earth after the break: a wireframe globe seen from high up ----------
  function proj(nx, ny, nz, rad) {
    const px = nx * rad, py = -(1 + L.hh) + ny * rad, pz = nz * rad
    const zc = -py * L.sinP + pz * L.cosP
    if (zc < 0.02) return null
    const yc = py * L.cosP + pz * L.sinP
    return [L.wcx + L.F * px / zc, L.wcy - L.F * yc / zc]
  }
  function drawEarth(T, A, w) {
    const { cosDip, dip } = L
    const sd = Math.sin(dip)
    const limb = []
    for (let i = 0; i <= 96; i++) {
      const a = -1.45 + 2.9 * i / 96
      const q = proj(sd * Math.sin(a), cosDip, sd * Math.cos(a), 1)
      if (q) limb.push(q)
    }
    if (limb.length < 2) return
    const ground = polyPath(limb)
    ground.lineTo(L.W * 2, L.H * 2); ground.lineTo(-L.W, L.H * 2); ground.closePath()
    ctx.globalCompositeOperation = 'source-over'
    const gg = ctx.createLinearGradient(0, L.horY - 20, 0, L.y1)
    gg.addColorStop(0, rgba([18, 42, 110], A)); gg.addColorStop(0.22, rgba([7, 14, 40], A)); gg.addColorStop(1, rgba([4, 6, 14], A))
    ctx.fillStyle = gg; ctx.fill(ground)
    ctx.globalCompositeOperation = 'lighter'
    // the grid: lines along the track and across it, fading into the haze at the limb
    const scroll = T * 0.0042 + 0.05 * ss(4.6, 9, T)
    const lanes = [new Path2D(), new Path2D(), new Path2D()]
    const seg = (pts) => {
      let prev = null, prevL = 0
      for (const [nx, ny, nzz] of pts) {
        const lf = (ny - cosDip) / (1 - cosDip)
        const q = lf > 0 ? proj(nx, ny, nzz, 1) : null
        if (!q) { prev = null; continue }
        const lv = lf < 0.12 ? 0 : lf < 0.3 ? 1 : 2
        if (prev) { const p = lanes[Math.min(lv, prevL)]; p.moveTo(prev[0], prev[1]); p.lineTo(q[0], q[1]) }
        prev = q; prevL = lv
      }
    }
    for (let k = -14; k <= 14; k++) {
      const b = k * 0.024 + 0.006, pts = []
      for (let i = 0; i <= 40; i++) { const ps = dip * Math.pow(i / 40, 0.8); pts.push([Math.sin(b), Math.cos(b) * Math.cos(ps), Math.cos(b) * Math.sin(ps)]) }
      seg(pts)
    }
    const dps = 0.022, span = dip + 0.06
    for (let j = 0; j < Math.ceil(span / dps) + 1; j++) {
      const ps = ((j * dps - scroll) % span + span) % span, pts = []
      for (let i = 0; i <= 36; i++) { const b = -0.4 + 0.8 * i / 36; pts.push([Math.sin(b), Math.cos(b) * Math.cos(ps), Math.cos(b) * Math.sin(ps)]) }
      seg(pts)
    }
    const gc = [62, 118, 255], gcc = [130, 180, 255]
    glow(lanes[0], gc, w * 0.8, 0.2 * A, gcc)
    glow(lanes[1], gc, w * 0.85, 0.36 * A, gcc)
    glow(lanes[2], gc, w * 0.9, 0.5 * A, gcc)
    // contour clouds drifting far below
    const cl = [new Path2D(), new Path2D()]
    for (let c = 0; c < clouds.length; c++) {
      const C = clouds[c]
      const pc = ((C.p * span - scroll * 1.15 - T * 0.0006) % span + span) % span
      const bc = C.b + Math.sin(T * 0.03 + c) * 0.01
      for (let ring = 0; ring < 3; ring++) {
        const sc = [1, 0.64, 0.3][ring]
        let prev = null
        for (let i = 0; i <= 44; i++) {
          const th = i / 44 * TAU
          const r = C.r * sc * (1 + 0.24 * Math.sin(3 * th + C.s1 + T * 0.05) + 0.12 * Math.sin(5 * th + C.s2 - T * 0.04))
          const b = bc + r * Math.cos(th), ps = pc + r * C.sq * Math.sin(th)
          const ny = Math.cos(b) * Math.cos(ps)
          const lf = (ny - cosDip) / (1 - cosDip)
          const q = lf > 0.03 ? proj(Math.sin(b), ny, Math.cos(b) * Math.sin(ps), 1.002) : null
          if (!q) { prev = null; continue }
          if (prev) { const p = cl[lf < 0.2 ? 0 : 1]; p.moveTo(prev[0], prev[1]); p.lineTo(q[0], q[1]) }
          prev = q
        }
      }
    }
    glow(cl[0], [150, 210, 255], w * 0.9, 0.35 * A, [225, 245, 255])
    glow(cl[1], [150, 210, 255], w, 0.75 * A, [235, 250, 255])
    // the limb and the atmosphere above it
    const lp = polyPath(limb)
    const lift = L.winH * 0.011
    ctx.save()
    for (let k = 1; k <= 4; k++) { ctx.translate(0, -lift); glow(lp, [70, 150, 255], w * 0.8, A * 0.2 * (5 - k) / 4, [140, 195, 255]) }
    ctx.restore()
    glow(lp, [80, 200, 255], w * 1.5, A * 1.1, [226, 250, 255], 1.25)
  }

  // ---------- re-entry: plasma streaks, shock rings, fire round the glass, sparks ----------
  const buckets = new Array(32)
  const ZN = 0.3, ZF = 9, ZR = ZF - ZN
  function drawPlasma(T, I, up) {
    const D = Dof(T), sp = speed(T), Iv = T < 4.5 ? I : 1 - ss(4.85, 5.2, T)
    if (Iv <= 0.003) return
    const len = clamp(0.12 + sp * 0.1, 0.12, 3.2)
    const { vpx, vpy, pF } = L
    const lim = Math.max(L.winW, L.winH) * 1.1
    buckets.fill(null)
    const put = (key, x0, y0, x1, y1) => { const p = buckets[key] || (buckets[key] = new Path2D()); p.moveTo(x0, y0); p.lineTo(x1, y1) }
    const n = Math.floor(L.ns * clamp(0.08 + I * 1.0))
    const heatShift = I * 1.6
    const cutD = T > 4.38 ? null : 0
    for (let i = 0; i < n; i++) {
      const s = streaks[i]
      const pos = s.u * ZR + D, cyc = Math.floor(pos / ZR)
      if (cutD === null && cyc * ZR - s.u * ZR > Dof(s.cut)) continue
      const zh = ZF - (pos - cyc * ZR), zt = Math.min(ZF, zh + len), zm = zh + (zt - zh) * 0.35
      const rh = pF * s.R / zh
      if (rh > lim * 1.6 && pF * s.R / zt > lim) continue
      const b = ss(ZF, ZF * 0.62, zh) * (0.4 + 0.6 * s.n) * Iv
      if (b < 0.06) continue
      const al = Math.min(3, Math.floor(b * 4.2))
      const cl = Math.min(3, Math.floor(s.temp * 2.1 + heatShift))
      const near = zh < 1.5 ? 1 : 0
      const wob = 0.035 * Math.sin(T * 3 + i)
      const ah = s.th + s.sw / zh * 0.5 + wob, at = s.th + s.sw / zt * 0.5 + wob, am = s.th + s.sw / zm * 0.5 + wob
      const rm = pF * s.R / zm, rt = pF * s.R / zt
      const mx = vpx + Math.cos(am) * rm, my = vpy + Math.sin(am) * rm
      put((cl * 4 + al) * 2 + near, vpx + Math.cos(ah) * rh, vpy + Math.sin(ah) * rh, mx, my)
      if (al > 0) put((cl * 4 + Math.max(0, al - 2)) * 2, mx, my, vpx + Math.cos(at) * rt, vpy + Math.sin(at) * rt)
    }
    const w = L.wLine * 0.95
    const AL = [0.24, 0.48, 0.74, 1]
    for (let k = 0; k < 32; k++) {
      const p = buckets[k]
      if (!p) continue
      const al = (k >> 1) & 3, ww = w * (k & 1 ? 1.9 : 1)
      if (al > 1) glow(p, FIRE[k >> 3], ww, AL[al] * up, FIRE_C[k >> 3])
      else { ctx.strokeStyle = rgba(mix(FIRE[k >> 3], FIRE_C[k >> 3], 0.4), AL[al] * up * 0.9); ctx.lineWidth = ww * 1.5; ctx.stroke(p) } // dim ones: the bloom is halo enough
    }
    // shock fronts: broken, flickering rings rushing out of the tunnel
    const rings = [new Path2D(), new Path2D(), new Path2D()]
    const NR = 8, tear = ss(4.5, 4.95, T)
    for (let j = 0; j < NR; j++) {
      const pos = j / NR * ZR + D * 0.82, cyc = Math.floor(pos / ZR)
      if (T > 4.4 && cyc * ZR - j / NR * ZR > Dof(4.5) * 0.82) continue
      const z = ZF - (pos - cyc * ZR)
      const rad = pF * 1.22 / z
      if (rad < 5 || rad > lim * 2) continue
      const a = ss(ZF, ZF * 0.45, z) * Math.pow(Iv, 0.7)
      if (a < 0.04) continue
      const pth = rings[a > 0.66 ? 2 : a > 0.33 ? 1 : 0]
      const NV = 22
      let pen = false
      for (let v = 0; v <= NV; v++) {
        const vv = v % NV
        if (hash(vv + 0.5, j + cyc * 13) < 0.22 + tear * 0.78) { pen = false; continue }
        const ang = vv / NV * TAU + j * 0.4 + cyc * 0.9
        const r = rad * (1 + 0.08 * nz(T * 4.5 + vv * 0.9 + j * 3.1, vv + j) + 0.04 * Math.sin(T * 17 + vv * 2.3))
        const x = vpx + Math.cos(ang) * r, y = vpy + Math.sin(ang) * r * 0.9
        if (!pen) { pth.moveTo(x, y); pen = true } else pth.lineTo(x, y)
      }
    }
    const fl = 0.85 + 0.15 * nz(T * 21, 2)
    glow(rings[0], FIRE[0], w * 0.9, 0.22 * up * fl, FIRE_C[1])
    glow(rings[1], FIRE[1], w, 0.42 * up * fl, FIRE_C[1])
    glow(rings[2], FIRE[2], w * 1.1, 0.62 * up * fl, FIRE_C[2])
    // the sheath: plasma licking up round the inside of the glass, from the bottom up
    const sheath = [new Path2D(), new Path2D(), new Path2D()]
    for (let k = 0; k < 2; k++) {
      const pth = sheath[k]
      let pen = false
      const base = (5 + k * 11) * (0.5 + Iv * 0.9) * (L.narrow ? 0.7 : 1)
      for (let i = 0; i < L.edge.length; i++) {
        const [px, py, nx, ny, d] = L.edge[i]
        const ph = (1 - d) * 14 - T * (3.2 + k * 1.1)
        const on = nz(ph * 0.5, k * 3.7) > 0.5 - Iv * 0.85 - (1 - d) * 0.3
        if (!on) { pen = false; continue }
        const off = base * (1 + 0.5 * nz(ph * 0.7, k + 1)) * (0.45 + 0.75 * (1 - d))
        const x = px + nx * off, y = py + ny * off
        if (!pen) { pth.moveTo(x, y); pen = true } else pth.lineTo(x, y)
      }
    }
    glow(sheath[0], FIRE[2], w * 1.2, 0.8 * Iv * up * fl, FIRE_C[3])
    glow(sheath[1], FIRE[1], w, 0.5 * Iv * up * fl, FIRE_C[1])
    // sparks: short bright strokes thrown past the glass
    if (T < 4.75) {
      const sp1 = new Path2D()
      for (let k = 0; k < NK; k++) {
        const S = sparks[k]
        if (I < S.on * 0.85 + 0.12) continue
        const tt = T + S.ph, cyc = Math.floor(tt / S.P), age = tt - cyc * S.P, life = S.P * 0.7
        if (age > life) continue
        const ang = hash(k, cyc) * TAU, r0 = (0.18 + hash(k + 31, cyc) * 0.5) * L.winH
        const v = (0.7 + hash(k + 77, cyc) * 1.6) * L.md * (0.6 + I)
        const r = r0 + v * age, ox = Math.cos(ang), oy = Math.sin(ang)
        const x = vpx + ox * r, y = vpy + oy * r + age * age * L.md * 0.4
        const tl = v * 0.03
        sp1.moveTo(x, y); sp1.lineTo(x - ox * tl, y - oy * tl)
      }
      glow(sp1, GOLD, w * 1.3, up * 0.95, HOT)
    }
  }

  // ---------- crew ----------
  function drawHelmet(h, T, col, rim, a, w, fire, sky) {
    const { r, s } = h
    ctx.save()
    ctx.translate(h.x, h.y + Math.sin(T * 0.8 + s) * r * 0.012)
    ctx.rotate(-s * 0.04 + Math.sin(T * 0.6 + s * 2) * 0.012)
    const suit = new Path2D()
    suit.moveTo(-r * 0.78, r * 0.98)
    suit.bezierCurveTo(-r * 1.25, r * 1.02, -r * 1.75, r * 1.12, -r * 1.95, r * 1.8)
    suit.lineTo(-r * 2.05, r * 3); suit.lineTo(r * 2.05, r * 3); suit.lineTo(r * 1.95, r * 1.8)
    suit.bezierCurveTo(r * 1.75, r * 1.12, r * 1.25, r * 1.02, r * 0.78, r * 0.98)
    suit.closePath()
    const dome = new Path2D()
    dome.ellipse(0, -r * 0.02, r * 0.95, r * 1.04, 0, 0, TAU)
    ctx.globalCompositeOperation = 'destination-out'
    ctx.fillStyle = rgba([0, 0, 0], Math.min(1, a * 1.2))
    ctx.fill(suit); ctx.fill(dome)
    ctx.globalCompositeOperation = 'lighter'
    const ln = new Path2D()
    // shoulders, with a seam and the seat harness
    ln.moveTo(-r * 1.95, r * 1.8); ln.bezierCurveTo(-r * 1.75, r * 1.12, -r * 1.25, r * 1.02, -r * 0.78, r * 0.98)
    ln.moveTo(r * 0.78, r * 0.98); ln.bezierCurveTo(r * 1.25, r * 1.02, r * 1.75, r * 1.12, r * 1.95, r * 1.8)
    ln.moveTo(-r * 1.2, r * 1.06); ln.bezierCurveTo(-r * 1.15, r * 1.5, -r * 1.25, r * 1.9, -r * 1.3, r * 2.4)
    ln.moveTo(r * 1.2, r * 1.06); ln.bezierCurveTo(r * 1.15, r * 1.5, r * 1.25, r * 1.9, r * 1.3, r * 2.4)
    // neck ring: two lips
    ln.moveTo(r * 0.8, r * 0.95); ln.ellipse(0, r * 0.95, r * 0.8, r * 0.17, 0, 0, PI)
    ln.moveTo(r * 0.72, r * 0.86); ln.ellipse(0, r * 0.86, r * 0.72, r * 0.14, 0, 0, PI)
    // the shell, and its stripe turned a little toward the window
    ln.addPath(dome)
    ln.moveTo(s * r * 0.08, -r * 1.06); ln.ellipse(s * r * 0.08, -r * 0.02, r * 0.24, r * 1.04, 0, -PI / 2, PI * 0.42, s < 0)
    ln.moveTo(s * r * 0.24, -r * 1.04); ln.ellipse(s * r * 0.24, -r * 0.02, r * 0.3, r * 1.02, 0, -PI / 2, PI * 0.4, s < 0)
    // comm unit and its lead
    const ex = -s * r * 0.95
    ln.moveTo(ex, -r * 0.22); ln.lineTo(ex - s * r * 0.13, -r * 0.18); ln.lineTo(ex - s * r * 0.13, r * 0.22); ln.lineTo(ex, r * 0.27)
    ln.moveTo(ex - s * r * 0.13, r * 0.1); ln.bezierCurveTo(ex - s * r * 0.42, r * 0.38, ex - s * r * 0.25, r * 0.85, ex - s * r * 0.6, r * 1.25)
    glow(ln, col, w, a, mix(col, WHITE, 0.4))
    // the window, reflected small and bent in the shell
    const rx = s * r * 0.36, ry = -r * 0.5, k = r * 0.34, rot = -s * 0.22
    const cr = Math.cos(rot), sr = Math.sin(rot)
    const bend = (U, V) => { const f = 1 - 0.14 * (U * U + V * V), X = U * f * k, Y = V * f * k * 0.62; return [rx + X * cr - Y * sr, ry + X * sr + Y * cr] }
    const refl = new Path2D()
    for (let i = 0; i < L.glass.length; i += 2) {
      const q = L.glass[i], p = bend((q[0] - L.cx) / L.winW * 2, (q[1] - L.wcy) / L.winH * 2)
      if (i === 0) refl.moveTo(p[0], p[1]); else refl.lineTo(p[0], p[1])
    }
    refl.closePath()
    const rc = mix(mix(AMB, GOLD, 0.4), [90, 170, 255], sky)
    const flk = 0.85 + 0.15 * Math.sin(T * 19)
    ctx.fillStyle = rgba(rc, a * (0.08 + 0.2 * fire * flk + 0.12 * sky)); ctx.fill(refl)
    glow(refl, rc, w * 0.75, a * (0.35 + 0.45 * fire + 0.3 * sky), mix(rc, WHITE, 0.5))
    if (sky > 0.05) {
      const hz = new Path2D()
      for (let i = 0; i <= 8; i++) { const U = -1 + i / 4, p = bend(U, 0.44 - 0.12 * (1 - U * U)); if (i === 0) hz.moveTo(p[0], p[1]); else hz.lineTo(p[0], p[1]) }
      glow(hz, ICE, w * 0.7, a * sky * 0.8)
    } else if (fire > 0.05) {
      const st = new Path2D()
      for (let i = 0; i < 5; i++) { const ang = i * 1.3 + Math.floor(T * 12) * 0.7, p0 = bend(Math.cos(ang) * 0.15, Math.sin(ang) * 0.15), p1 = bend(Math.cos(ang) * 0.75, Math.sin(ang) * 0.75); st.moveTo(p0[0], p0[1]); st.lineTo(p1[0], p1[1]) }
      glow(st, GOLD, w * 0.6, a * fire * 0.8)
    }
    // rim light on the side facing the window
    const rim1 = new Path2D()
    rim1.ellipse(0, -r * 0.02, r * 0.95, r * 1.04, 0, s > 0 ? -PI * 0.46 : -PI * 0.54, s > 0 ? -PI * 0.04 : -PI * 0.96, s < 0)
    glow(rim1, rim, w * 1.3, a * (0.45 + fire * 0.7 + sky * 0.2), mix(rim, WHITE, 0.5))
    ctx.restore()
  }

  function drawReadouts(T, A, w, fire) {
    if (!L.ro.length || A <= 0) return
    const [v, al] = readouts(T)
    const vals = [v.toFixed(3), al.toFixed(2)], fr = [v / 7.8, al / 122]
    const vxh = L.valCap / 1.4
    const tint = mix(CYAN, GOLD, fire * 0.35), tintC = mix(ICE, HOT, fire * 0.3)
    for (let s = 0; s < 2; s++) {
      const R = L.ro[s]
      ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = 'rgba(4,6,12,' + (0.74 * A).toFixed(3) + ')'; ctx.fill(R.box); ctx.globalCompositeOperation = 'lighter'
      glow(R.brk, CYAN, w * 0.9, A * 0.75, ICE)
      glow(R.lab.full.line, CYAN, w * 0.75, A * 0.85, ICE)
      glow(R.lab.full.dots, CYAN, w * 1.5, A * 0.7, ICE)
      const vP = prep(setText(vals[s], vxh, R.x + R.pad, R.valBase, { tab: true }))
      const vw = measure(vals[s], vxh, { tab: true })
      glow(vP.full.line, tint, w * 1.0, A, tintC)
      glow(vP.full.dots, tint, w * 2, A, tintC)
      const uP = prep(setText(R.unit, L.labX, R.x + R.pad + vw + L.labX * 0.9, R.valBase))
      glow(uP.full.line, CYAN, w * 0.7, A * 0.6, ICE)
      if (!L.narrow) {
        const n = 20, gx = R.x + R.pad, gw = R.pw - R.pad * 2, lit = Math.round(fr[s] * n)
        const on = new Path2D(), off = new Path2D()
        for (let i = 0; i < n; i++) { const x = gx + gw * i / (n - 1), p = i < lit ? on : off; p.moveTo(x, R.gaugeY); p.lineTo(x, R.gaugeY - (i % 5 === 0 ? 6 : 3.5)) }
        glow(off, COB, w * 0.7, A * 0.3)
        glow(on, tint, w * 0.85, A * 0.8, tintC)
      }
    }
  }

  // ---------- one frame at time T ----------
  function render(T) {
    if (!L) return
    const { W, H, dpr } = L
    ctx = main
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.globalCompositeOperation = 'source-over'
    ctx.globalAlpha = 1
    ctx.clearRect(0, 0, cv.width, cv.height)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'
    const up = ss(0, 0.9, T)
    const I = fireI(T)
    const sky = ss(4.58, 5.05, T)
    const flash = T > 4.56 ? Math.exp(-(T - 4.62) * 13) * ss(4.56, 4.62, T) : 0
    const heat = T < 3.45 ? 0 : T < 4.7 ? ss(3.45, 3.75, T) : 1 - ss(4.75, 6.6, T)
    const flick = 1 + I * 0.25 * (nz(T * 9, 1.3) * 0.7 + nz(T * 23, 4.1) * 0.3)
    const fire = clamp(I * flick * (1 - sky))
    const pre = ss(0.15, 1.0, T) * (1 - ss(1.2, 2.2, T))
    const rest = ss(5.2, 9, T)
    const w = L.wLine

    // shake
    let a = (0.001 + 0.0078 * Math.pow(I, 1.4)) * L.md * ss(0.4, 1.0, T)
    if (T > 4.6) a += L.md * 0.024 * Math.exp(-(T - 4.6) * 6) * ss(4.6, 4.64, T)
    if (T > 5.4) a *= 1 - ss(5.4, 7, T) * 0.9
    const sx = a * (nz(T * 31, 0.3) * 0.6 + nz(T * 13, 2.2) * 0.4)
    const sy = a * (nz(T * 29, 5.1) * 0.6 + nz(T * 11, 7.7) * 0.4) + rest * Math.sin(T * 0.7) * L.md * 0.0016
    const sr = a / L.md * 0.7 * nz(T * 17, 3.3)
    const sway = rest * (0.011 * Math.sin(T * 0.42) + 0.005 * Math.sin(T * 0.23 + 1))
    ctx.save()
    ctx.translate(W / 2 + sx, H / 2 + sy); ctx.rotate(sr); ctx.translate(-W / 2, -H / 2)

    // --- the window ---
    ctx.save()
    ctx.clip(L.glassPath)
    ctx.save()
    const outside = (c) => { c.translate(-sx * 0.4, -sy * 0.4); c.translate(L.wcx, L.wcy); c.rotate(sway); c.translate(-L.wcx, -L.wcy) }
    outside(ctx)
    ctx.globalCompositeOperation = 'lighter'
    const starA = up * 0.7 * (1 - ss(0.9, 1.9, T)) + sky * 0.5
    if (starA > 0.01) {
      const st = new Path2D(), st2 = new Path2D()
      const sn = L.narrow ? 26 : stars.length
      for (let i = 0; i < sn; i++) {
        const S = stars[i]
        const x = L.cx - L.wb + S.x * L.winW, y = L.y0 + S.y * (L.horY - L.y0) * 0.8
        const tw = 0.55 + 0.45 * Math.sin(T * (0.8 + S.b) + S.tw)
        if (S.b > 0.84) { const k = 2 + S.b * 2 * tw; st2.moveTo(x - k, y); st2.lineTo(x + k, y); st2.moveTo(x, y - k); st2.lineTo(x, y + k) } else if (tw > 0.3) { st.moveTo(x, y); st.lineTo(x + 0.05, y) }
      }
      glow(st, ICE, w * 1.4, starA * 0.75)
      glow(st2, ICE, w * 0.7, starA)
    }
    if (sky > 0.01) drawEarth(T, sky, w)
    if (T > 11) {
      // a visitor from another vector game drifts by, now and then
      const per = 41, u = ((T - 11) % per) / 10
      if (u < 1) {
        const k = L.narrow ? 6 : 8.5
        const x = L.cx - L.wb - 20 + u * (L.winW + 40), y = L.horY - L.winH * 0.06 + Math.sin(u * 9) * 3
        const sc = new Path2D()
        const P = [[-0.45, -0.16], [-0.28, -0.46], [0.28, -0.46], [0.45, -0.16], [1, 0.1], [0.5, 0.4], [-0.5, 0.4], [-1, 0.1], [-0.45, -0.16], [0.45, -0.16]]
        P.forEach((q, i) => (i ? sc.lineTo(x + q[0] * k, y + q[1] * k) : sc.moveTo(x + q[0] * k, y + q[1] * k)))
        sc.moveTo(x - k, y + 0.1 * k); sc.lineTo(x + k, y + 0.1 * k)
        glow(sc, [200, 190, 255], w * 0.75, 0.75 * ss(0, 0.06, u) * (1 - ss(0.94, 1, u)), ICE)
      }
    }
    ctx.restore()
    // fire light in the glass
    const fg = up * (pre * 0.3 + I * flick * 0.5) * (1 - sky)
    if (fg > 0.01) {
      const rad = Math.max(L.winW, L.winH) * 0.85
      const gy = lerp(L.y1 + L.winH * 0.15, L.vpy, ss(0.4, 2.6, T))
      const g = ctx.createRadialGradient(L.vpx, gy, 0, L.vpx, gy, rad)
      g.addColorStop(0, rgba([255, 150, 60], fg * 0.7)); g.addColorStop(0.35, rgba([220, 70, 24], fg * 0.32)); g.addColorStop(1, rgba([120, 30, 10], 0))
      ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3)
    }
    drawPlasma(T, I, up)
    // the break: a vector burst
    if (T > 4.6 && T < 5.3) {
      const bp = new Path2D(), u = (T - 4.6) / 0.7
      for (const B of burst) {
        const r1 = L.md * B.v * (0.08 + u * 1.2), r0 = r1 * (1 - B.l)
        bp.moveTo(L.vpx + Math.cos(B.a) * r0, L.vpy + Math.sin(B.a) * r0); bp.lineTo(L.vpx + Math.cos(B.a) * r1, L.vpy + Math.sin(B.a) * r1)
      }
      glow(bp, ICE, w * 1.3, (1 - u) * 1.2, WHITE)
    }
    // an ember now and then, once it is calm: a bright point with a short fading trail
    if (T > 6) {
      const k = Math.floor((T - 6) / 5.5), age = T - 6 - k * 5.5, life = 3.2
      if (age < life) {
        const h1 = hash(k, 3), h2 = hash(k, 9)
        const x0 = L.cx + (h1 - 0.5) * L.winW * 0.7, y0e = L.y1 + 6
        const pt = (t) => [x0 + (h2 - 0.5) * L.winW * 0.25 * t + Math.sin(t * 9 + k) * 5, y0e - (L.y1 - L.y0 + 12) * t]
        const fade = (1 - ss(0.6, 1, age / life)) * ss(0, 0.08, age / life)
        const tr = new Path2D(), hd = pt(age / life)
        for (let j = 1; j <= 3; j++) { const p0 = pt(Math.max(0, age - j * 0.035) / life), p1 = pt(Math.max(0, age - (j - 1) * 0.035) / life); tr.moveTo(p0[0], p0[1]); tr.lineTo(p1[0], p1[1]) }
        glow(tr, AMB, w * 0.8, fade * 0.5, GOLD)
        glow(dotPath([hd]), AMB, w * 2.2, fade * (0.75 + 0.25 * Math.sin(T * 23)), GOLD)
      }
    }
    if (flash > 0.005) { ctx.fillStyle = rgba([176, 216, 255], flash * 0.72); ctx.fillRect(-W, -H, W * 3, H * 3) }
    // glints on the glass
    const gl = new Path2D(), gx = L.cx - L.wt * 0.82, gy = L.y0 + L.winH * 0.1
    gl.moveTo(gx, gy + L.winH * 0.24); gl.lineTo(gx + L.winH * 0.24, gy)
    gl.moveTo(gx + L.winH * 0.06, gy + L.winH * 0.3); gl.lineTo(gx + L.winH * 0.3, gy + L.winH * 0.06)
    glow(gl, mix(ICE, GOLD, fire), w * 0.6, up * (0.1 + fire * 0.2))
    ctx.restore()

    // --- cabin lines ---
    ctx.globalCompositeOperation = 'lighter'
    const cab = mix(COB, AMB, fire * 0.75), cabC = mix(COB_C, GOLD, fire * 0.7)
    const glassC = mix(mix(CYAN, COB, 0.35), AMB, fire * 0.8), glassCC = mix(ICE, HOT, fire * 0.7)
    const tr = ss(0.02, 0.85, T)
    const bright = up * (0.9 + flash * 1.2) * (0.92 + 0.08 * flick)
    if (tr < 1) {
      glow(traced(L.glass, tr), glassC, w * 1.15, bright, glassCC)
      glow(traced(L.frame, ss(0.1, 0.9, T)), cab, w, bright * 0.75, cabC)
      glow(traced(L.well, ss(0.2, 1.0, T)), VIO, w * 0.8, bright * 0.45)
      const cl = L.glass.cl, Lt = cl[cl.length - 1]
      if (tr > 0) glow(dotPath([pointAtLen(L.glass, tr * Lt / 2), pointAtLen(L.glass, Lt - tr * Lt / 2)]), ICE, w * 3, 1.2, WHITE)
    } else {
      glow(L.glassPath, glassC, w * 1.15, bright, glassCC)
      glow(L.frame.path || (L.frame.path = polyPath(L.frame)), cab, w, bright * 0.75, cabC)
      glow(L.well.path || (L.well.path = polyPath(L.well)), VIO, w * 0.8, bright * 0.45)
    }
    const late = ss(0.55, 1.1, T)
    glow(L.bolts, cab, w * 0.8, bright * late * 0.65, cabC)
    glow(L.bevel, VIO, w * 0.8, bright * late * 0.4)
    ctx.save()
    ctx.clip(L.offCopy, 'evenodd')
    glow(L.ribs, VIO, w * 0.75, bright * late * (0.22 + fire * 0.14))
    glow(L.seams, VIO, w * 0.75, bright * late * 0.2)
    for (const h of L.helmets) drawHelmet(h, T, mix(VIO, mix(AMB, [255, 90, 60], 0.3), fire * 0.6), mix(CYAN, GOLD, fire), up * late * 0.9, w * 1.05, fire, sky)
    ctx.restore()
    drawReadouts(T, ss(0.6, 1.2, T) * (0.93 + 0.07 * flick), w, fire)
    ctx.restore()

    // --- the headline, written by the beam ---
    ctx.save()
    ctx.translate(sx * 0.45, sy * 0.45)
    const knock = 0.14 + 0.68 * Math.max(I, T > 4.5 ? 1 - ss(4.72, 4.92, T) : 0) * (1 - sky * 0.4)
    const t1 = ss(0.45, 1.3, T)
    if (t1 > 0) {
      const R = t1 < 1 ? build(L.P1, L.P1.total * t1) : L.P1.full
      const c1 = mix([116, 128, 255], AMB, fire * 0.45), c1c = mix([226, 232, 255], HOT, fire * 0.4)
      const w1 = Math.max(1.1, L.xh1 * 0.1)
      ctx.globalCompositeOperation = 'source-over'
      ctx.strokeStyle = 'rgba(9,7,6,' + knock.toFixed(3) + ')'; ctx.lineWidth = w1 * 5.5; ctx.stroke(R.line); ctx.stroke(R.dots)
      ctx.globalCompositeOperation = 'lighter'
      glow(R.line, c1, w1, 1 + flash, c1c)
      glow(R.dots, c1, w1 * 1.9, 1 + flash, c1c, 0.75)
      ctx.strokeStyle = rgba(c1c, 0.3); ctx.lineWidth = w1 * 1.8; ctx.stroke(R.ends)
      if (!R.done && R.head) glow(dotPath([R.head]), ICE, w1 * 3, 1.3, WHITE)
    }
    // "fast.", forged at the peak, then cooling into phosphor
    const tf = ss(3.48, 3.86, T)
    let RF = null, halo = null, fsx = 0, fsy = 0, wF = 0
    if (tf > 0) {
      RF = tf < 1 ? build(L.PF, L.PF.total * tf) : L.PF.full
      halo = heat > 0.66 ? mix([255, 92, 50], AMB, (heat - 0.66) / 0.34) : heat > 0.33 ? mix([170, 72, 220], [255, 92, 50], (heat - 0.33) / 0.33) : mix([86, 104, 255], [170, 72, 220], heat / 0.33)
      const core = heat > 0.5 ? mix([255, 214, 186], HOT, (heat - 0.5) / 0.5) : mix([222, 232, 255], [255, 214, 186], heat / 0.5)
      const breathe = 1 + 0.05 * Math.sin(T * 1.1) * rest
      const pulse = heat * (0.12 * Math.sin(T * 13) + 0.1 * nz(T * 7, 9))
      wF = Math.max(2, L.xhF * 0.036)
      fsx = a * 0.3 * nz(T * 37, 1.9); fsy = a * 0.3 * nz(T * 33, 6.1)
      ctx.save()
      ctx.translate(fsx, fsy)
      ctx.globalCompositeOperation = 'source-over'
      ctx.strokeStyle = 'rgba(9,7,6,' + Math.min(0.92, knock * 0.9 + heat * 0.2).toFixed(3) + ')'; ctx.lineWidth = wF * (5 + heat * 2); ctx.stroke(RF.line); ctx.lineWidth = wF * 5.5; ctx.stroke(RF.dots)
      ctx.globalCompositeOperation = 'lighter'
      const sp = (1 + heat * 0.5 + flash * 0.5 + pulse) * breathe
      const aF = (1 + heat * 0.25 + flash) * breathe
      glow(RF.line, halo, wF, aF, core, sp)
      glow(RF.dots, halo, wF * 2.2, aF, core, sp * 0.7)
      ctx.strokeStyle = rgba(core, 0.4); ctx.lineWidth = wF * 1.7; ctx.stroke(RF.ends)
      if (!RF.done && RF.head) glow(dotPath([RF.head]), GOLD, wF * 2.6, 1.6, WHITE, 1.3)
      ctx.restore()
      // molten sparks thrown off the writing beam
      if (T > 3.48 && T < 5) {
        const bs = new Path2D(), g = L.md * 1.6
        for (let i = 0; i < NB; i++) {
          const B = beamSparks[i], age = T - (3.48 + B.f * 0.38)
          if (age < 0 || age > B.life) continue
          const p = L.emit[i], v = B.v * L.md * 0.9
          const vx = Math.cos(B.a) * v, vy = Math.sin(B.a) * v
          const x = p[0] + vx * age, y = p[1] + vy * age + 0.5 * g * age * age
          bs.moveTo(x, y); bs.lineTo(x - vx * 0.022, y - (vy + g * age) * 0.022)
        }
        glow(bs, GOLD, Math.max(1.2, wF * 0.4), 1.1, HOT)
      }
    }
    ctx.restore()

    // --- bloom: the soft halo every lit line throws on the tube ---
    const half = (dx, dc, src) => { dx.setTransform(1, 0, 0, 1, 0, 0); dx.globalCompositeOperation = 'copy'; dx.imageSmoothingEnabled = true; dx.imageSmoothingQuality = 'low'; dx.drawImage(src, 0, 0, dc.width, dc.height) }
    let src = cv
    for (const [c, x] of down) { if (c !== src) half(x, c, src); src = c }
    b1x.globalCompositeOperation = 'lighter'
    if (RF && heat > 0.02) {
      // the white-hot letters throw a wide halo of their own
      const k = b1.width / W
      b1x.setTransform(k, 0, 0, k, k * (sx * 0.45 + fsx), k * (sy * 0.45 + fsy))
      b1x.lineCap = 'round'; b1x.lineJoin = 'round'
      b1x.strokeStyle = rgba(halo, 0.3 * heat); b1x.lineWidth = wF * 10; b1x.stroke(RF.line)
      b1x.strokeStyle = rgba(mix(halo, HOT, 0.3), 0.42 * heat); b1x.lineWidth = wF * 4; b1x.stroke(RF.line)
    }
    half(h3x, h3, b1)
    half(b2x, b2, h3)
    b1x.setTransform(1, 0, 0, 1, 0, 0); b1x.globalCompositeOperation = 'lighter'; b1x.imageSmoothingQuality = 'low'
    b1x.drawImage(b2, 0, 0, b1.width, b1.height)
    b1x.globalAlpha = 0.5; b1x.drawImage(b2, 0, 0, b1.width, b1.height); b1x.globalAlpha = 1
    setOp(b1, 0.8 + flash * 0.2)

    // --- behind the lines: the window's dark, then the sky ---
    main.globalCompositeOperation = 'destination-over'
    main.setTransform(dpr, 0, 0, dpr, 0, 0)
    main.save()
    main.translate(W / 2 + sx, H / 2 + sy); main.rotate(sr); main.translate(-W / 2, -H / 2)
    main.clip(L.glassPath)
    if (sky > 0) {
      main.save()
      outside(main)
      const g = main.createLinearGradient(0, L.y0 - 20, 0, L.horY + 10)
      g.addColorStop(0, rgba([8, 14, 58], sky)); g.addColorStop(0.55, rgba([22, 48, 150], sky)); g.addColorStop(0.88, rgba([52, 118, 235], sky)); g.addColorStop(1, rgba([110, 190, 255], sky))
      main.fillStyle = g; main.fillRect(-W * 0.5, L.y0 - 80, W * 2, L.horY - L.y0 + 140)
      main.restore()
    }
    main.fillStyle = '#070505'; main.fillRect(-W, -H, W * 3, H * 3)
    main.restore()
    main.globalCompositeOperation = 'source-over'
    // the cabin's light (CSS layers under the canvas, so only their opacity changes)
    setOp(ambW, up * (0.15 + 0.85 * fire + 0.2 * pre) * (1 - sky))
    setOp(ambC, up * sky * 0.75 + flash)

    // firelight on the subhead's phosphor
    if (T < 6.5 || lastGlow !== 'rest') {
      const gcol = mix([64, 96, 255], [255, 130, 50], fire * 0.85)
      const key = (gcol[0] | 0) + ',' + (gcol[1] | 0)
      if (key !== lastGlow) {
        root.style.setProperty('--hv-glow', rgba(gcol, 0.55 + fire * 0.15))
        root.style.setProperty('--hv-glow2', rgba(mix([43, 59, 255], [201, 90, 30], fire * 0.85), 0.32 + fire * 0.1))
        lastGlow = T >= 6.5 ? 'rest' : key
      }
    }
    // the copy warms up on its own schedule
    root.classList.toggle('hv-on1', reduce || T >= 0.9)
    root.classList.toggle('hv-on2', reduce || T >= 1.2)
  }
  let lastGlow = ''

  // ---------- one clock ----------
  let T = 0, t0 = 0, running = false, onScreen = true, raf = 0, frameN = 0
  const now = () => performance.now() / 1000
  let lastF = 0, checks = 0
  const slow = []
  function tick(stamp) {
    raf = 0
    if (!running) return
    T = now() - t0
    frameN++
    // a few early looks at the frame rate; a crawl means software-emulated GPU canvas
    if (!soft && checks < 4 && lastF && T > 0.3) {
      slow.push(stamp - lastF)
      if (slow.length === 6) { slow.sort((a, b) => a - b); if (slow[3] > 90) goSoft(); slow.length = 0; checks++ }
    }
    lastF = stamp
    if (T < 11 || frameN % 2 === 0) render(T) // at rest, 30 frames a second is plenty
    raf = requestAnimationFrame(tick)
  }
  function setRun() {
    const want = !reduce && onScreen && document.visibilityState !== 'hidden'
    if (want && !running) { running = true; lastF = 0; t0 = now() - T; raf = requestAnimationFrame(tick) } else if (!want && running) { running = false; if (raf) cancelAnimationFrame(raf); raf = 0 }
  }
  function relayout() { layout(); render(reduce ? 10 : T) }
  root.addEventListener('h-seek', (e) => { T = Math.max(0, Number(e.detail) || 0); t0 = now() - T; lastGlow = ''; render(T) })
  if (window.ResizeObserver) { const ro = new ResizeObserver(relayout); ro.observe(root); ro.observe(copyEl) } else window.addEventListener('resize', relayout)
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout)
  if (window.IntersectionObserver) new IntersectionObserver((es) => { onScreen = es[es.length - 1].isIntersecting; setRun() }).observe(root)
  document.addEventListener('visibilitychange', setRun)
  if (mq.addEventListener) mq.addEventListener('change', (e) => { reduce = e.matches; if (reduce) T = 10; relayout(); setRun() })
  if (reduce) T = 10
  relayout()
  setRun()
})()
</script>
