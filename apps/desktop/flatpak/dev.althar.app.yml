# The Flatpak, built from the electron-builder output (`scripts/flatpak.sh`).
# Electron's base brings zypak, which the wrapper runs the app through so
# Chromium's sandbox works inside the Flatpak's own. The window's app_id is
# patched to the Flatpak's id, so the shell ties the window to this entry.
app-id: dev.althar.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: althar
separate-locales: false

# Network, display, GPU, the host keyring and the desktop's tray are available.
# The permission to talk to org.freedesktop.Flatpak is broad: it can run
# commands on the host, which the app uses to reach the person's tools.
# Project folders enter via the document portal; the host bridge is not a
# sandbox boundary.
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # X11 clients need shared memory; without it fallback-x11 is slow and some drawing breaks (Flathub's Electron sample keeps it too).
  - --share=ipc
  - --device=dri
  # Flatpak's default xdg-desktop-portal proxy exposes org.freedesktop.portal.Secret
  # without a talk-name grant; Althar uses its per-app key on every desktop.
  # This permission is only for the safe synchronous keyring fallback when the
  # portal is absent: it seals with the keyring's own key (Chromium's v11) and
  # refuses the fixed-key v10; that seal may need replacing at the next restart.
  - --talk-name=org.freedesktop.secrets
  # The edge's tray icon: Electron asks the desktop's StatusNotifierWatcher to
  # show it, and without this talk permission the sandbox cannot see the
  # watcher, so the tray silently does not appear. Under Flatpak Electron
  # registers the item under its own unique bus name, so no own-name
  # permission is needed.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The person's own agents and editors, found and run where they are
  # installed (Codex among them: flatpak/codex-host.sh); nothing else.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: althar
    buildsystem: simple
    # flatpak-builder rewrites every ELF file it finds, stripping it and
    # extracting debug info (eu-strip). A Bun-compiled executable keeps its
    # JavaScript payload in a trailer at the very end of the file, which the
    # rewrite drops: Claude Code's bundled `claude` (the Agent SDK's native
    # binary) would run as plain `bun`, so sign-in and sessions fail. Leave
    # the app's binaries exactly as electron-builder made them.
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - mkdir -p /app/main /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo
      - cp -a . /app/main
      # The window's app_id/WM_CLASS should be the Flatpak's id, so window association works.
      - sed -i 's/althar\.desktop/dev.althar.app.desktop/' /app/main/resources/app/package.json
      - install -Dm755 althar.sh /app/bin/althar
      - install -Dm644 dev.althar.app.desktop /app/share/applications/dev.althar.app.desktop
      - install -Dm644 cobalt.png /app/share/icons/hicolor/512x512/apps/dev.althar.app.png
      - install -Dm644 dev.althar.app.metainfo.xml /app/share/metainfo/dev.althar.app.metainfo.xml
      # git from the SDK: the runtime has none, and Althar and its agents run it in the sandbox.
      - install -Dm755 /usr/bin/git /app/libexec/althar/git
      - cp -a /usr/libexec/git-core /app/libexec/git-core
      - mkdir -p /app/share/git-core
      - cp -a /usr/share/git-core/templates /app/share/git-core/templates
      - install -Dm755 git.sh /app/bin/git
      # The Codex the adapter drives, out where its own sandbox can run (flatpak/codex-host.sh).
      - install -Dm755 codex-host.sh /app/bin/althar-host-codex
    sources:
      - type: dir
        path: ../out/dist/linux-unpacked
      - type: file
        path: althar.sh
      - type: file
        path: git.sh
      - type: file
        path: codex-host.sh
      - type: file
        path: dev.althar.app.desktop
      - type: file
        path: dev.althar.app.metainfo.xml
      - type: file
        path: ../resources/icons/cobalt.png
