# The Flatpak, built from the electron-builder output (`scripts/flatpak.sh`).
# Electron's base brings zypak, which the wrapper runs the app through so
# Chromium's sandbox works inside the Flatpak's own. The window's app_id is
# patched to the Flatpak's id, so the shell ties the window to this entry.
app-id: dev.althar.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: althar
separate-locales: false

# Narrow on purpose: the agents need the network, the window needs a display
# and the GPU, and sign-ins need the host's keyring through the secrets
# service. No host filesystem: project folders reach the app through the
# file chooser's document portal.
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets

modules:
  - name: althar
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo
      - cp -a . /app/main
      # The window's app_id/WM_CLASS should be the Flatpak's id, so window association works.
      - sed -i 's/althar\.desktop/dev.althar.app.desktop/' /app/main/resources/app/package.json
      - install -Dm755 althar.sh /app/bin/althar
      - install -Dm644 dev.althar.app.desktop /app/share/applications/dev.althar.app.desktop
      - install -Dm644 cobalt.png /app/share/icons/hicolor/512x512/apps/dev.althar.app.png
      - install -Dm644 dev.althar.app.metainfo.xml /app/share/metainfo/dev.althar.app.metainfo.xml
    sources:
      - type: dir
        path: ../out/dist/linux-unpacked
      - type: file
        path: althar.sh
      - type: file
        path: dev.althar.app.desktop
      - type: file
        path: dev.althar.app.metainfo.xml
      - type: file
        path: ../resources/icons/cobalt.png
