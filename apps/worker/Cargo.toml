[package]
name = "althar-worker"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
prost = "=0.14.6"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-stream = "=0.1.19"
tonic = { version = "=0.14.9", default-features = false, features = ["channel", "codegen", "tls-ring"] }
tonic-prost = "=0.14.9"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[build-dependencies]
prost-build = "=0.14.6"
protoc-bin-vendored = "=3.3.0"
tonic-prost-build = "=0.14.9"
