[package]
name = "althar-worker"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
prost = "=0.14.6"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-stream = "=0.1.19"
tonic = { version = "=0.14.9", default-features = false, features = ["channel", "codegen", "tls-ring"] }
tonic-prost = "=0.14.9"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = { version = "=0.5.3", features = ["util"] }

[build-dependencies]
prost-build = "=0.14.6"
protoc-bin-vendored = "=3.3.0"
tonic-prost-build = "=0.14.9"
