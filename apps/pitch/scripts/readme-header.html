<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>readme header</title>
<style>
  @font-face { font-family: Inter; src: url(../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Mono; src: url(../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2) format('woff2'); font-weight: 100 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 400px; overflow: hidden; }
  body { background: #2b3bff; color: #f4f2ec; font-family: Inter; position: relative; padding: 36px 60px; }
  .top { display: flex; justify-content: space-between; align-items: center; font: 500 17px Mono; letter-spacing: .03em; text-transform: uppercase; }
  .top span { display: flex; align-items: center; gap: 8px; }
  .top svg { width: 31px; height: 31px; margin: -4px 0; fill: #f4f2ec; }
  h1 { margin-top: 22px; font-size: 40px; line-height: 1.1; letter-spacing: -.045em; font-weight: 700; }
  h1 span { display: block; }
  h1 .dim { color: rgba(244, 242, 236, .5); }
  .mark { position: absolute; left: 50px; bottom: 0; font-size: 250px; font-weight: 800; letter-spacing: -.048em; line-height: 1; transform: translateY(.2em); white-space: nowrap; }
</style>
<body>
  <!-- The mark on cobalt drops its point: the bore shows the ground, as on the favicon. -->
  <p class="top"><span><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12.42 5.53A15.36 15.36 0 0 0 19.89 18.47L19.47 19.2A15.36 15.36 0 0 0 4.53 19.2L4.11 18.47A15.36 15.36 0 0 0 11.58 5.53ZM10.2 14.4a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0-3.6 0Z"/></svg>Charrette</span><span>The open project layer for agents</span></p>
  <h1><span>The project should persist.</span><span class="dim">The agents should not have to.</span></h1>
  <p class="mark">Charrette</p>
</body>
</html>
