syntax = "proto3";

package althar.worker.v1;

// The worker initiates the stream. Authentication belongs to the transport;
// a worker ID in a message is only a claim to check against that identity.
service WorkerControlService {
  rpc Connect(stream WorkerFrame) returns (stream HomeFrame);
  rpc RunAgent(stream AgentWorkerFrame) returns (stream AgentHomeFrame);
  rpc AgentTools(stream AgentToolsRequest) returns (stream AgentToolsResponse);
  rpc AgentPreview(stream AgentPreviewRequest) returns (stream AgentPreviewResponse);
}

// Separate from the diagnostic exchange. One stream advertises one agent
// execution slot. A started slot is never reattached or reassigned.
message AgentWorkerFrame {
  oneof payload {
    AgentWorkerHello hello = 1;
    AgentRunReady ready = 2;
    AgentRunBytes output = 3;
    AgentRunExit exit = 4;
    AgentWorkerHeartbeat heartbeat = 5;
    AgentSnapshotResult snapshot = 6;
    AgentRunBytes patch = 7;
    AgentRunBytes commits = 8;
    AgentManagedRef managed_ready = 9;
    AgentManagedOutput managed_output = 10;
    AgentManagedExit managed_exit = 11;
    AgentFileResult file_result = 12;
    AgentFileChunk file_chunk = 13;
    AgentRunBytes index_patch = 14;
  }
}

message AgentHomeFrame {
  oneof payload {
    AgentHomeHello hello = 1;
    AgentRunStart start = 2;
    AgentRunBytes input = 3;
    AgentRunStop stop = 4;
    AgentWorkerHeartbeat heartbeat = 5;
    AgentRunReconcile reconcile = 6;
    AgentRunBytes checkout = 7;
    AgentSnapshotRequest snapshot = 8;
    AgentRunBytes setup_chunk = 9;
    AgentManagedStart managed_start = 10;
    AgentManagedRef managed_stop = 11;
    AgentPreviewOpen preview_open = 12;
    AgentHelperStart helper_start = 13;
    AgentManagedInput helper_input = 14;
    AgentRunBytes skills_chunk = 15;
    AgentManagedInput helper_skills_chunk = 16;
    AgentManagedInput helper_checkout_chunk = 17;
    AgentFileRequest file_request = 18;
  }
}

message AgentWorkerHello {
  string worker_id = 1;
  uint32 version = 2;
  repeated AgentWorkerCapability capabilities = 3;
  string journal_id = 4;
}

// A worker can only start a provider that its operator enabled for the project.
message AgentWorkerCapability {
  string project_id = 1;
  string provider_id = 2;
  bool workspace_setup = 3;
  bool managed_commands = 4;
  bool managed_preview = 5;
  bool workspace_sets = 6;
  bool helper_agents = 7;
  bool skill_files = 8;
  bool helper_skill_files = 9;
  bool helper_checkouts = 10;
  bool file_reads = 11;
  bool workspace_index = 12;
}

message AgentHomeHello {
  string home_id = 1;
  string worker_id = 2;
  uint32 version = 3;
  uint32 lease_ms = 4;
}

// Provider executable, provider arguments, and account credentials stay on the worker.
message AgentRunStart {
  string run_id = 1;
  string project_id = 2;
  string provider_id = 3;
  string workspace_id = 4;
  AgentWorkspaceSource source = 5;
  bool tools = 6;
  // The home's saved project setup, run from the staged task checkout.
  AgentWorkspaceSetupSource setup = 7;
  // Multi-repository tasks send the listed bundles in order. The primary
  // repository's ID is workspace_id. A single source and a set are exclusive.
  repeated AgentWorkspaceRepository repositories = 8;
  AgentWorkspaceSetupSource skills = 9;
}

message AgentWorkspaceRepository {
  string workspace_id = 1;
  string directory = 2;
  AgentWorkspaceSource source = 3;
}

message AgentWorkspaceSetupSource {
  uint32 size = 1;
  bytes sha256 = 2;
}

message AgentSkillFiles {
  repeated AgentSkillFile files = 1;
}

message AgentSkillFile {
  string path = 1;
  bytes data = 2;
  bool executable = 3;
}

message AgentWorkspaceSetup {
  // The repository's relative project folder, or empty for its root.
  string directory = 1;
  repeated string commands = 2;
  repeated AgentRepositorySetup repositories = 3;
}

message AgentRepositorySetup {
  string workspace_id = 1;
  string directory = 2;
  repeated string commands = 3;
}

// A single Git bundle with one scoped snapshot ref, staged before launch.
message AgentWorkspaceSource {
  uint32 size = 1;
  bytes sha256 = 2;
  string head = 3;
}

message AgentRunReady {
  string run_id = 1;
  // The canonical absolute path of the leased workspace on the worker.
  string workspace_path = 2;
  uint32 tools_port = 3;
  AgentWorkspaceSetupResult setup = 4;
  string skills_path = 5;
  repeated AgentWorkerMcpCommand mcp_commands = 6;
}

// A tool registered by name on the execution worker for this project.
// Command arguments and credentials are provisioned on that worker.
message AgentWorkerMcpCommand {
  string name = 1;
  string executable = 2;
}

message AgentWorkspaceSetupResult {
  uint32 exit_code = 1;
  bool timed_out = 2;
  // A bounded tail of the command output, kept with the home’s setup record.
  bytes output_tail = 3;
  repeated AgentRepositorySetupResult repositories = 4;
}

message AgentRepositorySetupResult {
  string workspace_id = 1;
  uint32 exit_code = 2;
  bool timed_out = 3;
  bytes output_tail = 4;
}

// Managed commands share the assigned task checkout. They have their own
// process group and output stream and end when its workspace lease ends.
message AgentManagedRef {
  string run_id = 1;
  string command_id = 2;
}

message AgentManagedStart {
  AgentManagedRef managed = 1;
  string directory = 2;
  string command = 3;
}

message AgentManagedOutput {
  AgentManagedRef managed = 1;
  bytes data = 2;
}

message AgentHelperStart {
  AgentManagedRef managed = 1;
  string directory = 2;
  string provider_id = 3;
  AgentWorkspaceSetupSource skills = 4;
  AgentWorkspaceSource checkout = 5;
}

message AgentManagedInput {
  AgentManagedRef managed = 1;
  bytes data = 2;
}

message AgentManagedExit {
  AgentManagedRef managed = 1;
  AgentRunOutcome outcome = 2;
  optional uint32 exit_code = 3;
}

message AgentPreviewOpen {
  AgentManagedRef managed = 1;
  string tunnel_id = 2;
  uint32 port = 3;
}

message AgentPreviewRequest {
  oneof payload {
    string tunnel_id = 1;
    bytes data = 2;
  }
}

message AgentPreviewResponse {
  bytes data = 1;
}

message AgentRunBytes {
  string run_id = 1;
  bytes data = 2;
}

message AgentRunStop {
  string run_id = 1;
}

message AgentRunReconcile {
  string run_id = 1;
  string workspace_id = 2;
}

message AgentRunExit {
  string run_id = 1;
  AgentRunOutcome outcome = 2;
  // Present only for a confirmed process exit with an exit code.
  optional uint32 exit_code = 3;
}

enum AgentRunOutcome {
  AGENT_RUN_OUTCOME_UNSPECIFIED = 0;
  AGENT_RUN_OUTCOME_EXITED = 1;
  AGENT_RUN_OUTCOME_STOPPED = 2;
  AGENT_RUN_OUTCOME_START_FAILED = 3;
  AGENT_RUN_OUTCOME_UNCONFIRMED = 4;
}

message AgentWorkerHeartbeat {
  uint32 sequence = 1;
}

message AgentFileRef {
  string run_id = 1;
  string file_id = 2;
}

message AgentFileRequest {
  AgentFileRef file = 1;
  string workspace_id = 2;
  string relative_path = 3;
}

message AgentFileResult {
  AgentFileRef file = 1;
  bool unavailable = 2;
  uint32 size = 3;
  bytes sha256 = 4;
}

message AgentFileChunk {
  AgentFileRef file = 1;
  bytes data = 2;
}

message AgentSnapshotRequest {
  string run_id = 1;
  string base_tree = 2;
  string base_head = 3;
  // Either the task repository ID or an active helper's scoped command ID.
  string workspace_id = 4;
  bool capture_index = 5;
}

// A Git binary patch against the requested tree. The home verifies its own
// workspace before applying it. Failure leaves the worker checkout in place.
message AgentSnapshotResult {
  string run_id = 1;
  string tree = 2;
  uint32 size = 3;
  bytes sha256 = 4;
  bool unavailable = 5;
  string head = 6;
  uint32 commits_size = 7;
  bytes commits_sha256 = 8;
  string workspace_id = 9;
  AgentSnapshotIndex index = 10;
}

message AgentSnapshotIndex {
  string tree = 1;
  uint32 size = 2;
  bytes sha256 = 3;
}

// A connection to just the home tool server for this active run. Tool
// authority still travels in the request's session-specific bearer token.
message AgentToolsRequest {
  oneof payload {
    string run_id = 1;
    bytes data = 2;
  }
}

message AgentToolsResponse {
  bytes data = 1;
}

message WorkerFrame {
  oneof payload {
    WorkerHello hello = 1;
    DiagnosticClaim diagnostic_claim = 2;
    DiagnosticResult diagnostic_result = 3;
    DiagnosticRenew diagnostic_renew = 4;
    DiagnosticLog diagnostic_log = 5;
  }
}

message HomeFrame {
  oneof payload {
    HomeHello hello = 1;
    DiagnosticOffer diagnostic_offer = 2;
    DiagnosticStart diagnostic_start = 3;
    DiagnosticLease diagnostic_lease = 4;
  }
}

// The first worker frame declares an inclusive range of supported versions.
// Both endpoints reject zero, inverted ranges and unsupported selections.
message WorkerHello {
  string worker_id = 1;
  uint32 min_version = 2;
  uint32 max_version = 3;
  bool accepts_diagnostics = 4;
  bool renews_diagnostic_lease = 5;
  bool streams_diagnostic_logs = 6;
  bool accepts_project_commands = 7;
}

// The first home frame binds this stream to one authenticated, negotiated session.
message HomeHello {
  string home_id = 1;
  string worker_id = 2;
  string session_id = 3;
  uint32 version = 4;
  bool supports_diagnostics = 5;
  bool supports_diagnostic_lease_renewal = 6;
  bool supports_diagnostic_logs = 7;
  bool supports_project_commands = 8;
}

// A lease of zero requests reconciliation without granting a new start.
message DiagnosticOffer {
  string attempt_id = 1;
  string fence = 2;
  uint32 claimable_for_ms = 3;
  ProjectCommand project_command = 4;
}

// The worker operator resolves this reference locally. No paths or argv are sent.
message ProjectCommand {
  string project_id = 1;
  string command_name = 2;
}

message DiagnosticClaim {
  string attempt_id = 1;
  string fence = 2;
}

// A home persists the claim before sending this once. Zero means reconcile.
message DiagnosticStart {
  string attempt_id = 1;
  string fence = 2;
  uint32 run_for_ms = 3;
}

enum DiagnosticOutcome {
  DIAGNOSTIC_OUTCOME_UNSPECIFIED = 0;
  DIAGNOSTIC_OUTCOME_SUCCEEDED = 1;
  DIAGNOSTIC_OUTCOME_FAILED = 2;
  DIAGNOSTIC_OUTCOME_UNKNOWN = 3;
  DIAGNOSTIC_OUTCOME_CANCELLED = 4;
}

message DiagnosticResult {
  string attempt_id = 1;
  string fence = 2;
  DiagnosticOutcome outcome = 3;
  bytes output = 4;
}

// Available only when both peers negotiate renewal. Sequence starts at one.
// A request is only valid on the stream that received the original start.
message DiagnosticRenew {
  string attempt_id = 1;
  string fence = 2;
  uint32 sequence = 3;
}

// A renewal confirms the current authority and never authorizes another start.
// A zero grant requests cancellation only for a negotiated project command.
message DiagnosticLease {
  string attempt_id = 1;
  string fence = 2;
  uint32 sequence = 3;
  uint32 run_for_ms = 4;
}

// Raw stdout, emitted before the result on the claiming stream. Offsets are
// contiguous byte offsets from zero, independent of character encoding.
message DiagnosticLog {
  string attempt_id = 1;
  string fence = 2;
  uint32 offset = 3;
  bytes output = 4;
}
