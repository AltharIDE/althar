name: Quarantined tests
description: >-
  Reads which tests are quarantined: those with an open issue labelled flaky that CI filed (packages/testing/src/quarantine.ts).
  For the rest of the job such a test still runs, but when it fails, on its retry too, it doesn't fail the job; the Flaky
  tests step (.github/actions/flaky) puts the failure on its issue and lists it in the job's summary. A quarantine lasts a
  week, or until its test fails on its retry twice in a day; once it has lapsed, the test is skipped for the rest of the
  job (Vitest's by the shared setup, Playwright's with --grep-invert of QUARANTINE_SKIPPED, which this sets) and listed on
  the job's summary, and it runs only at night, where it gates. Every other test gates as before, and a test whose issue
  is closed gates again. Use it as a step before a job's tests, after Bun is set up. If the issues can't be read, nothing
  is quarantined or skipped, and it says so; it never fails the job.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: bun "$GITHUB_WORKSPACE/packages/testing/src/quarantine.ts" read
