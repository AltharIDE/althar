name: Flaky tests
description: >-
  Files the tests this job found flaky (they failed, then passed on their retry; packages/testing) as GitHub issues
  labelled flaky, one per test. Use it as a job's last step, with `if: always()`, in a job whose env sets FLAKY_REPORT
  and whose permissions include `issues: write`.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: bun "$GITHUB_WORKSPACE/packages/testing/src/report.ts"
