name: Flaky tests
description: >-
  Files the tests this job found flaky (they failed, then passed on their retry; packages/testing) as GitHub issues
  labelled flaky, one per test, and puts each quarantined test that failed (.github/actions/flaky/quarantine) on its
  issue, listing them in the job's summary. Use it as a job's last step, with `if: always()`, in a job whose env sets
  FLAKY_REPORT and whose permissions include `issues: write`.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: bun "$GITHUB_WORKSPACE/packages/testing/src/report.ts"
    # Reusable workflows can each have a job named verify in the same run.
    - id: timings
      if: ${{ always() && hashFiles('test-results/timings.jsonl') != '' }}
      shell: bash
      run: echo "name=test-timings-$(bun -e 'process.stdout.write(crypto.randomUUID())')" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v6
      if: ${{ always() && steps.timings.outputs.name != '' }}
      continue-on-error: true
      with:
        name: ${{ steps.timings.outputs.name }}
        path: test-results/timings.jsonl
        if-no-files-found: ignore
        retention-days: 7
