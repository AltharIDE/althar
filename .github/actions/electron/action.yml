name: Electron
description: >-
  Installs the workspace and prepares Electron: restores Electron and electron-builder caches, keyed by the exact versions the
  lockfile resolves them to and the runner's OS and arch, under the OS's own cache paths (Linux ~/.cache, macOS ~/Library/Caches,
  Windows ~/AppData/Local), installs with `bun install` from the repository root without downloading Electron's binary, then
  fetches that binary with retry backoff before a build or test that runs it. Electron is a trusted dependency whose binary would
  otherwise download during install; skipping it there and fetching explicitly means one bad minute on GitHub's releases doesn't fail
  the install, and the cache below is restored before either fetches. Replaces the `bun install --frozen-lockfile` step in any job
  that installs the workspace. With `binary: false`, where the job never runs Electron, it only installs without downloading the binary.
inputs:
  binary:
    description: Whether to restore Electron's caches and fetch its binary after installing.
    default: 'true'
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "TEST_TIMINGS=$GITHUB_WORKSPACE/test-results/timings.jsonl" >> "$GITHUB_ENV"
    # A fresh directory with an exact key avoids carrying old lockfiles' packages
    # forward forever. Post-merge's manual input can compare it with off/legacy.
    - shell: bash
      if: runner.os == 'Windows'
      env:
        MODE: ${{ env.BUN_CACHE_MODE || 'isolated' }}
      run: |
        case "$MODE" in
          isolated|off) echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/althar-bun-cache" >> "$GITHUB_ENV" ;;
          legacy) ;;
          *) echo "::error::Unknown Bun cache mode: $MODE"; exit 1 ;;
        esac
        echo "BUN_CACHE_MODE=$MODE" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      if: runner.os == 'Windows' && env.BUN_CACHE_MODE == 'isolated'
      with:
        path: ${{ runner.temp }}/althar-bun-cache
        key: bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock') }}
    - uses: actions/cache@v4
      if: runner.os == 'Windows' && env.BUN_CACHE_MODE == 'legacy'
      with:
        path: ~/.bun/install/cache
        key: windows-bun-${{ hashFiles('bun.lock') }}
        restore-keys: windows-bun-
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        ELECTRON_VERSION="$(grep -oE '"electron": \["electron@[^"]+' bun.lock | head -n 1 | sed 's/.*electron@//')"
        BUILDER_VERSION="$(grep -oE '"electron-builder": \["electron-builder@[^"]+' bun.lock | head -n 1 | sed 's/.*electron-builder@//')"
        if [ -z "$ELECTRON_VERSION" ] || [ -z "$BUILDER_VERSION" ]; then
          echo "::error::Couldn't read the locked Electron and builder versions from bun.lock."
          exit 1
        fi
        echo "ELECTRON_VERSION=$ELECTRON_VERSION" >> "$GITHUB_ENV"
        echo "BUILDER_VERSION=$BUILDER_VERSION" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      if: runner.os == 'Linux' && inputs.binary == 'true'
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ env.ELECTRON_VERSION }}-builder-${{ env.BUILDER_VERSION }}
    - uses: actions/cache@v4
      if: runner.os == 'macOS' && inputs.binary == 'true'
      with:
        path: |
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ env.ELECTRON_VERSION }}-builder-${{ env.BUILDER_VERSION }}
    - uses: actions/cache@v4
      if: runner.os == 'Windows' && inputs.binary == 'true'
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ env.ELECTRON_VERSION }}-builder-${{ env.BUILDER_VERSION }}
    - shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      run: |
        install_started=$(date +%s)
        bun install --frozen-lockfile
        install_elapsed=$(( $(date +%s) - install_started ))
        echo "Bun install: ${install_elapsed}s; cache mode: ${BUN_CACHE_MODE:-none} (${RUNNER_OS})." >> "$GITHUB_STEP_SUMMARY"
    - shell: bash
      if: ${{ inputs.binary == 'true' }}
      working-directory: ${{ github.workspace }}
      run: |
        installer="$(node -p 'require.resolve("electron/install.js", { paths: [process.cwd() + "/apps/desktop"] })')"
        for wait in 5 15 45 0; do
          node "$installer" && exit 0
          [ "$wait" = 0 ] || { echo "Electron's download failed: trying again in ${wait}s"; sleep "$wait"; }
        done
        exit 1
