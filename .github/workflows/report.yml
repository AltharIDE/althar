name: report

on:
  # From queue.yml, for a pull request in the merge queue.
  workflow_call:
  push:
    branches: [main]
    paths: ['apps/report/**', 'package.json', 'bun.lock', 'vite.config.ts', '.github/workflows/report.yml']
  pull_request:
    paths: ['apps/report/**', 'package.json', 'bun.lock', 'vite.config.ts', '.github/workflows/report.yml']

permissions:
  contents: read

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/report
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run verify
