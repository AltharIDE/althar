name: report

on:
  # From queue.yml, for a pull request in the merge queue.
  workflow_call:
  push:
    branches: [main]
    paths: ['apps/report/**', 'package.json', 'bun.lock', 'vite.config.ts', 'packages/testing/**', '.github/actions/flaky/**', '.github/workflows/report.yml']
  pull_request:
    paths: ['apps/report/**', 'package.json', 'bun.lock', 'vite.config.ts', 'packages/testing/**', '.github/actions/flaky/**', '.github/workflows/report.yml']

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/report
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run verify
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky
