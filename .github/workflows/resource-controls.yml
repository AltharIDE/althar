name: resource controls

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/provider-adapters/src/process*'
      - 'packages/provider-adapters/src/resourceGroups.ts'
      - 'packages/provider-adapters/src/keeper.ts'
      - 'packages/provider-adapters/tests/resource*'
      - '.github/workflows/resource-controls.yml'

permissions:
  contents: read

concurrency:
  group: resource-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Prepare a private Linux delegation
        if: runner.os == 'Linux'
        run: |
          root="/sys/fs/cgroup/althar-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo '+cpu' | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          sudo mkdir "$root"
          echo '+cpu' | sudo tee "$root/cgroup.subtree_control" >/dev/null
          sudo mkdir "$root/control"
          sudo chown "$(id -u):$(id -g)" "$root" "$root/cgroup.procs" "$root/cgroup.subtree_control"
          echo "ALTHAR_TEST_CGROUP_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify native scheduling and fallback
        working-directory: packages/provider-adapters
        run: |
          if [ -n "${ALTHAR_TEST_CGROUP_ROOT:-}" ]; then
            echo "$$" | sudo tee "$ALTHAR_TEST_CGROUP_ROOT/control/cgroup.procs" >/dev/null
          fi
          bun run test tests/resourceGroups.test.ts tests/resourceScheduling.test.ts tests/process.test.ts tests/processTrees.test.ts tests/keeper.test.ts --maxWorkers=1
      - name: Measure CPU sharing with competing process families
        if: runner.os == 'Linux'
        run: |
          echo "$$" | sudo tee "$ALTHAR_TEST_CGROUP_ROOT/control/cgroup.procs" >/dev/null
          bun packages/provider-adapters/scripts/measureResources.ts
      - name: Verify native host pressure observations
        working-directory: packages/runtime
        run: bun run test tests/resourcePressure.test.ts --maxWorkers=1
      - name: Remove the private Linux delegation
        if: always() && runner.os == 'Linux'
        run: |
          if [ -n "${ALTHAR_TEST_CGROUP_ROOT:-}" ]; then
            echo '1' | sudo tee "$ALTHAR_TEST_CGROUP_ROOT/cgroup.kill" >/dev/null
            sudo rmdir "$ALTHAR_TEST_CGROUP_ROOT/control" "$ALTHAR_TEST_CGROUP_ROOT"
          fi
