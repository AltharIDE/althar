name: pitch

on:
  push:
    branches: [main]
    paths: ['apps/pitch/**', 'package.json', 'bun.lock', 'vite.config.ts', '.github/workflows/pitch.yml']
  pull_request:
    paths: ['apps/pitch/**', 'package.json', 'bun.lock', 'vite.config.ts', '.github/workflows/pitch.yml']

permissions:
  contents: read

concurrency:
  group: pitch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pitch
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      - run: bun run test:coverage
      - run: bun run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/pitch/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: pitch
          path: apps/pitch/dist
          retention-days: 7
