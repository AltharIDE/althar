name: e2e

# The desktop app's end-to-end run: the built app, with the fake agent, in four parts by file, each on a machine of its
# own (about seven minutes each, against twenty-five as one). desktop.yml runs it for a change that reaches the app, on
# the pull request, so a change that breaks a spec fails there, and again in the merge queue, on main as it will be;
# post-merge.yml once more, for the release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

jobs:
  e2e:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # A few times a part's usual run, so a hang fails here, not at the limit.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      # Electron's binary comes from GitHub's releases the first time the app is run, and a 502 or 504 from them failed
      # a whole part. Kept between runs, by the lockfile that names its version, and fetched before the tests, again
      # after a failure, so a bad minute on GitHub's side is waited out here.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: linux-electron-${{ hashFiles('bun.lock') }}
          restore-keys: linux-electron-
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: |
          for wait in 5 15 45 0; do
            node node_modules/electron/install.js && exit 0
            [ "$wait" = 0 ] || { echo "Electron's download failed: trying again in ${wait}s"; sleep "$wait"; }
          done
          exit 1
      # Ubuntu 24.04 keeps unprivileged user namespaces from apps, and Chromium's sandbox needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The end-to-end tests run the built app, with the fake agent, on a virtual display, with a keyring:
      # a runner's desktop isn't one Electron recognises, so it would fall back to plain text, which Althar
      # refuses; the main process asks for libsecret (keyring.ts), and gnome-keyring answers.
      - run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - env:
          SHARD: ${{ matrix.shard }}
        run: dbus-run-session -- bash -c 'printf "althar\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1; xvfb-run --auto-servernum bun run test:e2e --shard="$SHARD"'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: desktop-e2e-${{ strategy.job-index }}
          path: apps/desktop/test-results
          retention-days: 7
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky
