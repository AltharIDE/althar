name: host-release

# A separate tag/feed from the desktop. All assets remain in a draft until a
# person publishes; this workflow never changes GitHub's desktop latest release.
# A tag host-v<version> is cut on main, or for a patch on its release branch
# (release/host-0.2 for 0.2.3) once it has one: DEVELOPMENT.md ("Release
# branches"). Homes take the newest host version, so an older line's patch
# never replaces a newer line.
on:
  push:
    tags: ['host-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    # The wait for post-merge and host (wait-for-runs.py, two hours), and the checks before it.
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.what.outputs.version }}
      tag: ${{ steps.what.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: what
        name: Check version, main, release notes and validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/host/package.json)"
          tag="host-v$version"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Only stable host versions may be released.'
            exit 1
          fi
          # A version's patches come from its release branch (release/host-0.2 for 0.2.3) once it has one; until then,
          # and for a new minor or major, from main.
          branch="release/host-${version%.*}"
          from=main
          if git rev-parse -q --verify "refs/remotes/origin/$branch" >/dev/null; then from="$branch"; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "$tag"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$from"; then
              echo "::error::$tag is on a commit that isn't on $from. Host $version is cut from $from."
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != "refs/heads/$from" ]; then
              echo "::error::Run this by hand from $from: host $version is cut from there."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo '::error::This version is tagged already. Re-run its tag workflow or raise the version.'
              exit 1
            fi
          fi
          test -s "apps/host/release-notes/$version.md"
          if gh release view "$tag" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            echo '::error::A release already exists for this version. Never replace signed assets; use a new version.'
            exit 1
          fi
          # A tag may be pushed while these are still running on its commit, so they are waited for.
          python3 .github/scripts/wait-for-runs.py post-merge.yml host.yml \
            --error '{workflow} has not passed on this exact commit. Complete validation before releasing.'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Its worker's parts are compressed with zstd at level 19, a few minutes each.
    timeout-minutes: 45
    environment: release
    defaults:
      run:
        working-directory: apps/host
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
        with:
          binary: 'false'
      - run: bun run check
      - run: bun run test --maxWorkers=1
      # A worker installs from a release of its own, signed beside the home's; the home's carries the native worker too,
      # for workers installed from it before they had their own, until they move (apps/host/src/workerSetup.ts update).
      - name: Build the native worker
        working-directory: .
        run: |
          rustup show
          cargo build --locked --release -p althar-worker
      # Its agents' sandbox needs bubblewrap, socat and ripgrep: Codex's own package carries bubblewrap and ripgrep, built
      # static; socat is built static here, from its pinned source.
      - name: Build what the worker's sandbox needs beside Codex's package
        working-directory: .
        run: apps/host/scripts/worker-sandbox-tools.sh "$RUNNER_TEMP/worker-tools"
      # Built again with the public ids of Althar's own apps (vite.config.ts), repository variables since none is a secret:
      # a home's window offers GitHub's and GitLab's sign-in by a code typed in any browser. The tests above ran without them.
      - name: Build with Althar's app ids
        env:
          ALTHAR_GITHUB_CLIENT_ID: ${{ vars.ALTHAR_GITHUB_CLIENT_ID }}
          ALTHAR_GITHUB_APP: ${{ vars.ALTHAR_GITHUB_APP }}
          ALTHAR_GITLAB_CLIENT_ID: ${{ vars.ALTHAR_GITLAB_CLIENT_ID }}
          ALTHAR_COPILOT_CLIENT_ID: ${{ vars.ALTHAR_COPILOT_CLIENT_ID }}
        run: bun run build
      - name: Assemble and sign the home's and the worker's native Linux releases
        env:
          ALTHAR_HOST_RELEASE_SIGNING_KEY: ${{ secrets.ALTHAR_HOST_RELEASE_SIGNING_KEY }}
          ALTHAR_WORKER_BINARY: ${{ github.workspace }}/target/release/althar-worker
          ALTHAR_WORKER_TOOLS: ${{ runner.temp }}/worker-tools
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.check.outputs.tag }}/
          RELEASE_SEQUENCE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "$ALTHAR_HOST_RELEASE_SIGNING_KEY" ]; then
            echo '::error::The protected release environment needs ALTHAR_HOST_RELEASE_SIGNING_KEY (Ed25519 private PEM).'
            exit 1
          fi
          node dist/althar-host.js package-release \
            --release-base-url "$RELEASE_BASE" --release-sequence "$RELEASE_SEQUENCE" \
            --output "$RUNNER_TEMP/host-release" --json
      - uses: actions/upload-artifact@v4
        with:
          name: host-release-${{ matrix.arch }}
          path: ${{ runner.temp }}/host-release/*
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [check, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: host-release-*
          path: host-release
          merge-multiple: true
      # A machine without SSH adds itself as a worker with the bootstrap script and a one-time code; the release's
      # public key, beside it, is the one its later updates must be signed by.
      - name: Add the worker's bootstrap script and the release's public key
        env:
          ALTHAR_HOST_RELEASE_SIGNING_KEY: ${{ secrets.ALTHAR_HOST_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          cp apps/host/bootstrap/ssh.sh host-release/althar-worker.sh
          printf '%s\n' "$ALTHAR_HOST_RELEASE_SIGNING_KEY" | openssl pkey -pubout -out host-release/althar-host-release.pub
      - name: Create one draft with both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # Per architecture: the home's archive and manifest; the worker's whole archive, its manifest, its base and its two
          # agents' parts (apps/host/src/updates/parts.ts). Then the bootstrap and the key.
          test "$(find host-release -type f | wc -l)" -eq 16
          gh release create "$RELEASE_TAG" host-release/* --target "$GITHUB_SHA" \
            --draft --latest=false --title "Althar host $RELEASE_VERSION" \
            --notes-file "apps/host/release-notes/$RELEASE_VERSION.md"
