name: Windows join cleanup probe

on:
  push:
    branches: [fix/windows-join-cleanup]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
        with:
          binary: 'false'
      - name: Reproduce the Windows join and drop without retries
        working-directory: packages/runtime
        run: |
          for attempt in {1..20}; do
            echo "Windows cleanup probe $attempt/20"
            bun run test tests/severalChanges.test.ts --testNamePattern 'keeps two changes together before either ships' --maxWorkers=1 --retry=0 || exit 1
          done
