# Checks the brand pack in brand/: format, lint and types, then the tests that keep the pack in step with the rest of the
# repository: the mark's copies in the UI package, the favicons and Storybook; the brand colours against the
# interface's tokens; the app icons against the desktop app's; the committed export/ against what the code draws; and
# the wallpapers against the launch's light and dots.
# It runs when any of those files change. It doesn't redraw the pack: after changing a drawing, run
# `bun --filter @althar/brand export` and commit what it writes.
name: brand

on:
  # From queue.yml, for a pull request in the merge queue.
  workflow_call:
  push:
    branches: [main]
    paths:
      [
        'brand/**',
        'packages/ui/src/styles/tokens.css',
        'packages/ui/src/foundations/Logo/**',
        'packages/ui/src/screens/Launch/light.ts',
        'packages/ui/src/screens/Launch/halftone.ts',
        'packages/ui/.storybook/**',
        'apps/site/public/**',
        'apps/desktop/resources/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        'packages/testing/**',
        '.github/actions/flaky/**',
        '.github/workflows/brand.yml',
      ]
  pull_request:
    paths:
      [
        'brand/**',
        'packages/ui/src/styles/tokens.css',
        'packages/ui/src/foundations/Logo/**',
        'packages/ui/src/screens/Launch/light.ts',
        'packages/ui/src/screens/Launch/halftone.ts',
        'packages/ui/.storybook/**',
        'apps/site/public/**',
        'apps/desktop/resources/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        'packages/testing/**',
        '.github/actions/flaky/**',
        '.github/workflows/brand.yml',
      ]

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

concurrency:
  group: brand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brand
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - run: bun run test
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky
