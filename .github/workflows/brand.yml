# Checks the brand pack in brand/: format, lint and types, then the tests that keep the pack in step with the rest of the
# repository: the mark's copies in the UI package, the pitch, the favicons and Storybook; the brand colours against the
# interface's tokens; the app icons against the desktop app's; the committed export/ against what the code draws; and
# the wallpapers against the launch's light and dots.
# It runs when any of those files change. It doesn't redraw the pack: after changing a drawing, run
# `bun --filter @althar/brand export` and commit what it writes.
name: brand

on:
  push:
    branches: [main]
    paths:
      [
        'brand/**',
        'packages/ui/src/styles/tokens.css',
        'packages/ui/src/foundations/Logo/**',
        'packages/ui/src/screens/Launch/light.ts',
        'packages/ui/src/screens/Launch/halftone.ts',
        'packages/ui/.storybook/**',
        'apps/pitch/src/components/Logo.tsx',
        'apps/pitch/public/**',
        'apps/pitch/scripts/og.html',
        'apps/site/public/**',
        'apps/desktop/resources/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        '.github/workflows/brand.yml',
      ]
  pull_request:
    paths:
      [
        'brand/**',
        'packages/ui/src/styles/tokens.css',
        'packages/ui/src/foundations/Logo/**',
        'packages/ui/src/screens/Launch/light.ts',
        'packages/ui/src/screens/Launch/halftone.ts',
        'packages/ui/.storybook/**',
        'apps/pitch/src/components/Logo.tsx',
        'apps/pitch/public/**',
        'apps/pitch/scripts/og.html',
        'apps/site/public/**',
        'apps/desktop/resources/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        '.github/workflows/brand.yml',
      ]

permissions:
  contents: read

concurrency:
  group: brand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brand
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      - run: bun run test
