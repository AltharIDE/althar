name: harness

on:
  push:
    branches: [main]
    paths: ['packages/connectors/**', 'packages/contracts/**', 'packages/domain/**', 'packages/persistence-sqlite/**', 'packages/provider-adapters/**', 'packages/runtime/**', 'apps/cli/**', 'package.json', 'bun.lock', 'vite.config.ts', '.github/workflows/harness.yml']
  pull_request:
    paths: ['packages/connectors/**', 'packages/contracts/**', 'packages/domain/**', 'packages/persistence-sqlite/**', 'packages/provider-adapters/**', 'packages/runtime/**', 'apps/cli/**', 'package.json', 'bun.lock', 'vite.config.ts', '.github/workflows/harness.yml']

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [packages/connectors, packages/contracts, packages/domain, packages/persistence-sqlite, packages/provider-adapters, packages/runtime, apps/cli]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run verify
