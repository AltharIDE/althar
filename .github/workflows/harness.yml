name: harness

# On a pull request, checks and unit tests. The coverage gate runs after merge, in post-merge.yml.
on:
  # From queue.yml, for a pull request in the merge queue.
  workflow_call:
  pull_request:
    paths:
      [
        'packages/connectors/**',
        'packages/contracts/**',
        'packages/domain/**',
        'packages/persistence-sqlite/**',
        'packages/provider-adapters/**',
        'packages/runtime/**',
        'apps/cli/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        'packages/testing/**',
        '.github/actions/flaky/**',
        '.github/workflows/harness.yml',
      ]

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The packages besides the runtime, one after another in one job: each takes under a minute, and a job of its own
  # mostly waits for a machine and installs, which in the merge queue keeps other pull requests waiting. Every package
  # runs even when one before it fails, so a run says all that broke.
  verify:
    name: verify (packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - env:
          PACKAGES: packages/connectors packages/contracts packages/domain packages/persistence-sqlite packages/provider-adapters packages/testing apps/cli
        run: |
          failed=''
          for package in $PACKAGES; do
            echo "::group::$package"
            (cd "$package" && bun run check && bun run test) || failed="$failed $package"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  # The runtime's tests in four parts by file (vitest's --shard), each its own job: as one they took most of a quarter
  # of an hour, and often more.
  runtime:
    name: verify (packages/runtime ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # A few times a part's usual run, so a hang fails here, not at the limit.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - run: bun run test --shard=${{ matrix.shard }}
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  # The runtime's parts as the one check they were before, under its name: passes only when every part did.
  runtime-verified:
    name: verify (packages/runtime)
    needs: runtime
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PARTS: ${{ needs.runtime.result }}
        run: |
          if [ "$PARTS" != success ]; then
            echo "::error::A part of the runtime's tests didn't pass: $PARTS"
            exit 1
          fi
