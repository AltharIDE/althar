name: harness

# On a pull request, and for its entry in the merge queue: the checks and unit tests its change reaches
# (packages/testing/src/select.ts). A change that reaches the runtime also reports and gates its whole coverage,
# on the pull request and again in the merge queue. Its tests and its measured coverage have separate verdicts. Every test on
# Linux and Windows, and the other packages' coverage, run after merge, in post-merge.yml.
on:
  # From queue.yml, for a pull request in the merge queue.
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      [
        'packages/connectors/**',
        'packages/contracts/**',
        'packages/domain/**',
        'packages/persistence-sqlite/**',
        'packages/provider-adapters/**',
        'packages/runtime/**',
        'packages/skills/**',
        'apps/cli/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        '.bun-version',
        '.node-version',
        'lint/**',
        'patches/**',
        'packages/testing/**',
        '.github/actions/flaky/**',
        '.github/actions/electron/**',
        '.github/workflows/harness.yml',
        '.github/scripts/runtime-coverage.py',
        '.github/scripts/test_runtime_coverage.py',
      ]

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the change reaches: which packages' checks run, which of their tests, and on how many machines the runtime's.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      any: ${{ steps.plan.outputs.any }}
      # Whether the change reaches the runtime, whose coverage is measured on the PR and in the queue.
      runtime: ${{ steps.plan.outputs.runtime == 'true' || steps.coverage.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # What the change is: against the pull request's base, or in the merge queue against main, since the build at a
      # group's head merges the whole group when it passes, and so must cover every entry in it.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE" ] && git fetch --no-tags --depth=1 origin "$BASE"; then
            git diff --name-only --no-renames FETCH_HEAD HEAD > "$RUNNER_TEMP/changed"
          else
            echo '*' > "$RUNNER_TEMP/changed"
          fi
      - id: coverage
        run: |
          if rg -q '^\.github/scripts/(runtime-coverage|test_runtime_coverage)\.py$' "$RUNNER_TEMP/changed"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        env:
          RUNTIME_COVERAGE: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.draft != true) }}
        run: bun packages/testing/src/select.ts plan harness "$RUNNER_TEMP/changed"

  # Each job's packages one after another, every one run even when one before it fails, so a run says all that broke:
  # the packages besides the runtime in one (each takes under a minute, and a job of its own mostly waits for a machine
  # and installs), and the runtime's tests split by file (vitest's --shard) into as many as they take, up to four.
  verify:
    name: verify (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    # A few times a part's usual run, so a hang fails here, not at the limit.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
        with:
          binary: 'false'
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - env:
          PLAN: ${{ toJSON(matrix) }}
        run: bun packages/testing/src/select.ts run
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  # Runtime tests stay red when they fail. Each part keeps its coverage with its test blob, even on failure, so the
  # separate coverage job can measure the whole without calling a failing test a coverage failure.
  coverage-parts:
    name: runtime tests with coverage (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.runtime == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-24.04
    # A few times a part's usual run, so a hang fails here, not at the limit.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
        with:
          binary: 'false'
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      # A part covers only what its own tests reach, so the thresholds wait for the merge.
      - run: >-
          bun run test:coverage --shard=${{ matrix.shard }} --reporter=default --reporter=blob --reporter=@althar/testing/reporter
          --outputFile.blob=.vitest/blob/part-${{ strategy.job-index }}.json
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          --coverage.reporter=text --coverage.reporter=json-summary
      # A measurement beside each blob proves that all four parts produced coverage, not only test results.
      - if: ${{ !cancelled() }}
        run: |
          mkdir -p .vitest/summary
          cp coverage/coverage-summary.json .vitest/summary/part-${{ strategy.job-index }}.json
      # Kept when tests fail too, so the merged report says all that broke.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: runtime-coverage-blob-${{ strategy.job-index }}
          path: |
            packages/runtime/.vitest/blob
            packages/runtime/.vitest/summary
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  coverage:
    name: coverage (packages/runtime)
    needs: [plan, coverage-parts]
    if: ${{ !cancelled() && needs.plan.outputs.runtime == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
        with:
          binary: 'false'
      - uses: actions/download-artifact@v6
        with:
          pattern: runtime-coverage-blob-*
          path: packages/runtime/.vitest
          merge-multiple: true
      - working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_runtime_coverage.py'
      - run: python3 ../../.github/scripts/runtime-coverage.py parts .vitest
      # Merging replays test failures too, so its exit code cannot be the coverage verdict. The test jobs above keep
      # those failures red. Delete any earlier summary: a broken merge must never pass on stale measurements.
      - run: rm -f coverage/coverage-summary.json
      - continue-on-error: true
        run: >-
          bun run test:coverage --merge-reports=.vitest/blob --reporter=default
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          --coverage.reporter=text --coverage.reporter=json-summary
      # Missing, malformed or partial output fails here. Only the fresh whole measurement decides coverage.
      - run: python3 ../../.github/scripts/runtime-coverage.py gate .vitest coverage/coverage-summary.json
