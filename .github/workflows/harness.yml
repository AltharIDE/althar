name: harness

# On a pull request, checks and unit tests. The coverage gate runs after merge, in post-merge.yml.
on:
  pull_request:
    paths:
      [
        'packages/connectors/**',
        'packages/contracts/**',
        'packages/domain/**',
        'packages/persistence-sqlite/**',
        'packages/provider-adapters/**',
        'packages/runtime/**',
        'apps/cli/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        '.github/workflows/harness.yml',
      ]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # A few times the slowest part's usual run (the runtime's shards, about 3 minutes each): a hang fails here, not later.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            packages/connectors,
            packages/contracts,
            packages/domain,
            packages/persistence-sqlite,
            packages/provider-adapters,
            apps/cli,
          ]
        # The runtime's tests in parts by file, each its own job: as one they took most of a quarter of an hour.
        include:
          - package: packages/runtime
            shard: 1/3
          - package: packages/runtime
            shard: 2/3
          - package: packages/runtime
            shard: 3/3
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      - run: bun run test ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
