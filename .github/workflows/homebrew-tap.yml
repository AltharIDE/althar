name: homebrew-tap

# Keeps the Homebrew cask in AltharIDE/homebrew-tap (`brew install --cask altharide/tap/althar`) at the latest published
# release (Linear DEV-72). It runs when a release is PUBLISHED, never when one is drafted, takes the sha256 of the
# published arm64 dmg itself, fills packaging/homebrew/althar.rb in with it and pushes Casks/althar.rb to the tap, making
# the file the first time. Prereleases, and releases that aren't the latest, are skipped. A run for a version the tap
# has already changes nothing.
#
# It creates and publishes no release: releases come from release.yml alone. Its one secret, HOMEBREW_TAP_TOKEN (Contents
# read & write on the tap alone), is in the `release` environment, as apps/desktop/README.md ("The packaged app") says.
# A release event runs the workflow as it is on the tag, so a release cut before this file existed (v0.5.0) is done by
# hand: Actions → homebrew-tap → Run workflow, on main, with its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release to put in the tap, such as v0.5.0
        required: true
        type: string

permissions:
  contents: read

# One at a time, so two publishes in quick succession can't push over each other.
concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  cask:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TAP: AltharIDE/homebrew-tap
    steps:
      # The template from main, whatever the release's tag holds: the same cask whichever release it fills in.
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: release
        name: A published release, the latest
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v0.5.0."
            exit 1
          fi
          read -r draft prerelease < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [ "$draft" = true ]; then
            echo "::error::$TAG is still a draft: publish it first."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [ "$prerelease" = true ]; then
            echo "::notice::$TAG is a prerelease: the tap follows releases only."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG isn't the latest release ($latest is): the tap stays on the latest."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      # The file people download, as published, not one built again. GitHub's own digest of the asset, where it has one,
      # has to agree.
      - id: dmg
        if: steps.release.outputs.skip == 'false'
        name: The published dmg's sha256
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          name="Althar-$VERSION-arm64.dmg"
          dir="$RUNNER_TEMP/dmg"
          mkdir -p "$dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$dir"
          sha256="$(sha256sum "$dir/$name" | cut -d' ' -f1)"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$name\") | .digest // \"\"")"
          if [ -n "$digest" ] && [ "$digest" != "sha256:$sha256" ]; then
            echo "::error::The downloaded $name is sha256:$sha256, but the release lists $digest."
            exit 1
          fi
          rm -rf "$dir"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: The cask in the tap
        if: steps.release.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::The release environment has no HOMEBREW_TAP_TOKEN: a token with Contents read & write on $TAP. apps/desktop/README.md says how."
            exit 1
          fi
          echo "::add-mask::$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          auth="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          git() { command git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }

          git clone "https://github.com/$TAP.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Casks
          "$GITHUB_WORKSPACE/packaging/homebrew/fill.sh" "$VERSION" "$SHA256" "$GITHUB_WORKSPACE/packaging/homebrew/althar.rb" > Casks/althar.rb
          if [ -z "$(command git status --porcelain Casks/althar.rb)" ]; then
            echo "The tap already has althar $VERSION: nothing to change."
            echo "### Homebrew tap" >> "$GITHUB_STEP_SUMMARY"
            echo "$TAP already has althar $VERSION; nothing changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          command git config user.name 'github-actions[bot]'
          command git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          command git add Casks/althar.rb
          command git commit -m "althar $VERSION"
          # A new, empty tap has no branch yet: main is made by this push.
          git push origin HEAD:main
          echo "### Homebrew tap" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAP now has althar $VERSION (sha256 $SHA256)." >> "$GITHUB_STEP_SUMMARY"
