name: prototype-workbench

# The kit too: the workbench and its example are drawn with it.
on:
  push:
    branches: [main]
    paths:
      ['packages/prototype-workbench/**', 'packages/ui/**', 'package.json', 'bun.lock', 'vite.config.ts', '.github/workflows/prototype-workbench.yml']
  pull_request:
    paths:
      ['packages/prototype-workbench/**', 'packages/ui/**', 'package.json', 'bun.lock', 'vite.config.ts', '.github/workflows/prototype-workbench.yml']

permissions:
  contents: read

concurrency:
  group: prototype-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/prototype-workbench
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run verify
