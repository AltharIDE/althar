name: ui

# On a pull request, and for its entry in the merge queue: the checks and the unit tests its change reaches
# (packages/testing/src/select.ts), and the Storybook build. The coverage gate runs after merge, in post-merge.yml.
on:
  # From queue.yml, for a pull request in the merge queue.
  workflow_call:
  pull_request:
    paths:
      [
        'packages/ui/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        '.bun-version',
        '.node-version',
        'lint/**',
        'patches/**',
        'packages/testing/**',
        '.github/actions/flaky/**',
        '.github/workflows/ui.yml',
      ]

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      # What the change is: against the pull request's base, or in the merge queue against main, since the build at a
      # group's head merges the whole group when it passes, and so must cover every entry in it.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_ref }}
        working-directory: .
        run: |
          if [ -n "$BASE" ] && git fetch --no-tags --depth=1 origin "$BASE"; then
            git diff --name-only --no-renames FETCH_HEAD HEAD > "$RUNNER_TEMP/changed"
          else
            echo '*' > "$RUNNER_TEMP/changed"
          fi
      - id: plan
        working-directory: .
        run: bun packages/testing/src/select.ts plan ui "$RUNNER_TEMP/changed"
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - if: steps.plan.outputs.any == 'true'
        uses: ./.github/actions/flaky/quarantine
      - if: steps.plan.outputs.any == 'true'
        working-directory: .
        env:
          PLAN: ${{ steps.plan.outputs.jobs }}
        run: bun packages/testing/src/select.ts run
      - run: bun run build
      - uses: actions/upload-artifact@v6
        with:
          name: storybook
          path: packages/ui/dist/storybook
          retention-days: 7
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky
