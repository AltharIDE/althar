name: queue

# The merge queue. A pull request's checks run on it as it was branched; two that each pass can still break main once
# both are in. Queued, a pull request is checked again on main as it will be, with the pull requests ahead of it. Up to
# three entries build at once, each on main and the entries ahead of it. When the build at a group's head passes, the
# whole group merges, an entry ahead whose own build failed or hasn't finished with it: the head's build tested exactly
# what lands. So each build here covers what its entry and those ahead of it change against main, not its entry alone.
# A pull request goes back to its branch only when its own build fails and none behind it passes.
#
# The queue runs a pull request's own checks (desktop.yml, harness.yml and the rest), for the paths the group changes,
# as its pull request did, and each runs what that change reaches: the checks and unit tests on Linux, and for a change
# that reaches the app, its end-to-end run (desktop.yml calls e2e.yml). Not the stress run of changed tests or Windows'
# smoke test, which the pull request ran on the same change, but a build fails if either failed on the head of a pull
# request in its group. Windows' unit tests, coverage and the packages run after merge, in post-merge.yml.
#
# Main's rules require one check, `merge queue`. On a pull request it passes at once, the pull request's own checks
# being the ones that say how it stands; in the queue, it passes once every check that ran there did.
on:
  pull_request:
  merge_group:

permissions:
  contents: read
  # The workflows it calls file flaky tests as issues (.github/actions/flaky).
  issues: write

# A newer push to a pull request replaces its run; a group's build is never cancelled.
concurrency:
  group: queue-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which workflows the group's changes call for, by each workflow's own `paths`.
  changes:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      harness: ${{ steps.paths.outputs.harness }}
      ui: ${{ steps.paths.outputs.ui }}
      site: ${{ steps.paths.outputs.site }}
      brand: ${{ steps.paths.outputs.brand }}
      report: ${{ steps.paths.outputs.report }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # What this entry and those ahead of it add to main: what lands if this build passes.
      - env:
          BASE: ${{ github.event.merge_group.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          git diff --name-only --no-renames FETCH_HEAD HEAD > "$RUNNER_TEMP/changed"
      - id: paths
        run: |
          bun -e '
            const changed = (await Bun.file(`${process.env.RUNNER_TEMP}/changed`).text()).split("\n").filter(Boolean)
            for (const name of ["desktop", "harness", "ui", "site", "brand", "report"]) {
              const workflow = Bun.YAML.parse(await Bun.file(`.github/workflows/${name}.yml`).text())
              const globs = workflow.on.pull_request.paths.map((path) => new Bun.Glob(path))
              console.log(`${name}=${changed.some((file) => globs.some((glob) => glob.match(file)))}`)
            }
          ' | tee -a "$GITHUB_OUTPUT"

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml

  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    uses: ./.github/workflows/harness.yml

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site.yml

  brand:
    needs: changes
    if: needs.changes.outputs.brand == 'true'
    uses: ./.github/workflows/brand.yml

  report:
    needs: changes
    if: needs.changes.outputs.report == 'true'
    uses: ./.github/workflows/report.yml

  # The one check main's rules require: passes when nothing that ran failed. On a pull request, nothing above runs.
  merge-queue:
    name: merge queue
    needs: [changes, desktop, harness, ui, site, brand, report]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *' failure '* | *' cancelled '*)
              echo "::error::A check in the merge queue didn't pass: unless a build behind it passes, this pull request goes back to its branch."
              exit 1
              ;;
          esac
      # Stress and Windows' smoke test run on the pull request alone, so one that failed on a pull request's own head
      # keeps it out: this entry's, and those ahead of it, which merge with it if this build passes. Not run is fine.
      - if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq '.commits[].commit.message | split("\n")[0] | capture("\\(#(?<n>[0-9]+)\\)$").n')"
          for pr in $prs; do
            head="$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha)"
            stress="$(gh api "repos/$GH_REPO/actions/workflows/stress.yml/runs?head_sha=$head&per_page=1" --jq '.workflow_runs[0].conclusion // ""')"
            smoke="$(gh api "repos/$GH_REPO/commits/$head/check-runs?check_name=windows-e2e" --jq '.check_runs[0].conclusion // ""')"
            echo "#$pr at ${head::8}: stress ${stress:-not run}, smoke test ${smoke:-not run}"
            if [ "$stress" = failure ] || [ "$smoke" = failure ]; then
              echo "::error::#$pr's stress run or Windows' smoke test failed on its own head: fix it on its branch."
              exit 1
            fi
          done
