name: queue

# The merge queue. A pull request's checks run on it as it was branched; two that each pass can still break main once
# both are in. Queued, a pull request is checked again on main as it will be, with the pull requests ahead of it. Up to
# three entries build at once, each on main and the entries ahead of it. When the build at a group's head passes, the
# whole group merges, an entry ahead whose own build failed or hasn't finished with it: the head's build tested exactly
# what lands. So each build here covers every entry up to its own, not its entry alone.
# A pull request goes back to its branch only when its own build fails and none behind it passes.
#
# A pull request is queued only once its own checks have all passed on its head (`merge queue`, below): every workflow
# its files call for, the stress run of its changed tests and Windows' smoke test. So the queue doesn't run them again.
# It tests what its entries could break together: for each, the checks and unit tests on Linux that both what it
# changes and what landed beneath it since it branched reach (.github/scripts/queue-entries.py, and queuePlan in
# packages/testing/src/select.ts), through the same workflows a pull request runs, for the paths the group changes.
# A test only one of them reaches already passed with nothing of the other in its way. Not the end-to-end run, the
# coverage gates or Windows: a pull request runs them, and post-merge.yml runs them in full after merge, before any
# release. When the entries can't be told apart, the queue runs what the whole group changes against main instead.
#
# Main's rules require one check, `merge queue`. On a pull request it passes once every one of the pull request's own
# checks has, on its head, and its migration and ADR numbers are free (`numbers`). In the queue, it passes once every
# check that ran there did, and each entry's own checks, read again, still say they passed on its head.
on:
  pull_request:
    # And when a draft is ready for review, which is when its stress run starts (stress.yml).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  # The workflows it calls file flaky tests as issues (.github/actions/flaky).
  issues: write

# A newer push to a pull request replaces its run; a group's build is never cancelled.
concurrency:
  group: queue-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which workflows the group's changes call for, by each workflow's own `paths`.
  changes:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      harness: ${{ steps.paths.outputs.harness }}
      host: ${{ steps.paths.outputs.host }}
      ui: ${{ steps.paths.outputs.ui }}
      site: ${{ steps.paths.outputs.site }}
      brand: ${{ steps.paths.outputs.brand }}
      report: ${{ steps.paths.outputs.report }}
      worker: ${{ steps.paths.outputs.worker }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # What this entry and those ahead of it add to main: what lands if this build passes.
      - env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          git diff --name-only --no-renames FETCH_HEAD HEAD > "$RUNNER_TEMP/changed"
      - id: paths
        run: |
          bun -e '
            const changed = (await Bun.file(`${process.env.RUNNER_TEMP}/changed`).text()).split("\n").filter(Boolean)
            for (const name of ["desktop", "harness", "host", "ui", "site", "brand", "report", "worker"]) {
              const workflow = Bun.YAML.parse(await Bun.file(`.github/workflows/${name}.yml`).text())
              const globs = workflow.on.pull_request.paths.map((path) => new Bun.Glob(path))
              console.log(`${name}=${changed.some((file) => globs.some((glob) => glob.match(file)))}`)
            }
          ' | tee -a "$GITHUB_OUTPUT"
      # What each entry changes and what landed beneath it since it branched, for desktop, harness and ui to plan from.
      # When it can't say, they find no entries and run what the whole group changes.
      - continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/queue"
          python3 .github/scripts/queue-entries.py "$RUNNER_TEMP/queue/entries.json"
      - uses: actions/upload-artifact@v6
        with:
          name: queue-entries
          path: ${{ runner.temp }}/queue
          if-no-files-found: ignore
          retention-days: 1

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml

  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    uses: ./.github/workflows/harness.yml

  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/host.yml

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site.yml

  brand:
    needs: changes
    if: needs.changes.outputs.brand == 'true'
    uses: ./.github/workflows/brand.yml

  report:
    needs: changes
    if: needs.changes.outputs.report == 'true'
    uses: ./.github/workflows/report.yml

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/worker.yml

  # Migration and ADR numbers, on every pull request and every group whatever they change: two pull requests that each
  # pass alone can take the same number. On a pull request its tree is main with it merged in; in the queue, main with
  # the group in, so the second of two that took a number is refused here before it lands
  # (docs/decisions/foundations.md#numbers-that-cant-collide). On a pull request it also warns of an open one that adds
  # the same number.
  numbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # On a pull request HEAD is its merge with main, and HEAD^1 is main.
          fetch-depth: 2
      - env:
          BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_numbers.py'
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            python3 .github/scripts/numbers.py --base FETCH_HEAD
          else
            python3 .github/scripts/numbers.py --base HEAD^1 --pr "$PR"
          fi

  # The one check main's rules require: passes when nothing that ran failed. On a pull request, only `numbers` above
  # runs.
  merge-queue:
    name: merge queue
    needs: [changes, numbers, desktop, harness, host, ui, site, brand, report, worker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Long enough to wait out a pull request's own checks still going, whose longest jobs take 75 minutes at most.
    timeout-minutes: 80
    permissions:
      actions: read
      checks: read
      contents: read
      # When a pull request became ready for review, from its timeline.
      issues: read
      pull-requests: read
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *' failure '* | *' cancelled '*)
              echo "::error::A check in the merge queue didn't pass: unless a build behind it passes, this pull request goes back to its branch."
              exit 1
              ;;
          esac
      # Each pull request's own checks, on its head: every workflow its files call for, its stress run and Windows'
      # smoke test (.github/scripts/queue-gate.py). On a pull request they are waited for, read again every 30 s, so
      # auto-merge queues it only once they have all passed; in the queue, each entry's are read again.
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The queue's own scripts, on every pull request too, so one that breaks them fails where it was made.
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 .github/scripts/queue-gate.py
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/queue-gate.py "$PR"
