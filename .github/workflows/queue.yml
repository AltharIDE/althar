name: queue

# The merge queue. A pull request's checks run on it as it was branched; two that each pass can still break main once
# both are in. Queued, a pull request is checked again on main as it will be, with the pull requests ahead of it. Up to
# three entries build at once, each on main and the entries ahead of it. When the build at a group's head passes, the
# whole group merges, an entry ahead whose own build failed or hasn't finished with it: the head's build tested exactly
# what lands. So each build here covers what its entry and those ahead of it change against main, not its entry alone.
# A pull request goes back to its branch only when its own build fails and none behind it passes.
#
# The queue runs a pull request's own checks (desktop.yml, harness.yml and the rest), for the paths the group changes,
# as its pull request did, and each runs what that change reaches: the checks and unit tests on Linux, and for a change
# that reaches the app, its end-to-end run (desktop.yml calls e2e.yml). Not the stress run of changed tests or Windows'
# smoke test, which the pull request ran on the same change, but a build fails if either failed on the head of a pull
# request in its group. Each package the change reaches that gates on its coverage runs its gate here too
# (harness.yml). Windows' full unit suites, the UI kit's and the app's coverage and the packages run after merge, in
# post-merge.yml.
#
# Main's rules require one check, `merge queue`. On a pull request it passes once the pull request's own stress run
# has (or it has none), the Windows smoke test hasn't failed, its migration and ADR numbers are free (`numbers`) and
# no count that may only fall has risen (`measures`):
# waited for here, on the pull request, a stress run no longer holds the queue, where every entry behind a waiting one
# waited too. In the queue, it passes once every check that ran there did, and the stress run it reads again has long
# finished.
on:
  pull_request:
    # And when a draft is ready for review, which is when its stress run starts (stress.yml).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  # The workflows it calls read the test durations post-merge measured on main (.github/actions/durations).
  actions: read
  contents: read
  # The workflows it calls file flaky tests as issues (.github/actions/flaky).
  issues: write

# A newer push to a pull request replaces its run; a group's build is never cancelled.
concurrency:
  group: queue-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which workflows the group's changes call for, by each workflow's own `paths`.
  changes:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.paths.outputs.desktop }}
      harness: ${{ steps.paths.outputs.harness }}
      host: ${{ steps.paths.outputs.host }}
      ui: ${{ steps.paths.outputs.ui }}
      site: ${{ steps.paths.outputs.site }}
      brand: ${{ steps.paths.outputs.brand }}
      report: ${{ steps.paths.outputs.report }}
      windows: ${{ steps.paths.outputs.windows }}
      worker: ${{ steps.paths.outputs.worker }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # What this entry and those ahead of it add to main: what lands if this build passes.
      - env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          git diff --name-only --no-renames FETCH_HEAD HEAD > "$RUNNER_TEMP/changed"
      - id: paths
        run: |
          bun -e '
            const changed = (await Bun.file(`${process.env.RUNNER_TEMP}/changed`).text()).split("\n").filter(Boolean)
            for (const name of ["desktop", "harness", "host", "ui", "site", "brand", "report", "windows", "worker"]) {
              const workflow = Bun.YAML.parse(await Bun.file(`.github/workflows/${name}.yml`).text())
              const globs = workflow.on.pull_request.paths.map((path) => new Bun.Glob(path))
              console.log(`${name}=${changed.some((file) => globs.some((glob) => glob.match(file)))}`)
            }
          ' | tee -a "$GITHUB_OUTPUT"

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml

  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    uses: ./.github/workflows/harness.yml

  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/host.yml

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/windows.yml

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site.yml

  brand:
    needs: changes
    if: needs.changes.outputs.brand == 'true'
    uses: ./.github/workflows/brand.yml

  report:
    needs: changes
    if: needs.changes.outputs.report == 'true'
    uses: ./.github/workflows/report.yml

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/worker.yml

  # Migration and ADR numbers, on every pull request and every group whatever they change: two pull requests that each
  # pass alone can take the same number. On a pull request its tree is main with it merged in; in the queue, main with
  # the group in, so the second of two that took a number is refused here before it lands
  # (docs/decisions/foundations.md#numbers-that-cant-collide). On a pull request it also warns of an open one that adds
  # the same number.
  numbers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # On a pull request HEAD is its merge with main, and HEAD^1 is main.
          fetch-depth: 2
      - env:
          BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_numbers.py'
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            python3 .github/scripts/numbers.py --base FETCH_HEAD
          else
            python3 .github/scripts/numbers.py --base HEAD^1 --pr "$PR"
          fi

  # Counts over the tree that may only fall (.github/measures.json), on every pull request and group whatever they
  # change, with no install (.github/scripts/measures.py): the runtime's import cycles, json_extract calls, comparisons
  # of a code host's or an agent's name, tests that sleep on the real clock, and writers of a status. A count above
  # main's baseline is refused, and so is a baseline raised; one below its baseline is a warning to lower it
  # (docs/decisions/foundations.md#what-ci-gates).
  measures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # On a pull request HEAD is its merge with main, and HEAD^1 is main.
          fetch-depth: 2
      - env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_measures.py'
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            python3 .github/scripts/measures.py --base FETCH_HEAD
          else
            python3 .github/scripts/measures.py --base HEAD^1
          fi

  # The one check main's rules require: passes when nothing that ran failed. On a pull request, only `numbers` and
  # `measures` above run.
  merge-queue:
    name: merge queue
    needs: [changes, numbers, measures, desktop, harness, host, ui, site, brand, report, windows, worker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Long enough to wait out a stress run still going, whose own jobs take 75 minutes at most.
    timeout-minutes: 80
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *' failure '* | *' cancelled '*)
              echo "::error::A check in the merge queue didn't pass: unless a build behind it passes, this pull request goes back to its branch."
              exit 1
              ;;
          esac
      # Stress and Windows' smoke test run on the pull request alone, so one that failed on a pull request's own head
      # keeps it out: this entry's, and those ahead of it, which merge with it if this build passes. Not run is fine; a
      # stress run still going is waited for, read again every 30 s, as its failure would come after the group merged.
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/queue-stress.py
      # On the pull request, its own stress run is waited for here, so auto-merge queues it only once that has passed.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/queue-stress.py "$PR"
