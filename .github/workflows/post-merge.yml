name: post-merge

# The heavy part of desktop, harness and ui, after merge: their checks again (two pull requests can each pass and still
# clash), the coverage gates, the Storybook build, the desktop app's end-to-end run and its packages, Windows' too. On a
# pull request those workflows run only checks and unit tests, so a change to main doesn't hold every open pull request
# up for the long runs. site and brand are quick, and still run in full on their own. Main may go red for a while; a
# release can't: release.yml cuts only a commit this workflow passed on.
#
# Merges in quick succession share a run: one runs, the newest waits, and those between are skipped. When main goes
# red, an issue titled "Main is red" says which run failed and which merges since the last green run could have broken
# it; it is closed when main is green again.
#
# Run by hand on any branch or tag (`gh workflow run post-merge.yml --ref <branch>`) to try the heavy suites before
# merging, or on a release tag whose commit was skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

concurrency:
  group: post-merge-${{ github.ref }}
  # Never cancelled half way: a newer push waits, and replaces any older one still waiting.
  cancel-in-progress: false

jobs:
  # The packages besides the runtime, with their coverage gates, one after another in one job: a job each mostly waited
  # for a machine. Every package runs even when one before it fails, so a run says all that broke.
  harness:
    name: harness (packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - env:
          PACKAGES: packages/connectors packages/contracts packages/domain packages/persistence-sqlite packages/provider-adapters packages/skills apps/cli
        run: |
          failed=''
          for package in $PACKAGES; do
            echo "::group::$package"
            (cd "$package" && bun run check && bun run test:coverage) || failed="$failed $package"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  # The runtime's tests with coverage, in parts by file, as on a pull request: as one they took most of twenty minutes.
  # Each part keeps what it found as a blob report; harness (packages/runtime) merges them and gates the whole coverage.
  runtime:
    name: harness (packages/runtime ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # A few times a part's usual run, so a hang fails here, not at the limit.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      # A part covers only what its own tests reach, so the thresholds wait for the merge.
      - run: >-
          bun run test:coverage --shard=${{ matrix.shard }} --reporter=default --reporter=blob --reporter=@althar/testing/reporter
          --outputFile.blob=.vitest/blob/part-${{ strategy.job-index }}.json
          --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
      # Kept when tests fail too, so the merged report says all that broke.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: runtime-blob-${{ strategy.job-index }}
          path: packages/runtime/.vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  harness-runtime:
    name: harness (packages/runtime)
    needs: runtime
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      - uses: actions/download-artifact@v6
        with:
          pattern: runtime-blob-*
          path: packages/runtime/.vitest/blob
          merge-multiple: true
      # The parts' results and coverage as one run's: the thresholds hold for the whole suite, as before it was split.
      # The parts reported their flaky tests; the merge names its reporters so it doesn't again.
      - run: bun run test:coverage --merge-reports=.vitest/blob --reporter=default --reporter=github-actions
      # A part that stopped before writing its report leaves out its tests, and the merge alone wouldn't say so.
      - env:
          PARTS: ${{ needs.runtime.result }}
        run: |
          if [ "$PARTS" != success ]; then
            echo "::error::A part of the runtime's tests didn't pass: $PARTS"
            exit 1
          fi

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run check
      - run: bun run test:coverage
      - run: bun run build
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      # Ubuntu 24.04 keeps unprivileged user namespaces from apps, and Chromium's sandbox needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run check
      - run: bun run test:coverage
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  # The desktop app's end-to-end run, in parts of its own (e2e.yml): a check or a coverage gate that fails doesn't keep it
  # from running, so what it finds shows on the merge that broke it. The merge queue ran it already; this is the run a
  # release is cut from.
  desktop-e2e:
    uses: ./.github/workflows/e2e.yml

  # The Linux packages as a build test.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run package
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-packages
          path: |
            apps/desktop/out/dist/Althar-*.AppImage
            apps/desktop/out/dist/althar_*.deb
            apps/desktop/out/dist/althar-*.rpm
          if-no-files-found: error

  # The Windows installer as a build test, installed and uninstalled on windows-2025: the same job a pull request that
  # changes packaging runs.
  package-windows:
    uses: ./.github/workflows/windows-installer.yml

  # Main's state, as one open issue: opened (or added to) when a run on main fails, closed when one passes. Only a run
  # on main's newest commit speaks for main: a re-run of an older commit, or one a newer push is already waiting
  # behind, leaves the issue to that newer run.
  report:
    needs: [harness, runtime, harness-runtime, ui, desktop, desktop-e2e, package, package-windows]
    if: ${{ always() && github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, add to or close "Main is red"
        run: |
          head="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at ${head::8} now, past ${GITHUB_SHA::8}: its own run reports."
            exit 0
          fi
          title="Main is red"
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          short="${GITHUB_SHA::8}"
          if [ "$FAILED" = true ]; then
            body="post-merge failed on $short: $RUN"
            # Merges in quick succession share a run, so the merge that broke main can be any since the last green one.
            green="$(gh run list --workflow post-merge.yml --branch main --status success --limit 1 \
              --json headSha --jq '.[0].headSha // empty')"
            if [ -n "$green" ]; then
              body="$body"$'\n\n'"Merged since post-merge last passed: $GITHUB_SERVER_URL/$GH_REPO/compare/${green::8}...$short"
            fi
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$title" --body "$body"$'\n\n'"Find the merge that broke it, fix it on a branch, or revert it. This closes itself when post-merge passes on main."
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "post-merge passed on $short: $RUN"
          fi
