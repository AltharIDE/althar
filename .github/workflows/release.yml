name: release

# Releases come from here (ADR-024, Linear DEV-81): a tag v<version> pushed on
# a commit on main builds every platform, signs and notarizes the Mac's
# (Windows' is unsigned for now, DEV-78), and leaves ONE draft GitHub
# Release with all their files. A person publishes it on
# GitHub; nothing reaches anyone before that. Run by hand on main, it makes
# the same draft without a tag, which publishing then makes.
#
# Every job that uses a secret runs in the `release` environment, which holds
# them and waits for a required reviewer to approve. Set it up as
# apps/desktop/README.md ("The packaged app") says.
#
# This workflow alone publishes desktop releases: a platform's packaging
# belongs in a job here, uploading its files as an artifact named release-*,
# never in a workflow of its own that creates or publishes a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per tag or branch at a time, never cancelled half way through signing or notarizing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What is released, checked before anyone is asked to approve: a tag that is v<apps/desktop's version>, on a commit on
  # main, or a run by hand from main; release notes for the version; no published release of it already; and every
  # suite passed on the commit.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.what.outputs.version }}
      tag: ${{ steps.what.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, to tell whether the commit is on main.
          fetch-depth: 0
      - id: what
        name: The tag, the version and main agree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version apps/desktop/package.json)"
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::The tag $GITHUB_REF_NAME and apps/desktop/package.json's version ($version) disagree." \
                "Raise the version on main, then tag that commit v$version."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME is on a commit that isn't on main. Releases are cut from main."
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run this by hand from main, not $GITHUB_REF_NAME."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag is tagged already: re-run that tag's run instead, or raise the version."
              exit 1
            fi
          fi
          if [ ! -f "apps/desktop/release-notes/$version.md" ]; then
            echo "::error::apps/desktop/release-notes/$version.md is missing: a few plain lines for testers on what changed."
            exit 1
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "::error::$tag is published already. Raise the version for a new release."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Main may be red between releases, a release may not: post-merge.yml, the heavy suites, has to have passed on this
      # very commit. Merges in quick succession share a post-merge run, so a commit can have none of its own.
      - name: The heavy suites passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --workflow post-merge.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$passed" = 0 ]; then
            echo "::error::post-merge hasn't passed on ${GITHUB_SHA::8}. Wait for its run, or start one" \
              "(gh workflow run post-merge.yml --ref $GITHUB_REF_NAME), then re-run this."
            exit 1
          fi

  # Althar for Apple silicon: signed with the Developer ID, notarized, stapled and checked by bun run release, which
  # fails unless all of that holds (CI=true). On macOS 26 on Apple silicon, GitHub's standard runner, free for a public
  # repository; named, not macos-latest, so the image changes only when this file does.
  mac:
    needs: check
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      # The App Store Connect key is a secret's text; notarytool takes a file, kept only for this job.
      - name: The notary key, as a file
        env:
          KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "::error::The release environment needs APPLE_API_KEY (the .p8's contents), APPLE_API_KEY_ID and APPLE_API_ISSUER."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/notary"
          path="$RUNNER_TEMP/notary/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY" > "$path"
          chmod 600 "$path"
          echo "APPLE_API_KEY=$path" >> "$GITHUB_ENV"
      # The certificate, in a keychain of this job's own. electron-builder can import CSC_LINK itself, but it unlocks its
      # keychain for codesign with the .p12's password rather than the keychain's, which the macOS 26 runner refused
      # ("SecKeychainUnlock: The user name or passphrase you entered is not correct"). So the keychain is made here,
      # with a password of its own, with Apple's Developer ID intermediates beside the certificate (electron-builder
      # adds those itself only when it makes the keychain), and electron-builder signs from it (CSC_KEYCHAIN).
      - name: The certificate, in a keychain of its own
        env:
          P12: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::The release environment needs CSC_LINK (the .p12, base64) and CSC_KEY_PASSWORD."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "${P12#base64:}" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          # The certificate's issuer, so its chain to Apple's root builds: the Developer ID CAs, G2 and the first.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # Searched first, before the runner's own keychains.
          read -r -a others <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${others[@]}"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application:'; then
            echo "::error::No valid Developer ID Application identity in CSC_LINK: export the certificate with its private key as one .p12."
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package, sign, notarize and check
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Usage data's PostHog project (src/main/usageData.ts), from the release environment's secrets; the key is public, as
          # every PostHog project key is. A release made without them sends nothing, so it isn't made.
          ALTHAR_POSTHOG_KEY: ${{ secrets.ALTHAR_POSTHOG_KEY }}
          ALTHAR_POSTHOG_HOST: ${{ secrets.ALTHAR_POSTHOG_HOST }}
          # Where Report a problem posts: the reports Worker (apps/report), baked into the build. Unset, a report goes by mail.
          ALTHAR_REPORT_URL: ${{ secrets.ALTHAR_REPORT_URL }}
        run: |
          for name in ALTHAR_POSTHOG_KEY ALTHAR_POSTHOG_HOST ALTHAR_REPORT_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty: the release environment has no secret of that name."; exit 1; fi
          done
          bun run release
      - name: Forget the certificate
        if: always()
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then security delete-keychain "$CSC_KEYCHAIN" || true; fi
      - name: Forget the notary key
        if: always()
        run: rm -rf "$RUNNER_TEMP/notary"
      - uses: actions/upload-artifact@v6
        with:
          name: release-mac
          path: |
            apps/desktop/out/dist/Althar-*-arm64.dmg
            apps/desktop/out/dist/Althar-*-arm64.dmg.blockmap
            apps/desktop/out/dist/Althar-*-arm64-mac.zip
            apps/desktop/out/dist/Althar-*-arm64-mac.zip.blockmap
            apps/desktop/out/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
      # Apple's log of every submission: a rejected one names each file it found wrong.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: notary-logs
          path: apps/desktop/out/notary
          if-no-files-found: ignore
          retention-days: 30

  # Linux packages, made on the supported platform and uploaded for the one draft below. In the release environment for
  # its PostHog and report secrets alone; it waits with the Mac's, so one approval lets both go.
  linux:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Package
        env:
          ALTHAR_POSTHOG_KEY: ${{ secrets.ALTHAR_POSTHOG_KEY }}
          ALTHAR_POSTHOG_HOST: ${{ secrets.ALTHAR_POSTHOG_HOST }}
          ALTHAR_REPORT_URL: ${{ secrets.ALTHAR_REPORT_URL }}
        run: |
          for name in ALTHAR_POSTHOG_KEY ALTHAR_POSTHOG_HOST ALTHAR_REPORT_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty: the release environment has no secret of that name."; exit 1; fi
          done
          bun run package
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: |
            apps/desktop/out/dist/Althar-*.AppImage
            apps/desktop/out/dist/althar_*.deb
            apps/desktop/out/dist/althar-*.rpm
            apps/desktop/out/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  # Windows on x64: the NSIS installer, which installs for the person alone with no administrator's prompt, and
  # latest.yml, the feed its updater reads. In the release environment for its PostHog and report secrets, and the
  # signing secrets once there are some; it waits with the others, so one approval lets all three go.
  windows:
    needs: check
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
        working-directory: .
      # UNSIGNED FOR NOW (DEV-78): Windows' SmartScreen warns on the installer until it is signed. To sign, fill in the
      # WINDOWS_SIGNING slot in apps/desktop/scripts/package.ts, add the secrets for one of these to the release
      # environment, pass them to "Package" below, and drop this step, which stands in for it until then (it runs, and
      # stops the release, only if the repository variable ALTHAR_WINDOWS_SIGNING is set to true before the slot is):
      #   Azure Artifact Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app registration with the
      #     Artifact Signing Certificate Profile Signer role), ALTHAR_WIN_SIGNING_ENDPOINT (the account's region,
      #     e.g. https://weu.codesigning.azure.net), ALTHAR_WIN_SIGNING_ACCOUNT, ALTHAR_WIN_SIGNING_PROFILE and
      #     ALTHAR_WIN_PUBLISHER (the certificate's subject CN).
      #   An OV certificate: WIN_CSC_LINK (the .pfx, base64), WIN_CSC_KEY_PASSWORD and ALTHAR_WIN_PUBLISHER.
      - name: Sign (skipped until Althar has a Windows certificate)
        if: ${{ vars.ALTHAR_WINDOWS_SIGNING == 'true' }}
        run: |
          echo "::error::ALTHAR_WINDOWS_SIGNING is on, but package.ts's WINDOWS_SIGNING slot isn't filled in yet."
          exit 1
      - name: Package
        env:
          ALTHAR_POSTHOG_KEY: ${{ secrets.ALTHAR_POSTHOG_KEY }}
          ALTHAR_POSTHOG_HOST: ${{ secrets.ALTHAR_POSTHOG_HOST }}
          ALTHAR_REPORT_URL: ${{ secrets.ALTHAR_REPORT_URL }}
        run: |
          for name in ALTHAR_POSTHOG_KEY ALTHAR_POSTHOG_HOST ALTHAR_REPORT_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty: the release environment has no secret of that name."; exit 1; fi
          done
          bun run package
      - name: Install, check and uninstall
        run: bash scripts/windows-smoke.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            apps/desktop/out/dist/Althar-*-x64-setup.exe
            apps/desktop/out/dist/Althar-*-x64-setup.exe.blockmap
            apps/desktop/out/dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  # ONE draft release for the version, with every platform's files: made, or brought up to date when a run is repeated.
  # It uses only the run's own token, so it needs no approval of its own. A person publishes the draft on GitHub.
  draft:
    needs: [check, mac, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # One at a time across every run, so a tag's run and a run by hand can't each make a draft.
    concurrency:
      group: release-draft
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: The draft release
        run: |
          notes="apps/desktop/release-notes/$VERSION.md"
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$state" = false ]; then
            echo "::error::$TAG was published while this ran; nothing is changed."
            exit 1
          fi
          if [ "$state" = true ]; then
            # The draft is pointed at this run's commit too: a draft from an earlier run by hand may target another one.
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "Althar $VERSION" --notes-file "$notes"
            gh release upload "$TAG" release/* --clobber
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            gh release create "$TAG" release/* --draft --verify-tag --title "Althar $VERSION" --notes-file "$notes"
          else
            gh release create "$TAG" release/* --draft --target "$GITHUB_SHA" --title "Althar $VERSION" --notes-file "$notes"
          fi
          echo "### Draft release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "$(gh release view "$TAG" --json url --jq .url). Smoke-test its dmg and Windows installer, then publish it there." >> "$GITHUB_STEP_SUMMARY"
