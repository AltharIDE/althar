name: desktop

# On a pull request: the desktop app's checks and the unit tests its change reaches, the app's whole end-to-end run
# (e2e.yml) when it reaches the app (packages/testing/src/select.ts), and Windows' smoke test when what reaches the app is
# code that behaves differently there. In the merge queue, only the checks and unit tests that both an entry and what
# landed beneath it reach (queue.yml): the end-to-end runs and the coverage gate are the pull request's, and run again
# after merge. Windows' affected unit tests run separately in windows.yml; full suites, coverage and packages run after
# merge in post-merge.yml.
on:
  # From queue.yml, for a pull request in the merge queue.
  workflow_call:
  pull_request:
    # And when a draft is ready for review: a draft's end-to-end runs wait for it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      [
        'apps/desktop/**',
        'packages/connectors/**',
        'packages/contracts/**',
        'packages/transport-node/**',
        'packages/domain/**',
        'packages/persistence-sqlite/**',
        'packages/provider-adapters/**',
        'packages/runtime/**',
        'packages/skills/**',
        'packages/ui/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        '.bun-version',
        '.node-version',
        'lint/**',
        'patches/**',
        'packages/testing/**',
        '.github/actions/flaky/**',
        '.github/actions/electron/**',
        '.github/workflows/desktop.yml',
        '.github/workflows/e2e.yml',
      ]

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the change reaches: the desktop app's checks or not, which of its tests, and whether the end-to-end runs do.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      any: ${{ steps.plan.outputs.any }}
      e2e: ${{ steps.plan.outputs.e2e }}
      windows-e2e: ${{ steps.plan.outputs.windows-e2e }}
      native-homes: ${{ steps.native.outputs.homes }}
      native-computer: ${{ steps.computer.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # What the change is: against the pull request's base, or in the merge queue against main, since the build at a
      # group's head merges the whole group when it passes, and so must cover every entry in it.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE" ] && git fetch --no-tags --depth=1 origin "$BASE"; then
            git diff --name-only --no-renames FETCH_HEAD HEAD > "$RUNNER_TEMP/changed"
          else
            echo '*' > "$RUNNER_TEMP/changed"
          fi
      # In the merge queue, each entry's own change and what landed beneath it (queue.yml), when it could say.
      - if: github.event_name == 'merge_group'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: queue-entries
          path: ${{ runner.temp }}/queue
      # A draft runs its checks and unit tests, and its end-to-end runs once it is ready for review.
      - id: plan
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          QUEUE_ENTRIES: ${{ github.event_name == 'merge_group' && format('{0}/queue/entries.json', runner.temp) || '' }}
        run: bun packages/testing/src/select.ts plan desktop "$RUNNER_TEMP/changed"
      # Connection credentials must survive a real desktop relaunch using each OS's own keyring.
      - id: native
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          bun -e '
            const paths = (await Bun.file(`${process.env.RUNNER_TEMP}/changed`).text()).split("\n").filter(Boolean)
            const globs = [
              "apps/desktop/src/main/homes/**", "apps/desktop/src/main/{main,homeBridge}.ts",
              "apps/desktop/src/connection/**", "apps/desktop/src/homes.ts", "apps/desktop/src/preload/**",
              "apps/desktop/src/renderer/features/homes/**", "apps/desktop/e2e/{pairing.spec,support,networkHost,networkHost.config}.ts",
              "apps/desktop/{package.json,vite.node.config.ts}", "packages/transport-node/**", "packages/contracts/**",
              "packages/runtime/src/{networkApi,DevicePairings,ClientIdentities}.ts",
              ".github/{actions/electron/**,workflows/desktop.yml}", "{bun.lock,.bun-version,.node-version}"
            ].map((path) => new Bun.Glob(path))
            console.log(`homes=${process.env.DRAFT !== "true" && paths.some((path) => path === "*" || globs.some((glob) => glob.match(path)))}`)
          ' >> "$GITHUB_OUTPUT"
      - id: computer
        run: |
          bun -e '
            const paths = (await Bun.file(`${process.env.RUNNER_TEMP}/changed`).text()).split("\n").filter(Boolean)
            const globs = [
              "apps/desktop/src/{computer,main/computer}/**", "apps/desktop/src/main/main.ts",
              "apps/desktop/src/{preload,runtime}/**", "apps/desktop/src/renderer/features/task/ComputerUse*",
              "apps/desktop/e2e/{computerUse.spec,support}.ts", "apps/desktop/e2e/fixtures/computer-app/**",
              "apps/desktop/{package.json,vite.node.config.ts}", "packages/runtime/**",
              "packages/provider-adapters/src/testing/FakeAgent.ts",
              ".github/{actions/electron/**,workflows/desktop.yml}", "{bun.lock,.bun-version,.node-version}"
            ].map((path) => new Bun.Glob(path))
            console.log(`run=${paths.some((path) => path === "*" || globs.some((glob) => glob.match(path)))}`)
          ' >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
        with:
          binary: 'false'
      # Ubuntu 24.04 keeps unprivileged user namespaces from apps, and Chromium's sandbox needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - env:
          PLAN: ${{ needs.plan.outputs.jobs }}
        run: bun packages/testing/src/select.ts run
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  # The app itself on Windows, where no one here works day to day: built unpackaged, started, and a project made of a
  # repository (e2e/smoke.spec.ts). On the pull request only, for code that behaves differently there; after merge,
  # post-merge.yml runs it on every merge, with Windows' unit tests.
  windows-e2e:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.windows-e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - run: bun run test:e2e e2e/smoke.spec.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: windows-e2e
          path: apps/desktop/test-results
          retention-days: 7
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  native-computer:
    name: native computer use (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.native-computer == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      ALTHAR_TEST_NATIVE_COMPUTER: portable
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
      # The display is xvfb-run's, with its window manager, so the run keeps it (apps/desktop/scripts/display.ts).
      - if: runner.os == 'Linux'
        env:
          ALTHAR_E2E_DISPLAY: inherit
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfwm4 wmctrl xvfb xauth
          dbus-run-session -- xvfb-run --auto-servernum -s '-screen 0 1440x1000x24' bash -e -c '
            xfwm4 --compositor=on &
            manager=$!
            trap "kill $manager 2>/dev/null || true" EXIT
            timeout 15 bash -c "until wmctrl -m >/dev/null 2>&1; do sleep 0.2; done"
            bun run test:e2e e2e/computerUse.spec.ts --reporter=list
          '
      # Let the app inherit the native Windows search path, as it does from Explorer.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command git | Select-Object -ExpandProperty Source
          bun run test:e2e e2e/computerUse.spec.ts --reporter=list --retries=0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-computer-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 7

  native-homes:
    name: native pairing (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.native-homes == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
      # An isolated, unlocked real keychain avoids a runner image's login-keychain prompts.
      - if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/althar-native.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          # The spec runs its native macOS part only where this is set.
          echo "ALTHAR_E2E_ISOLATED_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          # Grant this test's real Electron binary access to its own fixture secret, avoiding an unattended consent dialog.
          electron="$(node -p 'require("electron")')"
          # The unpackaged binary may initialize OSCrypt under its bundle name before JS applies the app name.
          for application in Electron Althar; do
            security add-generic-password -a "$application" -s "$application Safe Storage" -w "$(openssl rand -base64 24)" -T "$electron" "$keychain"
          done
      - run: bun run test:e2e e2e/pairing.spec.ts --reporter=list
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: native-pairing-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 7
      - if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/althar-native.keychain-db"

  # On the pull request; after merge, post-merge.yml measures the app's whole coverage.
  home-coverage:
    name: home connection coverage
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.native-homes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/electron
        with:
          binary: 'false'
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: ./.github/actions/flaky/quarantine
      - run: bun run test:coverage
      - name: Show remaining branch coverage gaps
        if: failure()
        run: |
          bun -e '
            const file = Bun.file("coverage/coverage-final.json")
            if (!(await file.exists())) process.exit(0)
            const report = await file.json()
            const rows = Object.entries(report).map(([file, value]) => {
              const branches = Object.entries(value.b).flatMap(([id, hits]) =>
                hits.map((hit, index) => ({ hit, line: value.branchMap[id].locations[index]?.start.line ?? value.branchMap[id].line })))
              return { file: file.split("src/renderer/").at(-1), total: branches.length,
                covered: branches.filter((branch) => branch.hit > 0).length,
                missing: branches.filter((branch) => branch.hit === 0).map((branch) => branch.line) }
            })
            const total = rows.reduce((sum, row) => sum + row.total, 0)
            const covered = rows.reduce((sum, row) => sum + row.covered, 0)
            console.log(JSON.stringify({ total, covered, needed: Math.ceil(total * .9) - covered }))
            for (const row of rows.sort((a, b) => b.missing.length - a.missing.length).slice(0, 25))
              console.log(JSON.stringify(row))
          '
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: home-coverage-${{ github.run_attempt }}
          path: apps/desktop/coverage/coverage-final.json
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        uses: ./.github/actions/flaky

  # The app's whole end-to-end run, in four parts, when the change reaches the app: on the pull request, so a change
  # that breaks a spec it didn't touch fails where it was made, and again after merge, on main (post-merge.yml).
  e2e:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
