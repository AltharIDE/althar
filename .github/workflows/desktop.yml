name: desktop

# On a pull request, and for its entry in the merge queue: the desktop app's checks and the unit tests its change
# reaches, and the app's whole end-to-end run (e2e.yml) when it reaches the app (packages/testing/src/select.ts). On a
# pull request, Windows' smoke test too, when what reaches the app is code that behaves differently there. Windows'
# unit tests, the coverage gate and the packages run after merge, in post-merge.yml.
on:
  # From queue.yml, for a pull request in the merge queue.
  workflow_call:
  pull_request:
    # And when a draft is ready for review: a draft's end-to-end runs wait for it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      [
        'apps/desktop/**',
        'packages/connectors/**',
        'packages/contracts/**',
        'packages/domain/**',
        'packages/persistence-sqlite/**',
        'packages/provider-adapters/**',
        'packages/runtime/**',
        'packages/ui/**',
        'package.json',
        'bun.lock',
        'vite.config.ts',
        '.bun-version',
        '.node-version',
        'lint/**',
        'patches/**',
        'packages/testing/**',
        '.github/actions/flaky/**',
        '.github/workflows/desktop.yml',
        '.github/workflows/e2e.yml',
      ]

permissions:
  contents: read
  issues: write

# Where the test reporters write which tests were flaky, for the Flaky tests step (.github/actions/flaky).
env:
  FLAKY_REPORT: ${{ github.workspace }}/flaky.jsonl

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the change reaches: the desktop app's checks or not, which of its tests, and whether the end-to-end runs do.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      any: ${{ steps.plan.outputs.any }}
      e2e: ${{ steps.plan.outputs.e2e }}
      windows-e2e: ${{ steps.plan.outputs.windows-e2e }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # What the change is: against the pull request's base, or in the merge queue against main, since the build at a
      # group's head merges the whole group when it passes, and so must cover every entry in it.
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_ref }}
        run: |
          if [ -n "$BASE" ] && git fetch --no-tags --depth=1 origin "$BASE"; then
            git diff --name-only --no-renames FETCH_HEAD HEAD > "$RUNNER_TEMP/changed"
          else
            echo '*' > "$RUNNER_TEMP/changed"
          fi
      # A draft runs its checks and unit tests, and its end-to-end runs once it is ready for review.
      - id: plan
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: bun packages/testing/src/select.ts plan desktop "$RUNNER_TEMP/changed"

  verify:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # Ubuntu 24.04 keeps unprivileged user namespaces from apps, and Chromium's sandbox needs them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - env:
          PLAN: ${{ needs.plan.outputs.jobs }}
        run: bun packages/testing/src/select.ts run
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  # The app itself on Windows, where no one here works day to day: built unpackaged, started, and a project made of a
  # repository (e2e/smoke.spec.ts). On the pull request only, for code that behaves differently there; after merge,
  # post-merge.yml runs it on every merge, with Windows' unit tests.
  windows-e2e:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.windows-e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/AppData/Local/electron/Cache
          key: windows-bun-${{ hashFiles('bun.lock') }}
          restore-keys: windows-bun-
      - run: bun install --frozen-lockfile
        working-directory: .
      # Tests with an open flaky issue run, but don't fail this job (packages/testing).
      - uses: ./.github/actions/flaky/quarantine
      - run: bun run test:e2e e2e/smoke.spec.ts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: windows-e2e
          path: apps/desktop/test-results
          retention-days: 7
      # Tests that failed, then passed on their retry, filed as issues (packages/testing).
      - if: always()
        uses: ./.github/actions/flaky

  # The app's whole end-to-end run, in four parts, when the change reaches the app: on the pull request, so a change
  # that breaks a spec it didn't touch fails where it was made, and again in the merge queue, on main as it will be.
  e2e:
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
